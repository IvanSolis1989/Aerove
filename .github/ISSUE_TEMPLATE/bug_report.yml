name: 故障反馈 / Bug report
description: 连接、配置导入、界面、崩溃或安装更新异常
title: "[故障] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索 [AEROVE 已有问题](https://github.com/IvanSolis1989/Aerove/issues)。MiMo AI 会使用公开文字和仓库片段初步分析，维护者确认最终结论。
        不要贴订阅链接、节点密码、令牌或未脱敏备份；日志只需故障发生前后的相关片段。
        Lite 目前在开发验证中，仅面向 Android 13 及以上；两版版本号、内核和更新入口独立。
  - type: dropdown
    id: edition
    attributes:
      label: 产品版本 / Edition
      options: [AEROVE 标准版, AEROVE Lite, 两版均可复现, 不确定]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本与来源 / Version and source
      description: 复制关于页完整版本（含构建号），注明正式版、预览版或自行构建；可附 Release 链接或源码 SHA
      placeholder: "标准版 0.9.x+构建号，官方 GitHub Release；Lite 请填独立版本"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 系统 / Platform
      options: [Android, Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统版本与设备 / OS and device
      description: Android 填机型与系统版本；桌面填系统版本和架构，Linux 补充桌面环境及 X11/Wayland
      placeholder: "例：Pixel 8，Android 16；Windows 11 24H2，x64"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 出问题的功能 / Area
      options: [安装或更新, 启动或崩溃, VPN/TUN/系统代理与启停, DNS/IPv6/规则命中, 配置与订阅导入或更新, 节点选择或测速, 界面/主题/动画/无障碍, 备份或恢复, 其他]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、预期与实际 / Reproduction
      placeholder: |
        1. 从哪个页面、什么状态开始？
        2. 做了哪些操作，出现什么结果？
        预期：
        实际：
        频率：每次 / 偶发；最后正常版本（知道才填）：
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: 相关条件 / Conditions
      description: 仅填有关项；网络问题说明 Wi-Fi/移动网络、接管方式与模式；界面问题说明材质、底图、深浅色、字体缩放及减少动态效果设置
      placeholder: "例：VPN 模式，规则模式，Wi-Fi 切换到移动网络后出现；或流光清透＋灵动极光＋深色"
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志、截图或录屏 / Evidence
      description: 贴相关报错和时间点。无法启动或无法获取日志时直接说明原因，不要求上传整份配置
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已搜索本仓库已有问题，并确认附件和文字未包含订阅、凭据或个人信息
          required: true
