name: 功能建议 / Feature request
description: 描述使用场景、现有障碍与可验证的预期效果
title: "[建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        AEROVE 标准版与 Lite 的共同客户端功能需双向评估；平台专有能力请说明适用条件。
        MiMo AI 会使用公开文字和仓库片段初步评估，不承诺采纳、排期或自动修改代码。
  - type: dropdown
    id: edition
    attributes:
      label: 涉及版本 / Edition
      options: [两版共同功能, AEROVE 标准版, AEROVE Lite, 不确定]
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: 适用平台 / Platforms
      multiple: true
      options: [Android, Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前障碍 / Problem
      description: 你在什么任务中遇到什么不便？当前版本怎样处理？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望效果与验收方式 / Expected result
      description: 描述入口、操作和结果；涉及后台、网络接管或 UI 时，说明性能、用户数据及无障碍需求
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式与参考 / Alternatives
      description: 现有设置能否解决？可附其他项目、截图或公开文档作参考，并说明为什么适合 AEROVE
