name: 使用求助 / Question
description: 设置、导入、网络模式或版本选择方面的疑问
title: "[求助] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        MiMo AI 会使用公开文字和当前仓库片段给出初步建议。补充信息可直接评论；维护者可通过 `/ai-help` 请求深度分析。
        不要公开订阅地址、节点凭据、API 密钥或个人数据。
  - type: dropdown
    id: edition
    attributes:
      label: 产品版本 / Edition
      options: [AEROVE 标准版, AEROVE Lite, 两版, 尚未安装或不确定]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 应用版本与系统 / Version and OS
      description: 已安装时填关于页完整版本、系统版本和设备；安装前咨询可写尚未安装
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 想实现什么、卡在哪一步 / Question
      description: 说明操作入口、已尝试的方法、预期和实际结果；网络问题补充接管方式及 Wi-Fi/移动网络情况
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 相关设置、脱敏日志或截图 / Evidence
      description: 只提供相关片段，上传前遮盖敏感信息
