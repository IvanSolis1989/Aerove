name: AEROVE Lite original run84 matrix diagnosis only
defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
'on':
  workflow_call:
    inputs:
      runtime_target:
        type: string
        required: false
        default: original84
      exclusive_mode:
        type: boolean
        required: true
      shard_index:
        type: number
        required: false
        default: -1
      sample:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  android-qa:
    name: ${{ inputs.runtime_target == 'lite158-frame-sample' && 'original run158 single frame trace (diagnostic only)' || inputs.runtime_target == 'lite141-prebuilt-shards' && format('original run141 remaining shard {0}/8', inputs.shard_index) || inputs.runtime_target == 'beta14' && 'diagnostic original run107 beta14 profile (matrix)' || inputs.runtime_target == 'lite94' && 'diagnostic original run94 (matrix)' || 'original run84 (matrix)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      AEROVE_CLEAR_FRAME_TRACE: ${{ (inputs.runtime_target == 'lite94' || inputs.runtime_target == 'beta14' || inputs.runtime_target == 'lite158-frame-sample') && '1' || '0' }}
      AEROVE_REQUIRE_FRAME_TRACE: ${{ (inputs.runtime_target == 'lite94' || inputs.runtime_target == 'beta14' || inputs.runtime_target == 'lite158-frame-sample') && '1' || '0' }}
      AEROVE_BETA14_PROFILE: ${{ inputs.runtime_target == 'beta14' && '1' || '0' }}
    steps:
    - name: Reject mixed build, preflight, QA79 or publication modes
      env:
        EXCLUSIVE: ${{ inputs.exclusive_mode }}
        RUNTIME_TARGET: ${{ inputs.runtime_target }}
        SHARD_INDEX: ${{ inputs.shard_index }}
        SAMPLE: ${{ inputs.sample }}
      run: |
        test "$EXCLUSIVE" = true
        case "$RUNTIME_TARGET" in original84|lite94|beta14|lite141-prebuilt-shards|lite158-frame-sample) ;; *) echo 'Unknown immutable runtime target' >&2; exit 2 ;; esac
        if [[ "$RUNTIME_TARGET" == lite158-frame-sample ]]; then
          [[ "$SAMPLE" == solid ]] || { echo 'Lite158 requires its one fixed solid source-frame sample.' >&2; exit 2; }
        else
          [[ -z "$SAMPLE" ]] || { echo 'Sample input is only valid for Lite158 frame diagnosis.' >&2; exit 2; }
        fi
        if [[ "$RUNTIME_TARGET" == lite141-prebuilt-shards ]]; then
          [[ "$SHARD_INDEX" =~ ^[0-7]$ ]] || { echo 'Lite141 diagnostic requires one shard index 0..7' >&2; exit 2; }
        else
          [[ "$SHARD_INDEX" == -1 ]] || { echo 'Shard index is only valid for Lite141 diagnostics' >&2; exit 2; }
        fi
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Checkout immutable Lite141 source for Smart fixture ownership
      if: ${{ inputs.runtime_target == 'lite141-prebuilt-shards' }}
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: d139a59b13275c9c2b207d0dc936fd37d93249b3
        path: .ci-original-lite141-source
        persist-credentials: false
        sparse-checkout: apps/aerove/assets/data/ASN.mmdb
        sparse-checkout-cone-mode: false
    - name: Checkout fixed Smart fixture sources
      if: ${{ inputs.runtime_target == 'lite141-prebuilt-shards' }}
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: IvanSolis1989/Smart-Config-Kit
        ref: dba12215fe8f8d139a94fbd2d5b981282fbcf9c7
        path: .ci-fixture-sources/smart-config
        persist-credentials: false
        fetch-depth: 1
        sparse-checkout: |
          Meow内核系
          rulesets/generated/fused
          tools/lib
    - name: Prepare and verify Smart fixture under original App identity
      if: ${{ inputs.runtime_target == 'lite141-prebuilt-shards' }}
      timeout-minutes: 5
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        python3 apps/aerove-lite/tool/prepare_lite141_smart_fixture.py \
          --app-repository "$GITHUB_WORKSPACE/.ci-original-lite141-source" \
          --smart-repository "$GITHUB_WORKSPACE/.ci-fixture-sources/smart-config" \
          --geo-cache "$RUNNER_TEMP/lite-smart-geodata" --download \
          --output "$RUNNER_TEMP/lite-smart-config-meow" \
          --receipt "$RUNNER_TEMP/lite-diagnostics/remaining/smart-fixture-source.json"
        echo "SMART_CONFIG_MEOW_FIXTURE_DIR=$RUNNER_TEMP/lite-smart-config-meow" >> "$GITHUB_ENV"
        echo "SMART_CONFIG_MEOW_FIXTURE_RECEIPT=$RUNNER_TEMP/lite-diagnostics/remaining/smart-fixture-source.json" >> "$GITHUB_ENV"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Existing API33 emulator environment with unchanged configuration
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: 'set -euo pipefail

        sdkmanager --install ''build-tools;35.0.0'' emulator ''system-images;android-33;google_apis;x86_64'' --channel=0

        mkdir -p "$RUNNER_TEMP/lite-diagnostics/matrix"

        "$ANDROID_HOME/emulator/emulator" -no-window -version > "$RUNNER_TEMP/lite-diagnostics/matrix/emulator-version.txt" 2>&1

        grep -E ''37\.2\.12\.0.*16428233'' "$RUNNER_TEMP/lite-diagnostics/matrix/emulator-version.txt"

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        echo no | avdmanager create avd --force -n test --package ''system-images;android-33;google_apis;x86_64'' --device pixel_6

        avd_directory="${ANDROID_AVD_HOME:-$HOME/.android/avd}"

        printf ''hw.cpu.ncore=2\n'' >> "$avd_directory/test.avd/config.ini"

        cp "$avd_directory/test.avd/config.ini" "$RUNNER_TEMP/lite-diagnostics/matrix/avd-config.ini"

        '
    - name: Verify original run84 runtime and execute matrix with owned emulator
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      env:
        RUNTIME_TARGET: ${{ inputs.runtime_target }}
        RUNTIME_DIRECTORY: ${{ inputs.runtime_target == 'lite158-frame-sample' && 'lite158-original-frame-runtime' || inputs.runtime_target == 'lite141-prebuilt-shards' && 'lite141-original-shards-runtime' || inputs.runtime_target == 'beta14' && 'beta14-original-runtime' || inputs.runtime_target == 'lite94' && 'lite94-original-runtime' || 'qa84-original-runtime' }}
        SHARD_INDEX: ${{ inputs.shard_index }}
        ORIGINAL_SAMPLE: ${{ inputs.sample }}
      run: |
        if [[ "$RUNTIME_TARGET" == lite158-frame-sample ]]; then
          python3 apps/aerove-lite/tool/emulator_original84.py --target "$RUNTIME_TARGET" --sample "$ORIGINAL_SAMPLE" --directory "$RUNNER_TEMP/$RUNTIME_DIRECTORY"
        elif [[ "$RUNTIME_TARGET" == lite141-prebuilt-shards ]]; then
          python3 apps/aerove-lite/tool/emulator_original84.py --target "$RUNTIME_TARGET" --phase remaining --shard-index "$SHARD_INDEX" --directory "$RUNNER_TEMP/$RUNTIME_DIRECTORY"
        else
          python3 apps/aerove-lite/tool/emulator_original84.py --target "$RUNTIME_TARGET" --directory "$RUNNER_TEMP/$RUNTIME_DIRECTORY"
        fi
    - name: Preserve original84 identity and raw owned matrix evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ inputs.runtime_target == 'lite158-frame-sample' && format('AEROVE-Lite-original158-frame-sample-attempt-{0}', github.run_attempt) || inputs.runtime_target == 'lite141-prebuilt-shards' && format('AEROVE-Lite-original141-shard-{0}-of-8-attempt-{1}', inputs.shard_index, github.run_attempt) || inputs.runtime_target == 'beta14' && format('AEROVE-Lite-beta14-profile-matrix-{0}', github.run_attempt) || inputs.runtime_target == 'lite94' && format('AEROVE-Lite-diagnostic94-matrix-{0}', github.run_attempt) || format('AEROVE-Lite-QA84-matrix-{0}', github.run_attempt) }}
        path: ${{ (inputs.runtime_target == 'lite141-prebuilt-shards' || inputs.runtime_target == 'lite158-frame-sample') && format('{0}/lite-diagnostics/', runner.temp) || format('{0}/lite-diagnostics/matrix/', runner.temp) }}
        if-no-files-found: error
