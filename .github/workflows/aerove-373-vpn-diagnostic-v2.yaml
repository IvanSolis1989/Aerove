name: AEROVE Original 373 VPN Diagnostic V2
on:
  push:
    branches: [diagnostics/aerove-373-vpn-diagnostic-v2-20261125]
    paths:
      - .github/workflows/aerove-373-vpn-diagnostic-v2.yaml
      - tools/diagnostics/aerove-373-vpn-diagnostic/**
permissions:
  contents: read
  actions: read
concurrency:
  group: aerove-373-vpn-diagnostic-v2-20261125
  cancel-in-progress: false
jobs:
  vpn:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'IvanSolis1989/Aerove' &&
      github.actor == 'IvanSolis1989' &&
      github.ref == 'refs/heads/diagnostics/aerove-373-vpn-diagnostic-v2-20261125' &&
      github.run_attempt == 1 && github.event.created
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AEROVE_GUEST_ANGLE: "1"
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - name: Original SDK and exact prebuilt VPN diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          umask 077
          private="$(mktemp -d "$RUNNER_TEMP/aerove-373-vpn.XXXXXX")"
          trap 'rm -rf -- "$private"' EXIT
          set +e
          (
            set -euo pipefail
            printf 'host-kvm\n' >"$private/phase"
            test "$(uname -m)" = x86_64
            test -c /dev/kvm
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            printf 'guest-image\n' >"$private/phase"
            timeout --signal=TERM --kill-after=10s 180s sdkmanager --install 'system-images;android-33;google_apis;x86_64' --channel=0 </dev/null
            image="$ANDROID_HOME/system-images/android-33/google_apis/x86_64/source.properties"
            grep -Eq '^AndroidVersion.ApiLevel[[:space:]]*=[[:space:]]*33[[:space:]]*$' "$image"
            grep -Eq '^SystemImage.Abi[[:space:]]*=[[:space:]]*x86_64[[:space:]]*$' "$image"
            grep -Eq '^SystemImage.TagId[[:space:]]*=[[:space:]]*google_apis[[:space:]]*$' "$image"
            rev="$(sed -nE 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*([0-9]{1,3})[[:space:]]*$/\1/p' "$image")"
            [[ "$rev" =~ ^[0-9]{1,3}$ ]]
            printf 'r%s\n' "$rev" >"$private/guest-image-revision"
            printf 'avd\n' >"$private/phase"
            printf 'no\n' | avdmanager create avd --force -n test --package 'system-images;android-33;google_apis;x86_64' --device pixel_6
            avd="${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini"
            sed -i '/^[[:space:]]*disk\.dataPartition\.size[[:space:]]*=/d' "$avd"
            printf 'hw.cpu.ncore=2\ndisk.dataPartition.size=4G\n' >> "$avd"
            printf 'emulator\n' >"$private/phase"
            url='https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip'
            archive="$private/emulator.zip"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 240 -o "$archive" "$url"
            test "$(stat -c '%s' "$archive")" = '349658551'
            printf '%s  %s\n' 'cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd' "$archive" | sha256sum --check --strict
            unzip -q "$archive" -d "$private/extracted"
            test -x "$private/extracted/emulator/emulator"
            if test -e "$ANDROID_HOME/emulator"; then mv "$ANDROID_HOME/emulator" "$private/previous-emulator"; fi
            mv "$private/extracted/emulator" "$ANDROID_HOME/emulator"
            "$ANDROID_HOME/emulator/emulator" -no-window -version 2>&1 | grep -E '37\.2\.13\.0.*16740729'
            "$ANDROID_HOME/emulator/emulator" -accel-check
            printf 'apksigner\n' >"$private/phase"
            if ! test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"; then
              timeout --signal=TERM --kill-after=10s 180s sdkmanager --install 'build-tools;37.0.0' --channel=0 </dev/null
            fi
            test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
            printf 'owner-import\n' >"$private/phase"
            export RUNNER_TEMP="$private" PYTHONDONTWRITEBYTECODE=1
            export PYTHONPATH="$GITHUB_WORKSPACE/apps/aerove-lite/tool:$GITHUB_WORKSPACE/tooling"
            ulimit -c 0
            python3 -B tools/diagnostics/aerove-373-vpn-diagnostic/own_emulator.py "$private/original373"
          ) >"$private/setup-and-probe.stdout" 2>"$private/setup-and-probe.stderr"
          status=$?
          set -e

          python3 -I tools/diagnostics/aerove-373-vpn-diagnostic/summary.py "$private" "$status" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
