name: Review upstream reference

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published FlClash release tag to inspect; never merged automatically
        type: string
        required: true

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'IvanSolis1989/Aerove'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REFERENCE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const owner = 'chen08209';
            const repo = 'FlClash';
            const tag = process.env.REFERENCE_TAG;
            const match = /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.exec(tag);
            if (!match || (match[1] && match[1].split('.').some(part => /^0\d+$/.test(part)))) {
              throw new Error('An exact semantic release tag is required');
            }
            const {data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag});
            if (release.draft || !release.published_at ||
                !release.assets.some(asset => asset.state === 'uploaded' && asset.size > 0)) {
              throw new Error('The reference must be a public release with downloadable assets');
            }
            let {data: ref} = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
            let object = ref.object;
            const seen = new Set();
            while (object.type === 'tag') {
              if (seen.has(object.sha) || seen.size >= 8) throw new Error('Invalid tag chain');
              seen.add(object.sha);
              const {data: annotated} = await github.rest.git.getTag({owner, repo, tag_sha: object.sha});
              object = annotated.object;
            }
            if (object.type !== 'commit' || !/^[0-9a-f]{40}$/.test(object.sha)) {
              throw new Error('The release tag must resolve to a full commit');
            }
            await core.summary
              .addHeading('Upstream reference only')
              .addLink(`${owner}/${repo} ${tag}`, release.html_url)
              .addTable([
                [{data: 'Source', header: true}, {data: 'Value', header: true}],
                ['Commit', object.sha],
                ['Published', release.published_at],
                ['Channel', release.prerelease ? 'preview' : 'stable'],
              ])
              .addRaw('No source was merged, no branch was pushed, and no APK was built.')
              .write();
            core.setOutput('commit', object.sha);
