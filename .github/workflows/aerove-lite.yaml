        python3 - <<'PY'
        import hashlib, json, os, re, shutil, subprocess, sys
        import xml.etree.ElementTree as ET
        from pathlib import Path
        sys.path.insert(0, 'apps/aerove-lite/tool')
        from verify_apk import signing_certificate
