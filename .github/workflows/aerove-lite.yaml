    uses: ./.github/workflows/aerove-lite-build.yaml
    with:
      abi: x86_64
      target: x86_64-linux-android
    secrets: inherit
    permissions:
      contents: read
      actions: read
  standard_original_reference:
    name: Std 原包 Android 取图诊断（不构建）
    continue-on-error: ${{ !inputs.diagnostic_target || inputs.diagnostic_target == 'none' }}
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (github.event_name == 'workflow_dispatch' && (inputs.diagnostic_target == 'std40' || inputs.diagnostic_target == 'both')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate exclusive immutable Android diagnostic request
        if: ${{ inputs.diagnostic_target && inputs.diagnostic_target != 'none' }}
        env:
          REQUEST_EVENT: ${{ github.event_name }}
          DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
          MEOW_HOST_ONLY: ${{ inputs.meow_host_only }}
          QA84_ONLY: ${{ inputs.qa84_only }}
          QA79_ONLY: ${{ inputs.qa79_only }}
          CLIENT_PREFLIGHT: ${{ inputs.client_preflight }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          NATIVE_PREFLIGHT: ${{ inputs.native_preflight }}
          NATIVE_TEST_SERIAL: ${{ inputs.native_test_serial }}
          NATIVE_UNDERLAY_TESTS: ${{ inputs.native_underlay_tests }}
          NATIVE_TEST_STACKS: ${{ inputs.native_test_stacks }}
          NATIVE_TEST_FILTER: ${{ inputs.native_test_filter }}
        run: |
          python3 - <<'PY'
          import os
          value = os.environ['DIAGNOSTIC_TARGET']
          conflicts = [key for key in ('MEOW_HOST_ONLY', 'QA84_ONLY', 'QA79_ONLY', 'CLIENT_PREFLIGHT', 'PUBLISH_RELEASE', 'NATIVE_PREFLIGHT', 'NATIVE_TEST_SERIAL', 'NATIVE_UNDERLAY_TESTS', 'NATIVE_TEST_STACKS') if os.environ[key] == 'true']
          if os.environ['NATIVE_TEST_FILTER']:
              conflicts.append('NATIVE_TEST_FILTER')
          if value not in ('lite94-matrix', 'std40', 'both') or os.environ['REQUEST_EVENT'] != 'workflow_dispatch' or conflicts:
              raise SystemExit('Invalid prebuilt Android diagnosis target/event or conflicting inputs: ' + repr((value, conflicts)))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - name: Read original Std 40 artifact without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: IvanSolis1989/Aerove
          run-id: 40082294388
          artifact-ids: 12555818245
          merge-multiple: true
          path: ${{ runner.temp }}/standard-original-input
      - name: Existing API33 image, emulator and KVM configuration
        shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          STANDARD_REFERENCE_ROOT="$RUNNER_TEMP/standard-original-reference"
          printf 'STANDARD_REFERENCE_ROOT=%s\n' "$STANDARD_REFERENCE_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$STANDARD_REFERENCE_ROOT/environment"
          timeout --kill-after=10s 240s sdkmanager --install 'build-tools;35.0.0' emulator --channel=0
          timeout --kill-after=5s 20s "$ANDROID_HOME/emulator/emulator" -no-window -version > "$STANDARD_REFERENCE_ROOT/environment/emulator-version.txt" 2>&1
          grep -E '37\.2\.12\.0.*16428233' "$STANDARD_REFERENCE_ROOT/environment/emulator-version.txt"
          legacy_sdk_dir="$ANDROID_HOME/cmdline-tools/latest"
          test -x "$legacy_sdk_dir/bin/sdkmanager"
          grep -Fx 'Pkg.Revision=12.0' "$legacy_sdk_dir/source.properties" > "$STANDARD_REFERENCE_ROOT/environment/legacy-sdk-version.txt"
          if timeout --kill-after=10s 120s "$legacy_sdk_dir/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses \
              > "$STANDARD_REFERENCE_ROOT/environment/legacy-sdk-licenses.log" 2>&1 <<< "$(printf 'y\n%.0s' {1..64})"; then
            printf '0\n' > "$STANDARD_REFERENCE_ROOT/environment/legacy-sdk-licenses.exit.txt"
          else
            legacy_license_rc=$?
            printf 'SDK_LICENSE_CLI_EXIT=%s\n' "$legacy_license_rc" >&2 || true
            exit "$legacy_license_rc"
          fi
          test -s "$ANDROID_HOME/licenses/android-sdk-preview-license" || { echo '::error::Existing SDK setup has not recorded the official preview license'; exit 1; }
          image_archive="$RUNNER_TEMP/std-play33-r01.zip"
          timeout --kill-after=10s 250s curl --fail --location --proto '=https' --tlsv1.2 --max-time 240 \
            --output "$image_archive" 'https://dl.google.com/android/repository/sys-img/google_apis_playstore/x86_64-33_r01.zip'
          timeout --kill-after=10s 180s python3 apps/aerove-lite/tool/standard_reference/install_play33_r01.py \
            --archive "$image_archive" --sdk "$ANDROID_HOME" \
            --receipt "$STANDARD_REFERENCE_ROOT/environment/IMAGE-IDENTITY.json"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/standard-original-reference-avd"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          avd_directory="$ANDROID_AVD_HOME"
          mkdir -p "$avd_directory"
          echo no | timeout --kill-after=5s 30s avdmanager create avd --force -n test --package 'system-images;android-33-ext4;google_apis_playstore;x86_64' --device pixel_6 -p "$avd_directory/test.avd"
          test -s "$avd_directory/test.ini"
          test -s "$avd_directory/test.avd/config.ini"
          printf 'hw.cpu.ncore=2\n' >> "$avd_directory/test.avd/config.ini"
          cp "$avd_directory/test.avd/config.ini" "$STANDARD_REFERENCE_ROOT/environment/avd-config.ini"
          cp "$avd_directory/test.ini" "$STANDARD_REFERENCE_ROOT/environment/avd-descriptor.ini"
      - name: Record diagnostic-only original Std and harness identities
        if: ${{ inputs.diagnostic_target && inputs.diagnostic_target != 'none' }}
        env:
          HARNESS_SOURCE: ${{ github.sha }}
          HARNESS_RUN: ${{ github.run_id }}
          HARNESS_ATTEMPT: ${{ github.run_attempt }}
          HARNESS_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          receipt = dict(diagnosticOriginalRuntime=True, runtimeTarget='std40', promotionAccepted=False,
                         originalAppIdentity=dict(sourceRevision='c133772fc83b7984bdacb11e5dd41e2d65098771', workflowRun='40082294388', artifactId=12555818245),
                         originalBuildInfo=json.loads((Path(os.environ['RUNNER_TEMP']) / 'standard-original-input/BUILD_INFO.json').read_text()),
                         harnessIdentity=dict(sourceRevision=os.environ['HARNESS_SOURCE'], sourceTree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), workflowRun=os.environ['HARNESS_RUN'],
                                              runAttempt=int(os.environ['HARNESS_ATTEMPT']), runNumber=int(os.environ['HARNESS_NUMBER'])))
          (Path(os.environ['STANDARD_REFERENCE_ROOT']) / 'DIAGNOSTIC-IDENTITY.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Owned emulator and closed02 original-APK first-screen probe
        shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
        run: |
          python3 apps/aerove-lite/tool/emulator_standard_reference.py \
            --apk-directory "$RUNNER_TEMP/standard-original-input" \
            --diagnostics "$STANDARD_REFERENCE_ROOT/runtime" \
            --image-directory "$ANDROID_HOME/system-images/android-33-ext4/google_apis_playstore/x86_64" \
            --image-receipt "$STANDARD_REFERENCE_ROOT/environment/IMAGE-IDENTITY.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: Std-original40-reference-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/standard-original-reference/
          if-no-files-found: warn
  acceptance:
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && ((inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (!inputs.native_preflight && !inputs.publish_release)))))) }}
    needs:
    - build_x86
    strategy:
      fail-fast: false
      matrix:
        include:
        - phase: matrix
          label: matrix
          artifact_suffix: matrix
        - phase: remaining
          label: remaining shard 0/16
          artifact_suffix: remaining-shard-0-of-16
          shard_count: 16
          shard_index: 0
        - phase: remaining
          label: remaining shard 1/16
          artifact_suffix: remaining-shard-1-of-16
          shard_count: 16
          shard_index: 1
        - phase: remaining
          label: remaining shard 2/16
          artifact_suffix: remaining-shard-2-of-16
          shard_count: 16
          shard_index: 2
        - phase: remaining
          label: remaining shard 3/16
          artifact_suffix: remaining-shard-3-of-16
          shard_count: 16
          shard_index: 3
        - phase: remaining
          label: remaining shard 4/16
          artifact_suffix: remaining-shard-4-of-16
          shard_count: 16
          shard_index: 4
        - phase: remaining
          label: remaining shard 5/16
          artifact_suffix: remaining-shard-5-of-16
          shard_count: 16
          shard_index: 5
        - phase: remaining
          label: remaining shard 6/16
          artifact_suffix: remaining-shard-6-of-16
          shard_count: 16
          shard_index: 6
        - phase: remaining
          label: remaining shard 7/16
          artifact_suffix: remaining-shard-7-of-16
          shard_count: 16
          shard_index: 7
        - phase: remaining
          label: remaining shard 8/16
          artifact_suffix: remaining-shard-8-of-16
          shard_count: 16
          shard_index: 8
        - phase: remaining
          label: remaining shard 9/16
          artifact_suffix: remaining-shard-9-of-16
          shard_count: 16
          shard_index: 9
        - phase: remaining
          label: remaining shard 10/16
          artifact_suffix: remaining-shard-10-of-16
          shard_count: 16
          shard_index: 10
        - phase: remaining
          label: remaining shard 11/16
          artifact_suffix: remaining-shard-11-of-16
          shard_count: 16
          shard_index: 11
        - phase: remaining
          label: remaining shard 12/16
          artifact_suffix: remaining-shard-12-of-16
          shard_count: 16
          shard_index: 12
        - phase: remaining
          label: remaining shard 13/16
          artifact_suffix: remaining-shard-13-of-16
          shard_count: 16
          shard_index: 13
        - phase: remaining
          label: remaining shard 14/16
          artifact_suffix: remaining-shard-14-of-16
          shard_count: 16
          shard_index: 14
        - phase: remaining
          label: remaining shard 15/16
          artifact_suffix: remaining-shard-15-of-16
          shard_count: 16
          shard_index: 15
    name: acceptance (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AEROVE_CLEAR_FRAME_TRACE: '1'
      AEROVE_GLASS_CONSUMER_RECEIPT: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Fetch exact prebuilt x86 runtime
      run: python3 apps/aerove-lite/tool/ci_artifacts.py runtime --name "AEROVE-Lite-runtime-contract-attempt-${GITHUB_RUN_ATTEMPT}" --destination "$RUNNER_TEMP/lite-runtime-input"
    - name: Checkout the immutable Smart fixture sources
      if: ${{ matrix.phase == 'remaining' }}
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: IvanSolis1989/Smart-Config-Kit
        ref: 3971964b4089b38c6a1233537e1cf2e44bf2be4d
        path: .ci-fixture-sources/smart-config
        persist-credentials: false
        fetch-depth: 1
        sparse-checkout: |
          Meow内核系
          rulesets/generated/fused
          tools/lib
    - name: Prepare and read back the pinned Smart Android fixture
      if: ${{ matrix.phase == 'remaining' }}
      timeout-minutes: 5
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        python3 apps/aerove-lite/tool/prepare_smart_config_meow_ci_fixture.py prepare \
          --smart-repository "$GITHUB_WORKSPACE/.ci-fixture-sources/smart-config" \
          --app-repository "$GITHUB_WORKSPACE" \
          --geo-cache "$RUNNER_TEMP/lite-smart-geodata" --download \
          --output "$RUNNER_TEMP/lite-smart-config-meow" \
          --receipt "$RUNNER_TEMP/lite-diagnostics/remaining/smart-fixture-source.json"
        echo "SMART_CONFIG_MEOW_FIXTURE_DIR=$RUNNER_TEMP/lite-smart-config-meow" >> "$GITHUB_ENV"
        echo "SMART_CONFIG_MEOW_FIXTURE_RECEIPT=$RUNNER_TEMP/lite-diagnostics/remaining/smart-fixture-source.json" >> "$GITHUB_ENV"
    - name: Existing API33 emulator environment with unchanged configuration
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        sdk_install_dir="$RUNNER_TEMP/lite-diagnostics/sdk-install"
        mkdir -p "$sdk_install_dir"
        for sdk_attempt in 1 2; do
          sdk_install_log="$sdk_install_dir/attempt-${sdk_attempt}.log"
          set +e
          timeout --signal=TERM --kill-after=10s 180s sdkmanager --install 'build-tools;35.0.0' emulator 'system-images;android-33;google_apis;x86_64' --channel=0 2>&1 | tee "$sdk_install_log"
          sdk_install_status=("${PIPESTATUS[@]}")
          set -e
          sdkmanager_rc="${sdk_install_status[0]}"
          tee_rc="${sdk_install_status[1]}"
          printf 'sdkmanager_exit=%s\ntee_exit=%s\n' "$sdkmanager_rc" "$tee_rc" > "$sdk_install_dir/attempt-${sdk_attempt}.status.txt"
          if (( tee_rc != 0 )); then
            printf 'SDK install log tee failed (exit %s)\n' "$tee_rc" >&2
            exit "$tee_rc"
          fi
          if (( sdkmanager_rc == 0 )); then
            break
          fi
          if (( sdkmanager_rc == 124 || sdkmanager_rc == 137 )); then
            exit "$sdkmanager_rc"
          fi
          if (( sdk_attempt == 1 )) &&
              grep -Eiq 'Failed to download package archive for (emulator|system-images/android-33/google_apis/x86_64): (closed|.*connection reset|.*read (timed out|timeout)|.*EOF(Exception)?|.*unexpected end of (file|stream))([[:space:]:.]|$)' "$sdk_install_log" &&
              ! grep -Eiq 'LicenseNotAccepted|license.*(not accepted|not been accepted)|no space left on device|insufficient.*(space|storage)|not enough.*space|failed to find package|unknown package|package .*not (found|available)|UnsupportedClassVersionError|requires? (Java|JDK)' "$sdk_install_log"; then
            printf 'Retrying emulator SDK install once after a diagnosed archive transport interruption\n' >&2
            continue
          fi
          exit "$sdkmanager_rc"
        done
        mkdir -p "$RUNNER_TEMP/lite-diagnostics/${{ matrix.phase }}"
        "$ANDROID_HOME/emulator/emulator" -no-window -version > "$RUNNER_TEMP/lite-diagnostics/${{ matrix.phase }}/emulator-version.txt" 2>&1
        grep -E '37\.2\.12\.0.*16428233' "$RUNNER_TEMP/lite-diagnostics/${{ matrix.phase }}/emulator-version.txt"
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        echo no | avdmanager create avd --force -n test --package 'system-images;android-33;google_apis;x86_64' --device pixel_6
        avd_directory="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
        printf 'hw.cpu.ncore=2\n' >> "$avd_directory/test.avd/config.ini"
        cp "$avd_directory/test.avd/config.ini" "$RUNNER_TEMP/lite-diagnostics/${{ matrix.phase }}/avd-config.ini"
    - name: Real API 33 ${{ matrix.phase }} verification
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        if [[ '${{ matrix.phase }}' == remaining ]]; then
          export AEROVE_REMAINING_SHARD_COUNT='${{ matrix.shard_count }}'
          export AEROVE_REMAINING_SHARD_INDEX='${{ matrix.shard_index }}'
        fi
        python3 apps/aerove-lite/tool/emulator_current.py ${{ matrix.phase }} --runtime-directory "$RUNNER_TEMP/lite-runtime-input"
    - name: Preserve the first Android dashboard captures
      if: ${{ always() && matrix.phase == 'matrix' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AEROVE-Lite-dashboard-matrix-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-diagnostics/matrix/
        if-no-files-found: error
    - name: Preserve diagnostics
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/lite-diagnostics"
        git status --short > "$RUNNER_TEMP/lite-diagnostics/git-status.txt"
        git diff --binary > "$RUNNER_TEMP/lite-diagnostics/generated.patch"
        if timeout 5s adb get-state > /dev/null 2>&1; then
          timeout 15s adb logcat -d > "$RUNNER_TEMP/lite-diagnostics/logcat.txt" 2>&1 || true
          timeout 30s adb pull /sdcard/Android/data/dev.aerove.lite/files/captures "$RUNNER_TEMP/lite-diagnostics/" || true
        fi
    - name: Preserve the exact APK shard selection receipt
      if: ${{ matrix.phase == 'remaining' && success() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AEROVE-Lite-shard-selection-${{ matrix.shard_index }}-of-${{ matrix.shard_count }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-diagnostics/remaining/TEST-SELECTION.json
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: AEROVE-Lite-diagnostics-${{ matrix.artifact_suffix }}-attempt-${{ github.run_attempt }}
        path: |
          apps/aerove-lite/app/build/reports/
          apps/aerove-lite/app/build/outputs/androidTest-results/
          apps/aerove-lite/meow-native/Cargo.lock
          ${{ runner.temp }}/lite-diagnostics/
          ${{ runner.temp }}/lite-fixture.log
        if-no-files-found: warn
  accepted:
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && ((inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (always() && !inputs.native_preflight && !inputs.publish_release)))))) }}
    needs:
    - resolve
    - verify
    - build_arm
    - build_x86
    - acceptance
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Fetch the sixteen exact APK shard selection receipts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: AEROVE-Lite-shard-selection-*-of-16-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-shard-selection
        merge-multiple: false
    - name: Verify the 16 runtime-discovered shard sets form one complete APK test selection
      run: |
        python3 apps/aerove-lite/tool/instrumentation_shards.py aggregate \
          --shard-count 16 --directory "$RUNNER_TEMP/lite-shard-selection" --source "$GITHUB_SHA" \
          --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
          --output "$RUNNER_TEMP/lite-shard-selection/AGGREGATE.json"
    - name: Preserve the aggregate APK test selection proof
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AEROVE-Lite-shard-selection-aggregate-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-shard-selection/AGGREGATE.json
        if-no-files-found: error
    - name: All exact-source acceptance gates passed
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: python3 -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert all(x["result"]=="success" for x in results.values()), results'
'on':
  push:
    branches:
    - codex/aerove-independent-architecture
    paths:
    - apps/aerove-lite/**
    - .github/workflows/aerove-lite.yaml
    - '!apps/aerove-lite/**/*.md'
    - .github/workflows/aerove-lite-build.yaml
  workflow_dispatch:
    inputs:
      diagnostic_target:
        description: Immutable prebuilt Android diagnosis only; no build or promotion
        type: choice
        required: false
        default: none
        options: [none, lite94-matrix, std40, both, beta14-profile-only, lite125-test-only, lite125-original-samples, lite141-prebuilt-shards]
      meow_host_only:
        description: Full fixed Meow host/Core preflight only; no Android build, APK or publication
        required: false
        type: boolean
        default: false
      qa84_only:
        description: Original run84 APK matrix diagnosis only; exclusive, no build or publication
        type: boolean
        default: false
      qa79_only:
        description: Original run79 APK Android QA only; exclusive, no build or publication
        required: false
        type: boolean
        default: false
      client_preflight:
        description: Client-only unit tests, lint, AndroidTest compilation and R8; exclusive, no native/APK or acceptance
        required: false
        type: boolean
        default: false
      accepted_build_run:
        description: Explicit fully accepted original build run to promote without rebuilding
        type: string
        default: ''
      publish_release:
        description: Promote a fully accepted Lite artifact for this exact main commit; never rebuild
        required: false
        type: boolean
        default: false
      native_preflight:
        description: Legacy clash-rs diagnosis only; never accepted as a Meow application build
        required: false
        type: boolean
        default: false
      native_test_filter:
        description: Optional Rust test-name prefix for native-only failure diagnosis; empty runs the full suite
        required: false
        type: string
        default: ''
      native_test_serial:
        description: Run native-only host tests with one thread to diagnose shared fixture interference
        required: false
        type: boolean
        default: false
      native_underlay_tests:
        description: Run the seven pinned Tailscale socket integration tests using the native root lock
        required: false
        type: boolean
        default: false
      native_test_stacks:
        description: Capture one bounded native stack snapshot for a filtered host-test diagnosis
        required: false
        type: boolean
        default: false
