name: AEROVE Lite
defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
permissions:
  contents: read
concurrency:
  group: ${{ inputs.publish_release && format('aerove-lite-{0}', github.ref) || format('aerove-lite-{0}-{1}-{2}', github.ref, github.sha, inputs.diagnostic_target && inputs.diagnostic_target != 'none' && format('diagnostic-{0}', inputs.diagnostic_target) || inputs.meow_host_only && 'host' || inputs.client_preflight && 'client' || inputs.qa84_only && 'qa84' || inputs.qa79_only && 'qa79' || inputs.native_preflight && 'native' || 'full') }}
  cancel-in-progress: false
env:
  NDK_VERSION: 28.2.13676358
jobs:
  promotion_request:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      ACCEPTED_BUILD_RUN: ${{ inputs.accepted_build_run }}
      PUBLISH_RELEASE: ${{ inputs.publish_release }}
      BUILD_APK: ${{ inputs.build_apk }}
      PREPARE_SOURCES: ${{ inputs.prepare_sources }}
      VERIFICATION_RECHECK: ${{ inputs.verification_recheck }}
      ORIGINAL_BUILD_RUN: ${{ inputs.original_build_run }}
      DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
      MEOW_HOST_ONLY: ${{ inputs.meow_host_only }}
      QA84_ONLY: ${{ inputs.qa84_only }}
      QA79_ONLY: ${{ inputs.qa79_only }}
      CLIENT_PREFLIGHT: ${{ inputs.client_preflight }}
      NATIVE_PREFLIGHT: ${{ inputs.native_preflight }}
    steps:
      - name: Reject ambiguous build and promotion requests before any producer
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import os, re
          e = os.environ
          accepted, publish = e.get('ACCEPTED_BUILD_RUN', ''), e.get('PUBLISH_RELEASE') == 'true'
          if bool(accepted) != publish:
              raise SystemExit('Publish requires an explicit accepted_build_run; accepted_build_run cannot start a build')
          if accepted:
              if not re.fullmatch(r'[1-9][0-9]*', accepted):
                  raise SystemExit('accepted_build_run must be a positive original run ID')
              if e['GITHUB_EVENT_NAME'] != 'workflow_dispatch' or e['GITHUB_REF'] != 'refs/heads/main':
                  raise SystemExit('Promotion requires an explicit main workflow dispatch')
              flags = ('BUILD_APK', 'PREPARE_SOURCES', 'VERIFICATION_RECHECK', 'MEOW_HOST_ONLY', 'QA84_ONLY', 'QA79_ONLY', 'CLIENT_PREFLIGHT', 'NATIVE_PREFLIGHT')
              if any(e.get(key) == 'true' for key in flags) or e.get('DIAGNOSTIC_TARGET', '') not in ('', 'none') or e.get('ORIGINAL_BUILD_RUN'):
                  raise SystemExit('Promotion cannot build, recheck, prepare or diagnose')
          elif e.get('ORIGINAL_BUILD_RUN') and e.get('VERIFICATION_RECHECK') != 'true':
              raise SystemExit('original_build_run belongs only to verification_recheck')
          PY

  diagnostic_guard:
    name: Validate prebuilt Android diagnosis only
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (inputs.diagnostic_target != 'none' && (github.event_name == 'workflow_dispatch' || inputs.diagnostic_target)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Validate exclusive immutable Android diagnostic request
      env:
        REQUEST_EVENT: ${{ github.event_name }}
        DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
        MEOW_HOST_ONLY: ${{ inputs.meow_host_only }}
        QA84_ONLY: ${{ inputs.qa84_only }}
        QA79_ONLY: ${{ inputs.qa79_only }}
        CLIENT_PREFLIGHT: ${{ inputs.client_preflight }}
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        NATIVE_PREFLIGHT: ${{ inputs.native_preflight }}
        NATIVE_TEST_SERIAL: ${{ inputs.native_test_serial }}
        NATIVE_UNDERLAY_TESTS: ${{ inputs.native_underlay_tests }}
        NATIVE_TEST_STACKS: ${{ inputs.native_test_stacks }}
        NATIVE_TEST_FILTER: ${{ inputs.native_test_filter }}
      run: |
        python3 - <<'PY'
        import os
        value = os.environ['DIAGNOSTIC_TARGET']
        conflicts = [key for key in ('MEOW_HOST_ONLY', 'QA84_ONLY', 'QA79_ONLY', 'CLIENT_PREFLIGHT', 'PUBLISH_RELEASE', 'NATIVE_PREFLIGHT', 'NATIVE_TEST_SERIAL', 'NATIVE_UNDERLAY_TESTS', 'NATIVE_TEST_STACKS') if os.environ[key] == 'true']
        if os.environ['NATIVE_TEST_FILTER']:
            conflicts.append('NATIVE_TEST_FILTER')
        if value not in ('lite94-matrix', 'std40', 'both', 'beta14-profile-only', 'lite125-test-only', 'lite125-original-samples', 'lite141-prebuilt-shards', 'lite158-frame-sample', 'lite201-flutter-ui', 'lite208-flutter-ui', 'lite236-pixels', 'gfxstream37-static') or os.environ['REQUEST_EVENT'] != 'workflow_dispatch' or conflicts:
            raise SystemExit('Invalid prebuilt Android diagnosis target/event or conflicting inputs: ' + repr((value, conflicts)))
        PY
  diagnostic_lite236_pixels:
    name: Original236 untouched consent pixels (diagnostic only)
    needs: diagnostic_guard
    if: ${{ needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite236-pixels' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AEROVE_GUEST_ANGLE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Fetch fixed original236 archive and official API row
      run: |
        python3 - <<'PY'
        import json, os, stat, sys, zipfile
        from pathlib import Path, PurePosixPath
        sys.path.insert(0, 'apps/aerove-lite/tool')
        from lite_release import _gh_json, _gh_binary
        from lite236_pixel_diagnostic import original
        from argparse import Namespace
        root = Path(os.environ['RUNNER_TEMP']) / 'lite236-original'
        root.mkdir()
        api = root / 'ARTIFACT-API.json'
        api.write_text(json.dumps(_gh_json('repos/IvanSolis1989/Aerove/actions/artifacts/13300156190'), indent=2) + '\n')
        archive = root / 'official.zip'
        _gh_binary('repos/IvanSolis1989/Aerove/actions/artifacts/13300156190/zip', archive)
        destination = root / 'unpacked'
        with zipfile.ZipFile(archive) as source:
            names = source.namelist()
            assert names and len(names) == len(set(names))
            for item in source.infolist():
                name, mode = PurePosixPath(item.filename), item.external_attr >> 16
                assert not name.is_absolute() and '..' not in name.parts and '\\' not in item.filename and name.parts
                assert not stat.S_ISLNK(mode) and (not mode or stat.S_ISREG(mode) or stat.S_ISDIR(mode))
            source.extractall(destination)
        original(Namespace(artifact_api=api, archive=archive, runtime_directory=destination))
        PY
    - name: Existing API33 emulator environment with unchanged configuration
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        sdk_install_dir="$RUNNER_TEMP/lite-diagnostics/sdk-install"
        mkdir -p "$sdk_install_dir"
        for sdk_attempt in 1 2; do
          sdk_install_log="$sdk_install_dir/attempt-${sdk_attempt}.log"
          set +e
          timeout --signal=TERM --kill-after=10s 180s sdkmanager --install 'build-tools;37.0.0' 'system-images;android-33;google_apis;x86_64' --channel=0 2>&1 | tee "$sdk_install_log"
          sdk_install_status=("${PIPESTATUS[@]}")
          set -e
          sdkmanager_rc="${sdk_install_status[0]}"
          tee_rc="${sdk_install_status[1]}"
          printf 'sdkmanager_exit=%s\ntee_exit=%s\n' "$sdkmanager_rc" "$tee_rc" > "$sdk_install_dir/attempt-${sdk_attempt}.status.txt"
          if (( tee_rc != 0 )); then
            printf 'SDK install log tee failed (exit %s)\n' "$tee_rc" >&2
            exit "$tee_rc"
          fi
          if (( sdkmanager_rc == 0 )); then
            break
          fi
          if (( sdkmanager_rc == 124 || sdkmanager_rc == 137 )); then
            exit "$sdkmanager_rc"
          fi
          if (( sdk_attempt == 1 )) &&
              grep -Eiq 'Failed to download package archive for (emulator|system-images/android-33/google_apis/x86_64): (closed|.*connection reset|.*read (timed out|timeout)|.*EOF(Exception)?|.*unexpected end of (file|stream))([[:space:]:.]|$)' "$sdk_install_log" &&
              ! grep -Eiq 'LicenseNotAccepted|license.*(not accepted|not been accepted)|no space left on device|insufficient.*(space|storage)|not enough.*space|failed to find package|unknown package|package .*not (found|available)|UnsupportedClassVersionError|requires? (Java|JDK)' "$sdk_install_log"; then
            printf 'Retrying emulator SDK install once after a diagnosed archive transport interruption\n' >&2
            continue
          fi
          exit "$sdkmanager_rc"
        done
        mkdir -p "$RUNNER_TEMP/lite-diagnostics/flutter-ui"
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        echo no | avdmanager create avd --force -n test --package 'system-images;android-33;google_apis;x86_64' --device pixel_6
        avd_directory="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
        printf 'hw.cpu.ncore=2\n' >> "$avd_directory/test.avd/config.ini"
        cp "$avd_directory/test.avd/config.ini" "$RUNNER_TEMP/lite-diagnostics/flutter-ui/avd-config.ini"
        emulator_archive_url='https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip'
        emulator_archive_sha256='cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd'
        emulator_stage="$(mktemp -d "$RUNNER_TEMP/lite-emulator-16740729.XXXXXX")"
        emulator_archive="$emulator_stage/emulator-linux_x64-16740729.zip"
        printf 'url=%s\nsize=349658551\nsha256=%s\n' "$emulator_archive_url" "$emulator_archive_sha256" > "$sdk_install_dir/pinned-emulator-archive.txt"
        curl --fail --location --silent --show-error --connect-timeout 20 --max-time 240 \
          --output "$emulator_archive" "$emulator_archive_url" \
          2> "$sdk_install_dir/pinned-emulator-download.stderr.txt"
        test "$(stat -c '%s' "$emulator_archive")" = '349658551'
        printf '%s  %s\n' "$emulator_archive_sha256" "$emulator_archive" | sha256sum --check --strict > "$sdk_install_dir/pinned-emulator-sha256.txt"
        unzip -q "$emulator_archive" -d "$emulator_stage/extracted"
        test -x "$emulator_stage/extracted/emulator/emulator"
        test -f "$emulator_stage/extracted/emulator/source.properties"
        cp "$emulator_stage/extracted/emulator/source.properties" "$sdk_install_dir/pinned-emulator-source.properties"
        if test -e "$ANDROID_HOME/emulator"; then
          mv "$ANDROID_HOME/emulator" "$emulator_stage/previous-emulator"
        fi
        mv "$emulator_stage/extracted/emulator" "$ANDROID_HOME/emulator"
        "$ANDROID_HOME/emulator/emulator" -no-window -version > "$RUNNER_TEMP/lite-diagnostics/flutter-ui/emulator-version.txt" 2>&1
        grep -E '37\.2\.13\.0.*16740729' "$RUNNER_TEMP/lite-diagnostics/flutter-ui/emulator-version.txt"
    - name: Capture unchanged original App before and after one hierarchy read
      run: |
        python3 apps/aerove-lite/tool/lite236_pixel_diagnostic.py \
          --runtime-directory "$RUNNER_TEMP/lite236-original/unpacked" \
          --archive "$RUNNER_TEMP/lite236-original/official.zip" \
          --artifact-api "$RUNNER_TEMP/lite236-original/ARTIFACT-API.json" \
          --source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
          --sdk "$ANDROID_HOME" --avd test --output "$RUNNER_TEMP/lite-diagnostics/lite236-pixel"
    - name: Preserve actual raw pixels and failures without acceptance
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AEROVE-Lite-original236-pixels-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-diagnostics/
        if-no-files-found: error

  diagnostic_gfxstream37_static:
    name: SDK37.2.13 gfxstream fixed code pages (static diagnosis only)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'gfxstream37-static') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DEBUGINFOD_URLS: ''
    steps:
    - name: Verify the fixed SDK archive and gfxstream ELF without executing SDK code
      run: |
        set -euo pipefail
        sdk_install_dir="$RUNNER_TEMP/lite-diagnostics/gfxstream37-static"
        mkdir -p "$sdk_install_dir"
        printf 'diagnosticOnly=true\naccepted=false\nperformanceEvidence=false\nsdkExecuted=false\nappExecuted=false\nharnessRevision=%s\nharnessRun=%s\nattempt=%s\nstatus=started\n' \
          "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$sdk_install_dir/receipt.txt"
        emulator_archive_url='https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip'
        emulator_archive_sha256='cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd'
        emulator_stage="$(mktemp -d "$RUNNER_TEMP/lite-emulator-static-16740729.XXXXXX")"
        emulator_archive="$emulator_stage/emulator-linux_x64-16740729.zip"
        printf 'url=%s\nsize=349658551\nsha256=%s\n' "$emulator_archive_url" "$emulator_archive_sha256" > "$sdk_install_dir/pinned-emulator-archive.txt"
        curl --fail --location --silent --show-error --connect-timeout 20 --max-time 240 \
          --output "$emulator_archive" "$emulator_archive_url" \
          2> "$sdk_install_dir/pinned-emulator-download.stderr.txt"
        test "$(stat -c '%s' "$emulator_archive")" = '349658551'
        printf '%s  %s\n' "$emulator_archive_sha256" "$emulator_archive" | sha256sum --check --strict > "$sdk_install_dir/pinned-emulator-sha256.txt"
        timeout --signal=TERM --kill-after=2s 30s \
          unzip -q "$emulator_archive" 'emulator/lib64/libgfxstream_backend.so' 'emulator/source.properties' -d "$emulator_stage/extracted"
        cp "$emulator_stage/extracted/emulator/source.properties" "$sdk_install_dir/pinned-emulator-source.properties.txt"
        gfx="$emulator_stage/extracted/emulator/lib64/libgfxstream_backend.so"
        stat -c '%s' "$gfx" > "$sdk_install_dir/elf-bytes.txt"
        sha256sum "$gfx" > "$sdk_install_dir/elf-sha256.txt"
        test "$(stat -c '%s' "$gfx")" = '15727152'
        printf '%s  %s\n' '67fa485ebe97369429e283fbefb6db9046024f7264102de60c4bfc70d2628f7e' "$gfx" \
          | sha256sum --check --strict > "$sdk_install_dir/elf-sha256-check.txt"
        readelf --version > "$sdk_install_dir/readelf-version.txt"
        objdump --version > "$sdk_install_dir/objdump-version.txt"
        timeout --signal=TERM --kill-after=2s 10s \
          readelf --wide --program-headers --section-headers --notes "$gfx" \
          > "$sdk_install_dir/layout-and-build-id.txt" 2> "$sdk_install_dir/layout.stderr.txt"
        grep -E 'Build ID: 49b9fc8e45122f00b3970a89a72eb26101bcffe4$' "$sdk_install_dir/layout-and-build-id.txt" \
          > "$sdk_install_dir/build-id-check.txt"
        timeout --signal=TERM --kill-after=2s 10s \
          readelf --wide --dyn-syms --demangle "$gfx" \
          > "$sdk_install_dir/dynamic-symbols.txt" 2> "$sdk_install_dir/symbols.stderr.txt"
        timeout --signal=TERM --kill-after=2s 10s \
          readelf --string-dump=.gnu_debuglink "$gfx" \
          > "$sdk_install_dir/debuglink.txt" 2> "$sdk_install_dir/debuglink.stderr.txt"
        # These are verified ELF VMAs, not file offsets. Retain raw code beside disassembly.
        for range in 'trap 0x7c3b00 0x7c3f00' 'caller 0x739e80 0x73a000' 'post-trap-call 0x509300 0x509520'; do
          read -r label begin end <<< "$range"
          timeout --signal=TERM --kill-after=2s 10s \
            objdump -WN --full-contents --section=.text --start-address="$begin" --stop-address="$end" "$gfx" \
            > "$sdk_install_dir/$label.bytes.txt" 2> "$sdk_install_dir/$label.bytes.stderr.txt"
          timeout --signal=TERM --kill-after=2s 10s \
            objdump -WN --disassemble --demangle --start-address="$begin" --stop-address="$end" "$gfx" \
            > "$sdk_install_dir/$label.window.txt" 2> "$sdk_install_dir/$label.window.stderr.txt"
        done
        timeout --signal=TERM --kill-after=2s 30s \
          objdump -WN --disassemble --demangle --start-address=0x728e80 --stop-address=0x73da28 "$gfx" \
          > "$sdk_install_dir/decode-function.txt" 2> "$sdk_install_dir/decode-function.stderr.txt"
        # Hidden helpers need an actual unwind boundary to avoid misaligned x86 windows.
        timeout --signal=TERM --kill-after=2s 20s \
          readelf --wide -wFN "$gfx" > "$emulator_stage/unwind.txt" 2> "$sdk_install_dir/unwind.stderr.txt"
        python3 - "$emulator_stage/unwind.txt" "$sdk_install_dir/unwind-targets.txt" "$emulator_stage/ranges.txt" <<'PY'
        from pathlib import Path
        import re, sys
        raw = Path(sys.argv[1]).read_text()
        matches = list(re.finditer(r'(?m)^[^\n]*\bFDE\b[^\n]*\bpc=([0-9a-fA-F]+)\.\.([0-9a-fA-F]+)', raw))
        ranges, evidence = [], []
        for label, pc in [('trap', 0x7c3dad), ('post-trap-call', 0x5093e0)]:
            candidates = {(int(m[1], 16), int(m[2], 16)) for m in matches if int(m[1], 16) <= pc < int(m[2], 16)}
            if len(candidates) != 1:
                raise SystemExit(f'{label}: need one actual FDE range, got {sorted(candidates)}')
            begin, end = candidates.pop()
            if not 0 < end - begin <= 262144:
                raise SystemExit(f'{label}: helper exceeds the bounded 256KiB readback')
            ranges.append(f'{label} {begin:#x} {end:#x}\n')
            evidence.append(f'{label} target={pc:#x} FDE={begin:#x}..{end:#x}\n')
            for index, match in enumerate(matches):
                if (int(match[1], 16), int(match[2], 16)) == (begin, end):
                    stop = matches[index + 1].start() if index + 1 < len(matches) else len(raw)
                    evidence.append(raw[match.start():stop][:65536] + '\n')
        Path(sys.argv[2]).write_text(''.join(evidence))
        Path(sys.argv[3]).write_text(''.join(ranges))
        PY
        while read -r label begin end; do
          timeout --signal=TERM --kill-after=2s 30s \
            objdump -WN --disassemble --demangle --start-address="$begin" --stop-address="$end" "$gfx" \
            > "$sdk_install_dir/$label.function.txt" 2> "$sdk_install_dir/$label.function.stderr.txt"
        done < "$emulator_stage/ranges.txt"
        printf 'status=complete\n' >> "$sdk_install_dir/receipt.txt"
    - name: Preserve fixed SDK static text diagnostics only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AEROVE-Lite-SDK-gfxstream37-static-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-diagnostics/gfxstream37-static/*.txt
        if-no-files-found: error
  diagnostic_lite125_test_only:
    name: Lite125 test-only dry-run task graph (no APK build)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite125-test-only') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite125-test-only-diagnostic.yaml
  diagnostic_lite125_original_samples:
    name: Three isolated Lite125 original render samples
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite125-original-samples') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite125-original-samples.yaml
    with:
      exclusive_mode: true
  diagnostic_lite94:
    name: Immutable Lite run94 matrix diagnosis
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && (inputs.diagnostic_target == 'lite94-matrix' || inputs.diagnostic_target == 'both')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: true
      runtime_target: lite94
  diagnostic_beta14_profile:
    name: Immutable beta14 render profile only (no build)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'beta14-profile-only') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: true
      runtime_target: beta14
  diagnostic_lite208_flutter_ui:
    name: Lite208 original Flutter representative UI (diagnostic only)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite208-flutter-ui') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: true
      runtime_target: lite208-flutter-ui
  diagnostic_lite201_flutter_ui:
    name: Lite201 original Flutter representative UI (diagnostic only)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite201-flutter-ui') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: true
      runtime_target: lite201-flutter-ui
  diagnostic_lite158_frame_sample:
    name: Lite158 original first-frame trace (diagnostic only)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite158-frame-sample') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: true
      runtime_target: lite158-frame-sample
      sample: solid
  diagnostic_lite141_shards:
    name: Lite141 original APK remaining shard ${{ matrix.shard_index }}/8 (diagnostic only)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite141-prebuilt-shards') }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: true
