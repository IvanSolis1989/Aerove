    - codex/aerove-independent-architecture
    paths:
    - apps/aerove-lite/**
    - .github/workflows/aerove-lite.yaml
    - '!apps/aerove-lite/**/*.md'
    - .github/workflows/aerove-lite-build.yaml
  workflow_dispatch:
    inputs:
      diagnostic_target:
        description: Fixed Android diagnosis or original265 prebuilt recheck; no app build or promotion
        type: choice
        required: false
        default: none
        options: [none, lite94-matrix, std40, both, beta14-profile-only, lite125-test-only, lite125-original-samples, lite141-prebuilt-shards, lite158-frame-sample, lite201-flutter-ui, lite208-flutter-ui, lite236-pixels, lite236-pixels-no-deferred-submit, lite236-surface, lite257-surface, gfxstream37-static, lite265-precheck, lite265-recheck, lite265-surface-startup, lite290-surface-startup]
      meow_host_only:
        description: Full fixed Meow host/Core preflight only; no Android build, APK or publication
        required: false
        type: boolean
        default: false
      qa84_only:
        description: Original run84 APK matrix diagnosis only; exclusive, no build or publication
        type: boolean
        default: false
      qa79_only:
        description: Original run79 APK Android QA only; exclusive, no build or publication
        required: false
        type: boolean
