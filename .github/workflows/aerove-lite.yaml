        results = {}
        for label in labels:
            test, log = map(int, (output / (label + '.status.txt')).read_text().split())
            results[label] = dict(testExit=test, logExit=log,
                                  command=(output / (label + '.command.txt')).read_text().strip())
        receipt = dict(source=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID'],
                       attempt=os.environ['GITHUB_RUN_ATTEMPT'], independentProcesses=True,
                       productionHooksEnabled=True, results=results, appApkBuilt=False, acceptance=False)
        (output / 'results.json').write_text(json.dumps(receipt, indent=2) + '\n')
        assert all(value['testExit'] == 0 and value['logExit'] == 0 for value in results.values()), results
        PY
    - name: Verify SQL-managed source selection policy through the Standard fixture composition
      working-directory: apps/aerove
      run: |-
        flutter test --no-pub --concurrency 1 test/common/native_lite_binding89_test.dart \
          2>&1 | tee "$RUNNER_TEMP/lite-flutter-host/dart-closure/selection-profile-policy.log"
    - name: Produce current-source profile update cancellation prerequisite (no APK)
      run: python3 apps/aerove-lite/tool/profile_cancel_green.py --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/lite-profile-cancel-green"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: AEROVE-Lite-profile-cancel-green-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-profile-cancel-green/
        if-no-files-found: error
    - name: Inspect the independent runner task graph without packaging an APK
      working-directory: apps/aerove-lite
      run: |
        gradle --no-daemon -p android-qa assembleRelease --dry-run \
          | tee "$RUNNER_TEMP/lite-flutter-runner-task-graph.txt"
        python3 - <<'PY'
        import os, re
        from pathlib import Path
        graph = (Path(os.environ['RUNNER_TEMP']) / 'lite-flutter-runner-task-graph.txt').read_text()
        graph = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', graph)
        tasks = []
        for line in graph.splitlines():
            match = re.fullmatch(r'(?:> Task\s+)?(:\S+)\s+SKIPPED', line.strip())
            if match:
                tasks.append(match.group(1))
        if not tasks or ':assembleRelease' not in tasks or ':prepareDriverSource' not in tasks:
            raise SystemExit('Independent runner task graph is missing its real source or packaging producer')
        if any(task.count(':') != 1 or re.search(r'flutter|meow|helper|r8|minify', task, re.I) for task in tasks):
            raise SystemExit('Independent runner task graph entered a production or minification task')
        PY
    - name: Retain compile scope without claiming an application or acceptance
      if: always()
      run: |-
        mkdir -p "$RUNNER_TEMP/lite-flutter-host"
        python3 - <<'PY'
        import hashlib, json, os, shutil
        from pathlib import Path
        output = Path(os.environ['RUNNER_TEMP']) / 'lite-flutter-host'
        abi = output / 'abi'
        abi.mkdir(parents=True, exist_ok=True)
        product = Path('apps/aerove-lite')
        inference = product / 'build/app/intermediates/androidTestAppKeepRules/release'
        entries = []
        for name, source in [('app-abi-rules.pro', inference/'rules.pro'), ('app-abi-report.json', inference/'inputs.json')]:
            entry = dict(source=str(source), file=name, status='missing')
            if source.is_file() and not source.is_symlink():
                shutil.copyfile(source, abi/name)
                entry.update(status='present', bytes=source.stat().st_size, sha256=hashlib.sha256((abi/name).read_bytes()).hexdigest())
            entries.append(entry)
        # AGP 9.4.1 PackagedDependenciesWriterTask writes deps.txt; do not request APK tasks to obtain it.
        intermediates = product / 'build/app/intermediates'
        provided = [path for path in intermediates.rglob('deps.txt') if path.is_file() and not path.is_symlink()
                    and ('packaged_dependencies' in path.parts or 'generateReleaseFeatureTransitiveDeps' in path.parts)
                    and 'release' in path.parts] if intermediates.is_dir() else []
        for source in sorted(provided):
            relative = Path('provided') / source.relative_to(intermediates)
            target = abi/relative
            target.parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(source, target)
            entries.append(dict(source=str(source), file=relative.as_posix(), status='present', bytes=target.stat().st_size,
                                sha256=hashlib.sha256(target.read_bytes()).hexdigest()))
        original = '792966adf1057f3cce0aac558d7be3f0a40c9178ee7f04f5d45e7fb4ba3460c3'
        rules = entries[0].get('sha256')
        (abi/'export.json').write_text(json.dumps(dict(files=entries, original201RulesSha256=original,
            actualRulesSha256=rules, rulesMatchOriginal201=None if rules is None else rules == original,
            providedMetadata=dict(status='present' if provided else 'missing',
                searched=str(intermediates/'**/deps.txt'), producer=':app:generateReleaseFeatureTransitiveDeps',
                missingReason=None if provided else 'No release packaged-dependency metadata was produced by requested pre-R8 tasks; no APK task was added'),
            acceptance=False), indent=2) + '\n')
        (abi/'SHA256SUMS').write_text(''.join(row['sha256']+'  '+row['file']+'\n' for row in entries if row['status']=='present'))
        roots = [Path('apps/aerove-lite/build'), Path('apps/aerove-lite/android/app/build'), Path('apps/aerove-lite/app/build'), Path('apps/aerove-lite/android-qa/build'), Path('apps/aerove-lite/android-platform-qa/build')]
        apks = sorted({str(p) for root in roots if root.exists() for p in root.rglob('*.apk')})
        receipt = dict(source=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID'],
                       buildRoot='apps/aerove-lite/android', requestedTasks=[':app:compileReleaseKotlin', ':app:compileReleaseUnitTestKotlin', ':platform-qa:compileReleaseKotlin', ':platform-qa:compileReleaseJavaWithJavac', ':app:generateReleasePlatformTestAppKeepRules'],
                       checkedOutputRoots=[str(root) for root in roots], appApkBuilt=bool(apks), apks=apks, acceptance=False)
        (output / 'scope.json').write_text(json.dumps(receipt, indent=2) + '\n')
        assert not apks, 'Compile-only preflight unexpectedly packaged an application'
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: AEROVE-Lite-Flutter-host-compilation
        path: |-
          ${{ runner.temp }}/lite-flutter-host/
          apps/aerove-lite/build/app/reports/
          apps/aerove-lite/build/app/test-results/
          apps/aerove-lite/android/app/build/reports/
          apps/aerove-lite/android/app/build/test-results/
        if-no-files-found: error
  reuse:
    needs: promotion_request
    if: ${{ (inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && !inputs.native_preflight))))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      run_number: ${{ steps.select.outputs.run_number }}
      run_attempt: ${{ steps.select.outputs.run_attempt }}
      artifact_ids: ${{ steps.select.outputs.artifact_ids }}
      build_source: ${{ steps.select.outputs.build_source }}
      build_tree: ${{ steps.select.outputs.build_tree }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Select the exact successful acceptance run
      id: select
      env:
        GH_TOKEN: ${{ github.token }}
        ACCEPTED_BUILD_RUN: ${{ inputs.accepted_build_run }}
      run: python3 apps/aerove-lite/tool/lite_release.py select --root "$GITHUB_WORKSPACE" --build-run "$ACCEPTED_BUILD_RUN" --source "$GITHUB_SHA" --current-run "$GITHUB_RUN_ID" --outputs "$GITHUB_OUTPUT"
  release:
    if: ${{ (inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && !inputs.native_preflight && needs.reuse.result == 'success'))))) }}
    needs:
    - reuse
    - promotion_request
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTANCE_RUN: ${{ needs.reuse.outputs.run_id }}
      ACCEPTANCE_NUMBER: ${{ needs.reuse.outputs.run_number }}
      ACCEPTANCE_ATTEMPT: ${{ needs.reuse.outputs.run_attempt }}
      ARTIFACT_IDS: ${{ needs.reuse.outputs.artifact_ids }}
      BUILD_SOURCE: ${{ needs.reuse.outputs.build_source }}
      BUILD_TREE: ${{ needs.reuse.outputs.build_tree }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Install the pinned APK signature reader
      run: |
        sdkmanager 'build-tools;37.0.0'
        test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
    - name: Download only selected immutable acceptance artifact IDs
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/lite-promotion"
        mkdir -p "$root"
        python3 - <<'PY' > "$root/artifact-ids.json"
        import json, os
        value = json.loads(os.environ['ARTIFACT_IDS'])
        expected = {'arm', 'helper', 'x86', 'matrix'}
        if set(value) != expected or any(not isinstance(v, int) or v < 1 for v in value.values()):
            raise SystemExit('Selected acceptance artifact IDs are incomplete')
        print(json.dumps(value))
        PY
        for key in arm helper x86 matrix; do
          artifact_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$root/artifact-ids.json" "$key")
          python3 apps/aerove-lite/tool/lite_release.py extract --artifact-id "$artifact_id" --destination "$root/$key"
        done
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs \
          "$root/arm/AEROVE-Lite-android-arm64.apk" > "$root/arm-signature.txt"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$root/arm/AEROVE-Lite-android-arm64.apk" > "$root/arm-badging.txt"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs \
          "$root/x86/apks/app-release.apk" > "$root/x86-signature.txt"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$root/x86/apks/app-release.apk" > "$root/x86-badging.txt"
    - name: Verify exact source, ABI contracts, native receipts and twelve Android captures
      run: |
        python3 apps/aerove-lite/tool/lite_release.py validate \
          --arm "$RUNNER_TEMP/lite-promotion/arm" --helper "$RUNNER_TEMP/lite-promotion/helper" \
          --runtime "$RUNNER_TEMP/lite-promotion/x86" --matrix "$RUNNER_TEMP/lite-promotion/matrix" \
          --source "$BUILD_SOURCE" --tree "$BUILD_TREE" \
          --root "$GITHUB_WORKSPACE" --release-source "$GITHUB_SHA" \
          --release-run "$GITHUB_RUN_ID" --release-attempt "$GITHUB_RUN_ATTEMPT" \
          --receipt "$RUNNER_TEMP/lite-promotion/promotion.json" \
          --run "$ACCEPTANCE_RUN" --attempt "$ACCEPTANCE_ATTEMPT" --number "$ACCEPTANCE_NUMBER" \
          --helper-source apps/aerove-lite/regexp2 \
          --arm-badging "$RUNNER_TEMP/lite-promotion/arm-badging.txt" \
          --arm-signature "$RUNNER_TEMP/lite-promotion/arm-signature.txt" \
          --x86-badging "$RUNNER_TEMP/lite-promotion/x86-badging.txt" \
          --x86-signature "$RUNNER_TEMP/lite-promotion/x86-signature.txt" \
          --output "$RUNNER_TEMP/lite-promotion/validated.json"
    - name: Preserve the separate build and release promotion receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: aerove-lite-product-promotion-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-promotion/promotion.json
        if-no-files-found: error
    - name: Render source-bound release notes
      run: |
        info="$RUNNER_TEMP/lite-promotion/arm/BUILD_INFO.json"
        tag=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("lite-v"+str(d["version"])+"+"+str(d["version_code"]))' "$info")
        python3 apps/aerove-lite/tool/lite_release.py previous-changelog \
          --output "$RUNNER_TEMP/lite-promotion/previous-changelog.md" --target-tag "$tag"
        python3 apps/aerove-lite/tool/lite_release_notes.py --tag "$tag" --build-info "$info" \
          --source-changelog docs/aerove-lite/CHANGELOG.md --acceptance-run "$ACCEPTANCE_RUN" \
          --acceptance-attempt "$ACCEPTANCE_ATTEMPT" \
          --previous-changelog "$RUNNER_TEMP/lite-promotion/previous-changelog.md" \
          --output "$RUNNER_TEMP/lite-promotion/notes.md"
    - name: Create or resume a matching draft, upload originals and read them back
      run: |
        python3 apps/aerove-lite/tool/lite_release.py publish \
          --directory "$RUNNER_TEMP/lite-promotion/arm" \
          --validated "$RUNNER_TEMP/lite-promotion/validated.json" \
          --notes "$RUNNER_TEMP/lite-promotion/notes.md" \
          --source "$GITHUB_SHA" --run "$ACCEPTANCE_RUN" --attempt "$ACCEPTANCE_ATTEMPT" \
          --number "$ACCEPTANCE_NUMBER" \
          --root "$GITHUB_WORKSPACE" --receipt "$RUNNER_TEMP/lite-promotion/promotion.json" \
          --release-run "$GITHUB_RUN_ID" --release-attempt "$GITHUB_RUN_ATTEMPT"
  build_arm:
    needs: [flutter_host_preflight, verify]
    name: build (arm64-v8a)
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && ((inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (!inputs.native_preflight && !inputs.publish_release)))))) }}
