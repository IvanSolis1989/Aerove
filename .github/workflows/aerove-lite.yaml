name: AEROVE Lite

on:
  push:
    branches: [codex/aerove-independent-architecture]
    paths:
      - 'apps/aerove-lite/**'
      - '.github/workflows/aerove-lite.yaml'
  workflow_dispatch:
    inputs:
      native_preflight:
        description: Resolve the native Cargo lock and run host Rust tests only; skip Android verification and APK builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aerove-lite-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTC_BOOTSTRAP: '1'
  NDK_VERSION: '28.2.13676358'

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/aerove-lite/native -> target
      - name: Resolve and check the real pinned bridge dependency lock
        if: ${{ !inputs.native_preflight }}
        run: |
          python3 apps/aerove-lite/native/build.py --initialize-lock --prepare-only
          git diff --exit-code -- apps/aerove-lite/native/Cargo.lock
      - name: Initialize native lock and run host Rust tests
        if: ${{ inputs.native_preflight }}
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/lite-native-preflight"
          mkdir -p "$evidence"
          python3 - <<'PY' > "$evidence/before.json"
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path('apps/aerove-lite/native')
          lock = root / 'Cargo.lock'
          source_lock = subprocess.check_output(['git', 'show', 'HEAD:apps/aerove-lite/native/Cargo.lock'])
          print(json.dumps({
              'sourceSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'lockSha256Before': hashlib.sha256(lock.read_bytes()).hexdigest() if lock.is_file() else None,
              'lockSha256AtSource': hashlib.sha256(source_lock).hexdigest(),
              'lockPresentBefore': lock.is_file(),
          }, indent=2))
          PY
          set +e
          python3 apps/aerove-lite/native/build.py --initialize-lock --test > "$evidence/native-test.log" 2>&1
          command_status=$?
          set -e
          cat "$evidence/native-test.log"
          python3 - "$command_status" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'lite-native-preflight'
          before = json.loads((evidence / 'before.json').read_text())
          lock = Path('apps/aerove-lite/native/Cargo.lock')
          provenance_path = Path('apps/aerove-lite/native/.upstream/clash-rs/AEROVE_PROVENANCE.json')
          provenance = json.loads(provenance_path.read_text()) if provenance_path.is_file() else None
          result = {
              **before,
              'command': 'python3 apps/aerove-lite/native/build.py --initialize-lock --test',
              'commandLog': 'native-test.log',
              'commandExitCode': int(sys.argv[1]),
              'lockSha256After': hashlib.sha256(lock.read_bytes()).hexdigest() if lock.is_file() else None,
              'lockChanged': (hashlib.sha256(lock.read_bytes()).hexdigest() if lock.is_file() else None) != before['lockSha256Before'],
              'stableLockGate': 'not-run-in-native-preflight',
              'preparedSourceProvenance': provenance,
          }
          (evidence / 'after.json').write_text(json.dumps(result, indent=2) + '\n')
          if result['lockChanged']:
              print('::notice::Native preflight generated or changed Cargo.lock; this does not pass the normal stable-lock gate.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Native-only preflight completed. The normal stable Cargo.lock diff gate and Android verification/APK gates were not run.\n')
              summary.write(f"Cargo.lock changed during lock initialization: {result['lockChanged']}\n")
          sys.exit(int(sys.argv[1]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && !inputs.native_preflight }}
        with:
          name: AEROVE-Lite-resolved-lock
          path: apps/aerove-lite/native/Cargo.lock
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && inputs.native_preflight }}
        with:
          name: AEROVE-Lite-native-preflight
          path: |
            apps/aerove-lite/native/Cargo.lock
            ${{ runner.temp }}/lite-native-preflight/
          if-no-files-found: warn
  verify:
    if: ${{ !inputs.native_preflight }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check workspace layout
        run: python3 tooling/workspace.py check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
      - name: Kotlin data, lifecycle and UI compilation checks
        id: kotlin_checks
        working-directory: apps/aerove-lite
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:compileReleaseAndroidTestKotlin :app:minifyReleaseWithR8
      - name: Inspect Android tasks after verification failure
        if: ${{ failure() && steps.kotlin_checks.outcome == 'failure' }}
        timeout-minutes: 3
        working-directory: apps/aerove-lite
        shell: bash
        run: |
          mkdir -p app/build/reports
          gradle --no-daemon :app:tasks --all 2>&1 | tee app/build/reports/gradle-tasks.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: AEROVE-Lite-Kotlin-verification
          path: |
            apps/aerove-lite/app/build/reports/
            apps/aerove-lite/app/build/test-results/
          if-no-files-found: warn
  build:
    if: ${{ !inputs.native_preflight }}
    needs: [resolve, verify]
    env:
      AEROVE_LITE_KEYSTORE_PASSWORD: ${{ secrets.AEROVE_LITE_KEYSTORE_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Source preparation and APK inspector regression tests
        run: |
          python3 apps/aerove-lite/native/test_build.py
          python3 apps/aerove-lite/tool/test_verify_apk.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - name: Install the pinned Android toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' "ndk;$NDK_VERSION"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/aerove-lite/native -> target
          key: lite-${{ matrix.target }}
      - name: Build the pinned Rust Android bridge
        run: >-
          python3 apps/aerove-lite/native/build.py --target '${{ matrix.target }}'
          --ndk "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          --output apps/aerove-lite/app/src/main/jniLibs
      - name: Native lifecycle and production GeoSite regression
        if: matrix.abi == 'arm64-v8a'
        run: |
          python3 apps/aerove-lite/native/reference_resources.py --download --output "$RUNNER_TEMP/geosite.dat"
          python3 apps/aerove-lite/native/build.py --test --test-geosite "$RUNNER_TEMP/geosite.dat"
      - name: Prepare the independent Lite release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.AEROVE_LITE_KEYSTORE }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ['KEYSTORE_BASE64']
          if not encoded or not os.environ['AEROVE_LITE_KEYSTORE_PASSWORD']:
              raise SystemExit('The independent Lite signing secrets are required')
          target = Path(os.environ['RUNNER_TEMP']) / 'aerove-lite.p12'
          target.write_bytes(base64.b64decode(encoded, validate=True))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'AEROVE_LITE_KEYSTORE_PATH={target}\n')
          PY
      - name: Signed preview ARM64 APK
        if: matrix.abi == 'arm64-v8a'
        working-directory: apps/aerove-lite
        run: >-
          gradle --no-daemon :app:assembleRelease
          -PliteAbi=arm64-v8a -PsourceSha="$GITHUB_SHA"
      - name: Emulator application and instrumentation APK
        id: emulator_apks
        if: matrix.abi == 'x86_64'
        working-directory: apps/aerove-lite
        run: >-
          gradle --no-daemon :app:assembleRelease :app:assembleReleaseAndroidTest
          -PliteAbi=x86_64 -PsourceSha="$GITHUB_SHA"
      - name: Preserve the built x86 runtime contract
        if: ${{ !cancelled() && matrix.abi == 'x86_64' && steps.emulator_apks.outcome == 'success' }}
        working-directory: apps/aerove-lite
        run: |
          diagnostic_root="$RUNNER_TEMP/lite-runtime-diagnostics"
          mkdir -p "$diagnostic_root/apks" "$diagnostic_root/dependencies"
          cp app/build/outputs/apk/release/app-release.apk "$diagnostic_root/apks/"
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk "$diagnostic_root/apks/"
          for variant in release releaseAndroidTest; do
            for report in mapping.txt usage.txt seeds.txt configuration.txt; do
              original="app/build/outputs/mapping/$variant/$report"
              if [ -f "$original" ]; then
                mkdir -p "$diagnostic_root/mapping/$variant"
                cp "$original" "$diagnostic_root/mapping/$variant/"
              fi
            done
          done
          for configuration in releaseRuntimeClasspath releaseAndroidTestRuntimeClasspath; do
            if gradle --no-daemon :app:dependencies --configuration "$configuration" \
                -PliteAbi=x86_64 -PsourceSha="$GITHUB_SHA" \
                > "$diagnostic_root/dependencies/$configuration.stdout.txt" \
                2> "$diagnostic_root/dependencies/$configuration.stderr.txt"; then
              query_exit=0
            else
              query_exit=$?
            fi
            printf '%s\n' "$query_exit" > "$diagnostic_root/dependencies/$configuration.exit.txt"
          done
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'lite-runtime-diagnostics'
          files = sorted(path for path in root.rglob('*') if path.is_file())
          manifest = [{'path': path.relative_to(root).as_posix(), 'bytes': path.stat().st_size,
                       'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in files]
          (root / 'SHA256SUMS').write_text(''.join(f"{item['sha256']}  {item['path']}\n" for item in manifest))
          source = {'sourceRevision': os.environ['GITHUB_SHA'],
                    'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'workflowRun': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'abi': 'x86_64', 'prebuiltApks': True, 'files': manifest}
          (root / 'source-manifest.json').write_text(json.dumps(source, indent=2) + '\n')
          PY
      - name: Upload the built x86 runtime contract
        if: ${{ !cancelled() && matrix.abi == 'x86_64' && steps.emulator_apks.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AEROVE-Lite-runtime-contract
          path: ${{ runner.temp }}/lite-runtime-diagnostics/
          if-no-files-found: error
      - name: Check the ARM64 APK and record its exact provenance
        if: matrix.abi == 'arm64-v8a'
        run: |
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs \
            apps/aerove-lite/app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/lite-signature.txt"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" dump badging \
            apps/aerove-lite/app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/lite-badging.txt"
          python3 apps/aerove-lite/tool/verify_apk.py \
            --apk apps/aerove-lite/app/build/outputs/apk/release/app-release.apk --channel preview \
            --abi arm64-v8a --source "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})" \
            --workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --badging "$RUNNER_TEMP/lite-badging.txt" --signature "$RUNNER_TEMP/lite-signature.txt" \
            --output "$RUNNER_TEMP/lite-artifact"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.abi == 'arm64-v8a'
        with:
          name: AEROVE-Lite-preview-arm64
          path: ${{ runner.temp }}/lite-artifact/
          if-no-files-found: error
      - name: Enable KVM for the isolated test emulator
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real API 33 dashboard matrix
        id: dashboard_matrix
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash apps/aerove-lite/tool/emulator_acceptance.sh matrix
      - name: Preserve the first Android dashboard captures
        if: ${{ !cancelled() && matrix.abi == 'x86_64' && (steps.dashboard_matrix.outcome == 'success' || steps.dashboard_matrix.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AEROVE-Lite-dashboard-matrix
          path: ${{ runner.temp }}/lite-diagnostics/matrix/
          if-no-files-found: error
      - name: Real API 33 remaining native, TUN and graphics verification
        if: ${{ !cancelled() && matrix.abi == 'x86_64' && steps.emulator_apks.outcome == 'success' && (steps.dashboard_matrix.outcome == 'success' || steps.dashboard_matrix.outcome == 'failure') }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash apps/aerove-lite/tool/emulator_acceptance.sh remaining
      - name: Preserve diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lite-diagnostics"
          git status --short > "$RUNNER_TEMP/lite-diagnostics/git-status.txt"
          git diff --binary > "$RUNNER_TEMP/lite-diagnostics/generated.patch"
          if timeout 5s adb get-state > /dev/null 2>&1; then
            timeout 15s adb logcat -d > "$RUNNER_TEMP/lite-diagnostics/logcat.txt" 2>&1 || true
            timeout 30s adb pull /sdcard/Android/data/dev.aerove.lite/files/captures "$RUNNER_TEMP/lite-diagnostics/" || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: AEROVE-Lite-diagnostics-${{ matrix.abi }}
          path: |
            apps/aerove-lite/app/build/reports/
            apps/aerove-lite/app/build/outputs/androidTest-results/
            apps/aerove-lite/native/Cargo.lock
            ${{ runner.temp }}/lite-diagnostics/
            ${{ runner.temp }}/lite-fixture.log
          if-no-files-found: warn
