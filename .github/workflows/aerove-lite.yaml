        run_fixture dns-meow --dart-define=DNS99_CORE=meow-rs --dart-define="DNS99_OUTPUT=$evidence/dns-meow.json" test/common/native_lite_dns99_test.dart
        run_fixture dns-mihomo --dart-define=DNS99_CORE=mihomo --dart-define="DNS99_OUTPUT=$evidence/dns-mihomo.json" test/common/native_lite_dns99_test.dart
        run_fixture geo-live-meow --dart-define=DTO_CORE=meow-rs --dart-define="GEO_LIVE_FIXTURE=$evidence/geo-live-meow.json" test/common/geo_live_producer91_test.dart
        run_fixture geo-live-mihomo --dart-define=DTO_CORE=mihomo --dart-define="GEO_LIVE_FIXTURE=$evidence/geo-live-mihomo.json" test/common/geo_live_producer91_test.dart
        run_fixture geo-trigger-meow --dart-define=DTO_CORE=meow-rs test/common/geo_maintenance_trigger91_test.dart
        run_fixture geo-trigger-mihomo --dart-define=DTO_CORE=mihomo test/common/geo_maintenance_trigger91_test.dart
        run_fixture geo-selection-meow test/common/geo_selection_producer91_test.dart
        run_fixture geo-transaction-meow test/common/native_lite_geo_transaction114_test.dart
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        output = Path(os.environ['RUNNER_TEMP']) / 'lite-flutter-host/dart-closure'
        labels = ('dns-meow', 'dns-mihomo', 'geo-live-meow', 'geo-live-mihomo',
