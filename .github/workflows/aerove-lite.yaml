  original290_surface_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'IvanSolis1989/Aerove' && github.actor == 'IvanSolis1989' && github.ref == 'refs/heads/codex/lite290-same-apk-probe' && needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite290-surface-startup' }}
    needs:
    - diagnostic_guard
    strategy:
      fail-fast: false
      matrix:
        include:
        - phase: flutter-ui
          label: original290 mapped Surface/Window/compositor observation
          artifact_suffix: flutter-ui
    name: Original290 mapped Surface and startup only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AEROVE_LITE290_SURFACE_PROBE: '1'
      AEROVE_LITE290_BOOT_CRASH: '1'
      AEROVE_LITE290_LAVAPIPE: '1'
      ANDROID_SERIAL: emulator-5554
      AEROVE_GUEST_ANGLE: '1'
      AEROVE_CLEAR_FRAME_TRACE: '1'
      AEROVE_GLASS_CONSUMER_RECEIPT: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
