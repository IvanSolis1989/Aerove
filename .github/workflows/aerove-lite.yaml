          apps/aerove-lite/app/build/reports/
          apps/aerove-lite/app/build/test-results/
          ${{ runner.temp }}/lite-client-fixtures/
          apps/aerove-lite/app/build/intermediates/androidTestAppKeepRules/
        if-no-files-found: warn
  flutter_host_preflight:
    name: Shared Flutter client verification and Android host compilation (no APK)
    needs: promotion_request
    if: ${{ needs.promotion_request.result == 'success' && (inputs.client_preflight || (!inputs.meow_host_only && !inputs.native_preflight && !inputs.qa84_only && !inputs.qa79_only)) && inputs.accepted_build_run == '' && !inputs.publish_release && !inputs.meow_host_only && !inputs.native_preflight && !inputs.qa84_only && !inputs.qa79_only && (inputs.diagnostic_target == 'none' || inputs.diagnostic_target == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        submodules: recursive
        persist-credentials: false
    - uses: ./.github/actions/flutter
      with:
        flutter-version: 3.47.6
        cache: true
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Select the existing pinned Android SDK and NDK requirements
      run: |-
        sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0' "ndk;$NDK_VERSION"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.98.1
        targets: x86_64-linux-android
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.27.1
        cache-dependency-path: |
          apps/aerove-lite/regexp2/go.sum
          apps/aerove/core/go.sum
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      with:
        gradle-version: 9.6.0
        cache-read-only: false
    - name: Resolve the actual Lite Flutter plugin graph
      working-directory: apps/aerove-lite
      run: flutter pub get --enforce-lockfile
    - name: Resolve shared and Standard fixture dependencies with production hooks enabled
      run: |-
        (cd packages/aerove_client && flutter pub get --enforce-lockfile)
        (cd apps/aerove && flutter pub get --enforce-lockfile)
        python3 - <<'PY'
        import re
        from pathlib import Path
        for filename, hooks in (
            ('apps/aerove-lite/pubspec.yaml', ('rust_api',)),
            ('packages/aerove_client/pubspec.yaml', ('rust_api',)),
            ('apps/aerove/pubspec.yaml', ('setup', 'rust_api')),
        ):
            text = Path(filename).read_text()
            for hook in hooks:
                assert re.search(r'^    ' + hook + r':\s*\n      build_assets: true\s*$', text, re.M), (filename, hook)
        PY
    - name: Prepare the pinned Standard source required by the existing test hooks and assets
      working-directory: apps/aerove
      run: python3 tool/mihomo_source.py prepare
    - name: Compile the Flutter host and actual platform acceptance runner
      working-directory: apps/aerove-lite
      run: |-
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/lite-flutter-host/dependencies"
        gradle --no-daemon --continue -p android -Ptarget-platform=android-x64 -PliteAbi=x86_64 -PsourceSha="$GITHUB_SHA" \
          :app:compileReleaseKotlin :app:compileReleaseUnitTestKotlin \
          :platform-qa:compileReleaseKotlin :platform-qa:compileReleaseJavaWithJavac \
          :app:generateReleasePlatformTestAppKeepRules --dry-run \
          2>&1 | tee "$RUNNER_TEMP/lite-flutter-host/abi-task-graph.txt"
        python3 - <<'PY'
        import json, os, re
        from pathlib import Path
        output = Path(os.environ['RUNNER_TEMP']) / 'lite-flutter-host'
        graph = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', (output / 'abi-task-graph.txt').read_text())
        tasks = re.findall(r'(?m)^\s*(?:> Task\s+)?(:\S+)\s+SKIPPED\s*$', graph)
        required = {':app:compileReleaseKotlin', ':app:compileReleaseUnitTestKotlin',
                    ':platform-qa:compileReleaseKotlin', ':platform-qa:compileReleaseJavaWithJavac',
                    ':app:generateReleasePlatformTestAppKeepRules'}
        forbidden = [task for task in tasks if re.fullmatch(r':(?:app|platform-qa):(?:minify[^:]+|packageRelease|assembleRelease)', task)]
        (output / 'abi-task-selection.json').write_text(json.dumps(dict(tasks=tasks, forbidden=forbidden,
            missing=sorted(required-set(tasks)), duplicateRequired=sorted(task for task in required if tasks.count(task) != 1)), indent=2) + '\n')
        assert tasks and all(tasks.count(task) == 1 for task in required), 'ABI preflight graph lacks its exact compile/inference tasks'
        assert not forbidden, 'ABI preflight must stop before App/Test minification or APK packaging: ' + repr(forbidden)
        PY
        query_failure=0
        for component in app platform-qa; do
          if gradle --no-daemon -p android ":$component:dependencies" --configuration releaseRuntimeClasspath \
            -Ptarget-platform=android-x64 -PliteAbi=x86_64 -PsourceSha="$GITHUB_SHA" \
            > "$RUNNER_TEMP/lite-flutter-host/dependencies/$component-releaseRuntimeClasspath.stdout.txt" \
            2> "$RUNNER_TEMP/lite-flutter-host/dependencies/$component-releaseRuntimeClasspath.stderr.txt"; then
            query_exit=0
          else
            query_exit=$?
            query_failure=$query_exit
          fi
          printf '%s\n' "$query_exit" > "$RUNNER_TEMP/lite-flutter-host/dependencies/$component-releaseRuntimeClasspath.exit.txt"
        done
        test "$query_failure" = 0
        gradle --no-daemon --continue -p android -Ptarget-platform=android-x64 -PliteAbi=x86_64 -PsourceSha="$GITHUB_SHA" \
          :app:compileReleaseKotlin :app:compileReleaseUnitTestKotlin \
          :platform-qa:compileReleaseKotlin :platform-qa:compileReleaseJavaWithJavac \
          :app:generateReleasePlatformTestAppKeepRules \
          2>&1 | tee "$RUNNER_TEMP/lite-flutter-host/compile.log"
        test -s build/app/intermediates/androidTestAppKeepRules/release/rules.pro
        test -s build/app/intermediates/androidTestAppKeepRules/release/inputs.json
    - name: Reproduce retained TUN migration failure with the original affected production files
      if: ${{ inputs.client_preflight }}
      working-directory: apps/aerove-lite
      run: |
        python3 - <<'PY'
        import hashlib, json, os, shutil, subprocess
        from pathlib import Path
        import xml.etree.ElementTree as ET
        root = Path.cwd()
        evidence = Path(os.environ['RUNNER_TEMP']) / 'lite-flutter-host/tun-baseline'
        evidence.mkdir()
        baseline = '2a38627ca1c224f6ebf71c3e42052912699decdb'
        paths = ['app/src/main/java/dev/aerove/lite/data/ProfileRepository.kt',
                 'app/src/main/java/dev/aerove/lite/data/ResourceBundleManager.kt',
                 'app/src/main/java/dev/aerove/lite/flutter/MeowLegacyMigrationExport.kt']
        saved = {name: (root/name).read_bytes() for name in paths}
        receipt = dict(kind='affected-production-overlay-regression', baselineProductionSource=baseline,
            executorSource=os.environ['GITHUB_SHA'], baselineOutcome='not-executed', apkBuilt=False, androidAppExecuted=False)
        case = 'retainedTunBundlesUseEachActualPolicyAndOldSettingsWithoutChangingSource'
        test = root/'app/src/test/java/dev/aerove/lite/flutter/MeowLegacyMigrationExportTest.kt'
        receipt['testSha256'] = hashlib.sha256(test.read_bytes()).hexdigest()
        subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', baseline], check=True)
        try:
            for name in paths:
                data = subprocess.check_output(['git', 'show', baseline+':apps/aerove-lite/'+name])
                (root/name).write_bytes(data)
            receipt['productionFiles'] = {name: hashlib.sha256((root/name).read_bytes()).hexdigest() for name in paths}
            command = ['gradle', '--no-daemon', '-p', 'android', '-Ptarget-platform=android-x64', '-PliteAbi=x86_64',
                '-PsourceSha='+os.environ['GITHUB_SHA'], ':app:testReleaseUnitTest', '--tests',
                'dev.aerove.lite.flutter.MeowLegacyMigrationExportTest.'+case]
            with (evidence/'original-failure.log').open('wb') as output:
                result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT)
            receipt['exit'] = result.returncode
            reports = root/'build/app/test-results/testReleaseUnitTest'
            shutil.copytree(reports, evidence/'original-xml')
            cases = [node for file in (evidence/'original-xml').glob('TEST-*.xml')
                     for node in ET.parse(file).getroot().iter('testcase')]
            assert result.returncode != 0 and len(cases) == 1 and cases[0].get('name') == case
            failure = cases[0].find('failure')
            assert failure is not None and not cases[0].findall('skipped') and not cases[0].findall('error')
            assert failure.get('type') == 'dev.aerove.lite.flutter.MeowLegacyExportException'
            expected = 'dev.aerove.lite.flutter.MeowLegacyExportException: profiles/index.json: invalid legacy source; no defaults or repairs applied'
            assert failure.get('message') == expected
            message = ''.join(failure.itertext())
            assert 'Suppressed: dev.aerove.lite.data.ConfigValidationException:' in message
            assert '$.tun.enable: Explicit source TUN policy requires Android Builder reconciliation before activation' in message
            receipt['baselineOutcome'] = 'expected-original-failure-reproduced'
        finally:
            for name, data in saved.items():
                (root/name).write_bytes(data)
            receipt['candidateProductionRestored'] = all((root/name).read_bytes() == data for name,data in saved.items())
            (evidence/'BASELINE.json').write_text(json.dumps(receipt, indent=2)+'\n')
        assert receipt['candidateProductionRestored']
        print('Original affected production regression remains RED; candidate tests follow separately.')
        PY
    - name: Verify native migration ownership and the real Kotlin to Dart import
      working-directory: apps/aerove-lite
      run: |-
        set -euo pipefail
        evidence="$RUNNER_TEMP/lite-flutter-host/native-migration"
        test ! -e "$evidence"
        gradle --no-daemon -p android -Ptarget-platform=android-x64 -PliteAbi=x86_64 -PsourceSha="$GITHUB_SHA" \
          -DnativeMigration.fixture="$evidence" :app:testReleaseUnitTest \
          --tests dev.aerove.lite.flutter.MeowLegacyMigrationOwnerTest \
          --tests dev.aerove.lite.flutter.MeowLegacyMigrationExportTest \
          --tests dev.aerove.lite.flutter.ResourceReaderFenceRegressionTest \
          --tests dev.aerove.lite.data.MeowTunReconciliation90Test \
          --tests dev.aerove.lite.fixtures.NativeMigrationInteropFixtureTest \
          2>&1 | tee "$RUNNER_TEMP/lite-flutter-host/native-migration-jvm.log"
        test -s "$evidence/fixture.json"
        (cd ../aerove && flutter test --no-pub --concurrency 1 \
          --dart-define=AEROVE_TEST_SUITE_PRODUCT=true \
          --dart-define="NATIVE_LITE_FIXTURE=$evidence/fixture.json" \
          test/common/native_lite_migration_test.dart) \
          2>&1 | tee "$RUNNER_TEMP/lite-flutter-host/native-migration-dart.log"
    - name: Verify DNS and Geo fixtures in eight independent Flutter processes
      timeout-minutes: 30
      working-directory: apps/aerove
      run: |-
        set -euo pipefail
        evidence="$RUNNER_TEMP/lite-flutter-host/dart-closure"
        mkdir -p "$evidence"
        node_binary="$(command -v node)"
        "$node_binary" --version | tee "$evidence/node-version.txt"
        export AEROVE_TEST_NODE="$node_binary"
        run_fixture() {
          local label="$1"
          shift
          printf '%q ' flutter test --no-pub --concurrency 1 --dart-define=AEROVE_TEST_SUITE_PRODUCT=true "$@" > "$evidence/$label.command.txt"
          printf '\n' >> "$evidence/$label.command.txt"
          set +e
          flutter test --no-pub --concurrency 1 --dart-define=AEROVE_TEST_SUITE_PRODUCT=true "$@" 2>&1 | tee "$evidence/$label.log"
          local statuses=("${PIPESTATUS[@]}")
