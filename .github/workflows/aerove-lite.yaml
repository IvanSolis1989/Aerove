name: AEROVE Lite
defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
permissions:
  contents: read
concurrency:
  group: ${{ inputs.publish_release && format('aerove-lite-{0}', github.ref) || format('aerove-lite-{0}-{1}-{2}', github.ref, github.sha, inputs.diagnostic_target && inputs.diagnostic_target != 'none' && format('diagnostic-{0}', inputs.diagnostic_target) || inputs.meow_host_only && 'host' || inputs.client_preflight && 'client' || inputs.qa84_only && 'qa84' || inputs.qa79_only && 'qa79' || inputs.native_preflight && 'native' || 'full') }}
  cancel-in-progress: false
env:
  NDK_VERSION: 28.2.13676358
jobs:
  promotion_request:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      ACCEPTED_BUILD_RUN: ${{ inputs.accepted_build_run }}
      PUBLISH_RELEASE: ${{ inputs.publish_release }}
      BUILD_APK: ${{ inputs.build_apk }}
      PREPARE_SOURCES: ${{ inputs.prepare_sources }}
      VERIFICATION_RECHECK: ${{ inputs.verification_recheck }}
      ORIGINAL_BUILD_RUN: ${{ inputs.original_build_run }}
      DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
      MEOW_HOST_ONLY: ${{ inputs.meow_host_only }}
      QA84_ONLY: ${{ inputs.qa84_only }}
      QA79_ONLY: ${{ inputs.qa79_only }}
      CLIENT_PREFLIGHT: ${{ inputs.client_preflight }}
      NATIVE_PREFLIGHT: ${{ inputs.native_preflight }}
    steps:
      - name: Reject ambiguous build and promotion requests before any producer
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import os, re
          e = os.environ
          accepted, publish = e.get('ACCEPTED_BUILD_RUN', ''), e.get('PUBLISH_RELEASE') == 'true'
          if bool(accepted) != publish:
              raise SystemExit('Publish requires an explicit accepted_build_run; accepted_build_run cannot start a build')
          if accepted:
              if not re.fullmatch(r'[1-9][0-9]*', accepted):
                  raise SystemExit('accepted_build_run must be a positive original run ID')
              if e['GITHUB_EVENT_NAME'] != 'workflow_dispatch' or e['GITHUB_REF'] != 'refs/heads/main':
                  raise SystemExit('Promotion requires an explicit main workflow dispatch')
              flags = ('BUILD_APK', 'PREPARE_SOURCES', 'VERIFICATION_RECHECK', 'MEOW_HOST_ONLY', 'QA84_ONLY', 'QA79_ONLY', 'CLIENT_PREFLIGHT', 'NATIVE_PREFLIGHT')
              if any(e.get(key) == 'true' for key in flags) or e.get('DIAGNOSTIC_TARGET', '') not in ('', 'none') or e.get('ORIGINAL_BUILD_RUN'):
                  raise SystemExit('Promotion cannot build, recheck, prepare or diagnose')
          elif e.get('ORIGINAL_BUILD_RUN') and e.get('VERIFICATION_RECHECK') != 'true':
              raise SystemExit('original_build_run belongs only to verification_recheck')
          PY

  diagnostic_guard:
    name: Validate prebuilt Android diagnosis only
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (inputs.diagnostic_target != 'none' && (github.event_name == 'workflow_dispatch' || inputs.diagnostic_target)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Validate exclusive immutable Android diagnostic request
      env:
        REQUEST_EVENT: ${{ github.event_name }}
        DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
        MEOW_HOST_ONLY: ${{ inputs.meow_host_only }}
        QA84_ONLY: ${{ inputs.qa84_only }}
        QA79_ONLY: ${{ inputs.qa79_only }}
        CLIENT_PREFLIGHT: ${{ inputs.client_preflight }}
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        NATIVE_PREFLIGHT: ${{ inputs.native_preflight }}
        NATIVE_TEST_SERIAL: ${{ inputs.native_test_serial }}
        NATIVE_UNDERLAY_TESTS: ${{ inputs.native_underlay_tests }}
        NATIVE_TEST_STACKS: ${{ inputs.native_test_stacks }}
        NATIVE_TEST_FILTER: ${{ inputs.native_test_filter }}
      run: |
        python3 - <<'PY'
        import os
        value = os.environ['DIAGNOSTIC_TARGET']
        conflicts = [key for key in ('MEOW_HOST_ONLY', 'QA84_ONLY', 'QA79_ONLY', 'CLIENT_PREFLIGHT', 'PUBLISH_RELEASE', 'NATIVE_PREFLIGHT', 'NATIVE_TEST_SERIAL', 'NATIVE_UNDERLAY_TESTS', 'NATIVE_TEST_STACKS') if os.environ[key] == 'true']
        if os.environ['NATIVE_TEST_FILTER']:
            conflicts.append('NATIVE_TEST_FILTER')
        if value not in ('lite94-matrix', 'std40', 'both', 'beta14-profile-only', 'lite125-test-only', 'lite125-original-samples', 'lite141-prebuilt-shards') or os.environ['REQUEST_EVENT'] != 'workflow_dispatch' or conflicts:
            raise SystemExit('Invalid prebuilt Android diagnosis target/event or conflicting inputs: ' + repr((value, conflicts)))
        PY
  diagnostic_lite125_test_only:
    name: Lite125 test-only dry-run task graph (no APK build)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite125-test-only') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite125-test-only-diagnostic.yaml
  diagnostic_lite125_original_samples:
    name: Three isolated Lite125 original render samples
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite125-original-samples') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite125-original-samples.yaml
    with:
      exclusive_mode: true
  diagnostic_lite94:
    name: Immutable Lite run94 matrix diagnosis
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && (inputs.diagnostic_target == 'lite94-matrix' || inputs.diagnostic_target == 'both')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: true
      runtime_target: lite94
  diagnostic_beta14_profile:
    name: Immutable beta14 render profile only (no build)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'beta14-profile-only') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: true
      runtime_target: beta14
  diagnostic_lite141_shards:
    name: Lite141 original APK remaining shard ${{ matrix.shard_index }}/8 (diagnostic only)
    needs: diagnostic_guard
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (needs.diagnostic_guard.result == 'success' && inputs.diagnostic_target == 'lite141-prebuilt-shards') }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: true
      runtime_target: lite141-prebuilt-shards
      shard_index: ${{ matrix.shard_index }}
  diagnostic_lite141_aggregate:
    name: Lite141 diagnostic-only eight-shard aggregate
    needs: [diagnostic_guard, diagnostic_lite141_shards]
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && (always() && needs.diagnostic_guard.result == 'success' && needs.diagnostic_lite141_shards.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Download only current-attempt Lite141 diagnostic shards
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        pattern: AEROVE-Lite-original141-shard-*-of-8-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite141-shards
    - name: Verify original-App and independent-harness identities and exact eight-shard union
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      env:
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: >-
        python3 apps/aerove-lite/tool/lite141_shards_diagnostic.py aggregate
        --directory "$RUNNER_TEMP/lite141-shards"
        --output "$RUNNER_TEMP/lite141-diagnostic-aggregate.json"
    - name: Preserve diagnostic-only aggregate
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AEROVE-Lite-original141-diagnostic-aggregate-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite141-diagnostic-aggregate.json
        if-no-files-found: warn
  qa84:
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && ((inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (github.event_name == 'workflow_dispatch' && inputs.qa84_only))) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite-qa84.yaml
    with:
      exclusive_mode: ${{ !inputs.qa79_only && !inputs.publish_release && !inputs.native_preflight && !inputs.client_preflight }}
  qa79:
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && ((inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (github.event_name == 'workflow_dispatch' && inputs.qa79_only)))) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aerove-lite-qa79.yaml
    with:
      exclusive_mode: ${{ !inputs.publish_release && !inputs.native_preflight && !inputs.client_preflight }}
  legacy_native_diagnosis:
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && ((inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (inputs.native_preflight && !inputs.publish_release)))))) }}
    env:
      RUSTC_BOOTSTRAP: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.99.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: apps/aerove-lite/native -> target
        cache-on-failure: ${{ inputs.native_preflight }}
        cache-workspace-crates: true
        cache-directories: apps/aerove-lite/native/.upstream
    - name: Ensure GDB is available for requested native stack capture
      if: ${{ inputs.native_preflight && inputs.native_test_stacks }}
      timeout-minutes: 5
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |-
        set -euo pipefail
        if ! command -v gdb >/dev/null 2>&1; then
          sudo -n env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=10s 90s \
            apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 update
          sudo -n env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=10s 150s \
            apt-get -o DPkg::Lock::Timeout=30 -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            install --yes --no-install-recommends gdb
        fi
        command -v gdb
        timeout --signal=TERM --kill-after=5s 10s \
          gdb -nx -nh --batch -ex 'show version' -ex quit
    - name: Initialize native lock and run host Rust tests
      if: ${{ inputs.native_preflight }}
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      env:
        NATIVE_TEST_FILTER: ${{ inputs.native_test_filter }}
        NATIVE_TEST_SERIAL: ${{ inputs.native_test_serial }}
        NATIVE_TEST_STACKS: ${{ inputs.native_test_stacks }}
        NATIVE_UNDERLAY_TESTS: ${{ inputs.native_underlay_tests }}
        RUST_TEST_NOCAPTURE: '1'
        RUST_BACKTRACE: '1'
      run: |
        evidence="$RUNNER_TEMP/lite-native-preflight"
        mkdir -p "$evidence"
        python3 - <<'PY' > "$evidence/before.json"
        import hashlib, json, subprocess
        from pathlib import Path
        root = Path('apps/aerove-lite/native')
        lock = root / 'Cargo.lock'
        source_lock = subprocess.check_output(['git', 'show', 'HEAD:apps/aerove-lite/native/Cargo.lock'])
        print(json.dumps({
            'sourceSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
            'lockSha256Before': hashlib.sha256(lock.read_bytes()).hexdigest() if lock.is_file() else None,
            'lockSha256AtSource': hashlib.sha256(source_lock).hexdigest(),
            'lockPresentBefore': lock.is_file(),
        }, indent=2))
        PY
        if [[ "$NATIVE_TEST_STACKS" == true && -z "$NATIVE_TEST_FILTER" ]]; then
          echo 'Stack diagnosis requires an explicit host-test filter.' >&2
          exit 2
        fi
        if [[ "$NATIVE_UNDERLAY_TESTS" == true ]]; then
          if [[ -n "$NATIVE_TEST_FILTER" || "$NATIVE_TEST_STACKS" == true ]]; then
            echo 'Underlay tests require no core filter or stack capture.' >&2
            exit 2
          fi
          python3 apps/aerove-lite/native/build.py --initialize-lock --prepare-only
          cp apps/aerove-lite/native/Cargo.lock "$evidence/underlay-Cargo.lock.before"
          set +e
          (cd apps/aerove-lite/native && \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/apps/aerove-lite/native/target" \
            timeout --signal=TERM --kill-after=10s 8m cargo test --locked --offline --manifest-path Cargo.toml \
            -p aerove-ts-underlay@0.1.0 --test sockets --no-run) 2>&1 | tee "$evidence/native-compile.log"
          compile_status=${PIPESTATUS[0]}
          command_status=$compile_status
          if [[ "$compile_status" == 0 ]]; then
            (cd apps/aerove-lite/native && \
              CARGO_TARGET_DIR="$GITHUB_WORKSPACE/apps/aerove-lite/native/target" RUST_BACKTRACE=1 \
              timeout --signal=TERM --kill-after=10s 120s cargo test --locked --offline --manifest-path Cargo.toml \
              -p aerove-ts-underlay@0.1.0 --test sockets -- --test-threads=1 --nocapture) 2>&1 | tee "$evidence/native-test.log"
            command_status=${PIPESTATUS[0]}
          fi
          set -e
        elif [[ -n "$NATIVE_TEST_FILTER" ]]; then
          [[ "$NATIVE_TEST_FILTER" =~ ^[[:alnum:]_:]+$ ]] || exit 2
          python3 apps/aerove-lite/native/build.py --initialize-lock --prepare-only
          set +e
          (cd apps/aerove-lite/native && \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/apps/aerove-lite/native/target" \
            timeout --signal=TERM --kill-after=10s 8m cargo test --locked --lib --no-run) \
            2>&1 | tee "$evidence/native-compile.log"
          compile_status=${PIPESTATUS[0]}
          command_status=$compile_status
          if [[ "$compile_status" == 0 ]]; then
            stack_monitor=''
            if [[ "$NATIVE_TEST_STACKS" == true ]]; then
              python3 apps/aerove-lite/tooling/capture_native_stacks.py \
                --target-dir "$GITHUB_WORKSPACE/apps/aerove-lite/native/target" \
                --evidence-dir "$evidence/stacks" --filter "$NATIVE_TEST_FILTER" \
                > "$evidence/stack-monitor.log" 2>&1 &
              stack_monitor=$!
            fi
            (cd apps/aerove-lite/native && \
              CARGO_TARGET_DIR="$GITHUB_WORKSPACE/apps/aerove-lite/native/target" RUST_BACKTRACE=1 \
              timeout --signal=TERM --kill-after=10s 120s cargo test --locked --lib "$NATIVE_TEST_FILTER" \
              -- --test-threads=1 --nocapture) 2>&1 | tee "$evidence/native-test.log"
            command_status=${PIPESTATUS[0]}
            if [[ -n "$stack_monitor" ]]; then
              kill -TERM "$stack_monitor" 2>/dev/null || true
              wait "$stack_monitor" || true
            fi
          fi
          set -e
        else
          compile_status=''
          if [[ "$NATIVE_TEST_SERIAL" == true ]]; then export RUST_TEST_THREADS=1; fi
          set +e
          timeout --signal=TERM --kill-after=10s 10m \
            python3 apps/aerove-lite/native/build.py --initialize-lock --test 2>&1 | tee "$evidence/native-test.log"
          command_status=${PIPESTATUS[0]}
          set -e
        fi
        python3 - "$command_status" "$compile_status" <<'PY'
        import hashlib, json, os, re, sys
        from pathlib import Path
        evidence = Path(os.environ['RUNNER_TEMP']) / 'lite-native-preflight'
        before = json.loads((evidence / 'before.json').read_text())
        lock = Path('apps/aerove-lite/native/Cargo.lock')
        provenance_path = Path('apps/aerove-lite/native/.upstream/clash-rs/AEROVE_PROVENANCE.json')
        provenance = json.loads(provenance_path.read_text()) if provenance_path.is_file() else None
        underlay = os.environ['NATIVE_UNDERLAY_TESTS'] == 'true'
        selected = underlay or bool(os.environ['NATIVE_TEST_FILTER'])
        underlay_command = 'cargo test --locked --offline --manifest-path Cargo.toml -p aerove-ts-underlay@0.1.0 --test sockets'
        result = {
            **before,
            'command': ('timeout --signal=TERM --kill-after=10s 120s ' + underlay_command + ' -- --test-threads=1 --nocapture') if underlay else ('timeout --signal=TERM --kill-after=10s 120s cargo test --locked --lib '
                        + os.environ['NATIVE_TEST_FILTER'] + ' -- --test-threads=1 --nocapture') if os.environ['NATIVE_TEST_FILTER'] else
                       'timeout --signal=TERM --kill-after=10s 10m python3 apps/aerove-lite/native/build.py --initialize-lock --test',
            'testSelection': 'aerove-ts-underlay@0.1.0::sockets' if underlay else os.environ['NATIVE_TEST_FILTER'] or 'full-suite',
            'underlayTestsRequested': underlay,
            'expectedUnderlayTests': 7 if underlay else None,
            'stackCaptureRequested': os.environ['NATIVE_TEST_STACKS'] == 'true',
            'stackCaptureMetadata': 'stacks/capture.json' if (evidence / 'stacks/capture.json').is_file() else None,
            'testThreads': 1 if selected or os.environ['NATIVE_TEST_SERIAL'] == 'true' else 'default',
            'workingDirectory': 'apps/aerove-lite/native' if selected else '.',
            'compileCommand': ('timeout --signal=TERM --kill-after=10s 8m ' + underlay_command + ' --no-run') if underlay else 'timeout --signal=TERM --kill-after=10s 8m cargo test --locked --lib --no-run' if os.environ['NATIVE_TEST_FILTER'] else None,
            'compileExitCode': int(sys.argv[2]) if sys.argv[2] else None,
            'compileLog': 'native-compile.log' if selected else None,
            'commandStage': 'compile' if sys.argv[2] and int(sys.argv[2]) != 0 else 'test',
            'commandLog': 'native-compile.log' if sys.argv[2] and int(sys.argv[2]) != 0 else 'native-test.log',
            'commandExitCode': int(sys.argv[1]),
            'lockSha256After': hashlib.sha256(lock.read_bytes()).hexdigest() if lock.is_file() else None,
            'lockChanged': (hashlib.sha256(lock.read_bytes()).hexdigest() if lock.is_file() else None) != before['lockSha256Before'],
            'stableLockGate': 'not-run-in-native-preflight',
            'preparedSourceProvenance': provenance,
        }
        validation_error = None
        if underlay and result['commandExitCode'] == 0:
            helper = Path('apps/aerove-lite/native/.upstream/dependency-protect/aerove-ts-underlay')
            test_source = helper / 'tests/sockets.rs'
            names = re.findall(r'#\[tokio::test\]\s+async fn (\w+)\(', test_source.read_text())
            log = re.sub(r'\x1b\[[0-9;]*m', '', (evidence / 'native-test.log').read_text())
            passed = [name for name in names if re.search(r'^test ' + re.escape(name) + r' \.\.\. ok\s*$', log, re.MULTILINE)]
            lock_unchanged = lock.read_bytes() == (evidence / 'underlay-Cargo.lock.before').read_bytes()
            helper_lock_created = (helper / 'Cargo.lock').exists()
            complete = bool(re.search(r'^test result: ok\. 7 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;', log, re.MULTILINE))
            if len(names) != 7 or len(passed) != 7 or not complete or not lock_unchanged or helper_lock_created:
                validation_error = 'Underlay tests did not prove seven named passes with the unchanged root lock.'
            result['underlayTestReceipt'] = {'expectedTests': names, 'passedTests': passed, 'rootLockUnchanged': lock_unchanged, 'helperLockCreated': helper_lock_created, 'testSourceSha256': hashlib.sha256(test_source.read_bytes()).hexdigest()}
        result['validationError'] = validation_error
        (evidence / 'after.json').write_text(json.dumps(result, indent=2) + '\n')
        if result['lockChanged']:
            print('::notice::Native preflight generated or changed Cargo.lock; this does not pass the normal stable-lock gate.')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('Native-only preflight completed. The normal stable Cargo.lock diff gate and Android verification/APK gates were not run.\n')
            summary.write(f"Cargo.lock changed during lock initialization: {result['lockChanged']}\n")
        sys.exit(1 if validation_error else int(sys.argv[1]))
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() && inputs.native_preflight }}
      with:
        name: AEROVE-Lite-native-preflight
        path: |
          apps/aerove-lite/native/Cargo.lock
          ${{ runner.temp }}/lite-native-preflight/
        if-no-files-found: warn
  resolve:
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && ((inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (inputs.meow_host_only || (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (!inputs.native_preflight && !inputs.publish_release)))))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Validate exclusive full Meow host-only request
      if: ${{ inputs.meow_host_only }}
      env:
        REQUEST_EVENT: ${{ github.event_name }}
        QA84_ONLY: ${{ inputs.qa84_only }}
        QA79_ONLY: ${{ inputs.qa79_only }}
        CLIENT_PREFLIGHT: ${{ inputs.client_preflight }}
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        NATIVE_PREFLIGHT: ${{ inputs.native_preflight }}
        NATIVE_TEST_FILTER: ${{ inputs.native_test_filter }}
        NATIVE_TEST_SERIAL: ${{ inputs.native_test_serial }}
        NATIVE_UNDERLAY_TESTS: ${{ inputs.native_underlay_tests }}
        NATIVE_TEST_STACKS: ${{ inputs.native_test_stacks }}
      run: |-
        python3 - <<'PY'
        import os
        conflicts = [key for key in ('QA84_ONLY', 'QA79_ONLY', 'CLIENT_PREFLIGHT', 'PUBLISH_RELEASE',
                     'NATIVE_PREFLIGHT', 'NATIVE_TEST_SERIAL', 'NATIVE_UNDERLAY_TESTS', 'NATIVE_TEST_STACKS')
                     if os.environ[key] == 'true']
        if os.environ['NATIVE_TEST_FILTER']:
            conflicts.append('NATIVE_TEST_FILTER')
        if os.environ['REQUEST_EVENT'] != 'workflow_dispatch' or conflicts:
            raise SystemExit('meow_host_only requires an exclusive workflow_dispatch request; conflicts: ' + ', '.join(conflicts))
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.98.1
        components: rustfmt
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: apps/aerove-lite/meow-native -> target
        key: lite-meow-host-rust1.98.1
        cache-workspace-crates: true
        cache-directories: apps/aerove-lite/meow-native/.upstream
    - name: Stable lock and host production regression
      env:
        REQUEST_EVENT: ${{ github.event_name }}
        MEOW_HOST_ONLY: ${{ inputs.meow_host_only }}
        DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
        NATIVE_TEST_FILTER: ${{ inputs.native_test_filter }}
        QA84_ONLY: ${{ inputs.qa84_only }}
        QA79_ONLY: ${{ inputs.qa79_only }}
        CLIENT_PREFLIGHT: ${{ inputs.client_preflight }}
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        NATIVE_PREFLIGHT: ${{ inputs.native_preflight }}
        NATIVE_TEST_SERIAL: ${{ inputs.native_test_serial }}
        NATIVE_UNDERLAY_TESTS: ${{ inputs.native_underlay_tests }}
        NATIVE_TEST_STACKS: ${{ inputs.native_test_stacks }}
      run: |-
        set -euo pipefail
        python3 apps/aerove-lite/meow-native/test_core_tests.py
        pending=false
        if [[ "$MEOW_HOST_ONLY" == true ]]; then
          pending=$(python3 -c 'import json; print(str(json.load(open("apps/aerove-lite/meow-native/build-policy.json"))["resolveLock"] is True).lower())')
        fi
        if [[ "$pending" == true ]]; then
          evidence=apps/aerove-lite/meow-native/build
          mkdir -p "$evidence"
          python3 apps/aerove-lite/tool/ci_artifacts.py admission --host-lock-resolution --phase host > "$evidence/host-lock-resolution-plan.json"
          cat "$evidence/host-lock-resolution-plan.json"
          python3 apps/aerove-lite/meow-native/build.py --resolve-lock
          python3 apps/aerove-lite/tool/ci_artifacts.py host-resolution-result --host-lock-resolution --phase host --receipt "$evidence/host-lock-resolution-plan.json" > "$evidence/host-lock-resolution-readback.json"
          cat "$evidence/host-lock-resolution-readback.json"
        else
          python3 apps/aerove-lite/tool/ci_artifacts.py admission
          python3 apps/aerove-lite/meow-native/build.py
          python3 apps/aerove-lite/tool/ci_artifacts.py host
          git diff --exit-code -- apps/aerove-lite/meow-native/Cargo.lock
        fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: AEROVE-Lite-meow-host-attempt-${{ github.run_attempt }}
        path: |-
          apps/aerove-lite/meow-native/Cargo.lock
          apps/aerove-lite/meow-native/build/
        if-no-files-found: error
  verify:
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && ((inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (inputs.client_preflight || (!inputs.native_preflight && !inputs.publish_release)))))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Validate exclusive client-only preflight request
      if: ${{ inputs.client_preflight }}
      env:
        REQUEST_EVENT: ${{ github.event_name }}
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        NATIVE_PREFLIGHT: ${{ inputs.native_preflight }}
        NATIVE_TEST_FILTER: ${{ inputs.native_test_filter }}
        NATIVE_TEST_SERIAL: ${{ inputs.native_test_serial }}
        NATIVE_UNDERLAY_TESTS: ${{ inputs.native_underlay_tests }}
        NATIVE_TEST_STACKS: ${{ inputs.native_test_stacks }}
      run: |-
        python3 - <<'PY'
        import os
        conflicts = [key for key in ('PUBLISH_RELEASE', 'NATIVE_PREFLIGHT', 'NATIVE_TEST_SERIAL',
                     'NATIVE_UNDERLAY_TESTS', 'NATIVE_TEST_STACKS') if os.environ[key] == 'true']
        if os.environ['NATIVE_TEST_FILTER']:
            conflicts.append('NATIVE_TEST_FILTER')
        if os.environ['REQUEST_EVENT'] != 'workflow_dispatch' or conflicts:
            raise SystemExit('client_preflight requires an exclusive workflow_dispatch request; conflicts: ' + ', '.join(conflicts))
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Source preparation and APK inspector regression tests
      run: |-
        python3 apps/aerove-lite/meow-native/test_build.py
        python3 apps/aerove-lite/tool/test_verify_apk.py
        python3 apps/aerove-lite/tool/test_lite_release.py

        python3 apps/aerove-lite/tool/test_ci_artifacts.py
    - name: Check workspace layout
      run: python3 tooling/workspace.py check
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.27.1
        cache-dependency-path: apps/aerove-lite/regexp2/go.sum
    - name: Build the real host filter and age helpers for JVM verification
      timeout-minutes: 10
      run: |-
        python3 apps/aerove-lite/tool/ci_artifacts.py host-helper \
          --go "$(go env GOROOT)/bin/go" \
          --directory "$RUNNER_TEMP/lite-client-helper/staging" \
          --destination "$RUNNER_TEMP/lite-client-helper/bin" \
          --receipt apps/aerove-lite/app/build/reports/client-host-helper.json
        test -x "$RUNNER_TEMP/lite-client-helper/bin/hostverify"
        test -x "$RUNNER_TEMP/lite-client-helper/bin/ageverify"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - run: |
        sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0'
        test -f "$ANDROID_SDK_ROOT/platforms/android-37.1/android.jar"
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      with:
        gradle-version: 9.6.0
        cache-read-only: false
    - name: Kotlin data, lifecycle and UI compilation checks
      id: kotlin_checks
      working-directory: apps/aerove-lite
      env:
        AEROVE_FILTER_HELPER: ${{ runner.temp }}/lite-client-helper/bin/hostverify
      run: |-
        export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }-Daerove.age.fixtures=\"$GITHUB_WORKSPACE/apps/aerove-lite/regexp2/agebridge/testdata\" -Daerove.age.helper=\"$RUNNER_TEMP/lite-client-helper/bin/ageverify\""
        gradle --no-daemon --init-script tool/compose_ui_graphs.gradle :app:reportComposeUiResolution :app:checkReleaseAarMetadata :app:testReleaseUnitTest :app:lintRelease :app:compileReleaseAndroidTestKotlin :app:minifyReleaseWithR8
    - name: Inspect Android tasks after verification failure
      if: ${{ failure() && steps.kotlin_checks.outcome == 'failure' }}
      timeout-minutes: 3
      working-directory: apps/aerove-lite
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        mkdir -p app/build/reports
        gradle --no-daemon :app:tasks --all 2>&1 | tee app/build/reports/gradle-tasks.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: AEROVE-Lite-Kotlin-verification
        path: |
          apps/aerove-lite/app/build/reports/
          apps/aerove-lite/app/build/test-results/
          apps/aerove-lite/app/build/intermediates/androidTestAppKeepRules/
        if-no-files-found: warn
  reuse:
    needs: promotion_request
    if: ${{ (inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && !inputs.native_preflight))))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      run_number: ${{ steps.select.outputs.run_number }}
      run_attempt: ${{ steps.select.outputs.run_attempt }}
      artifact_ids: ${{ steps.select.outputs.artifact_ids }}
      build_source: ${{ steps.select.outputs.build_source }}
      build_tree: ${{ steps.select.outputs.build_tree }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Select the exact successful acceptance run
      id: select
      env:
        GH_TOKEN: ${{ github.token }}
        ACCEPTED_BUILD_RUN: ${{ inputs.accepted_build_run }}
      run: python3 apps/aerove-lite/tool/lite_release.py select --root "$GITHUB_WORKSPACE" --build-run "$ACCEPTED_BUILD_RUN" --source "$GITHUB_SHA" --current-run "$GITHUB_RUN_ID" --outputs "$GITHUB_OUTPUT"
  release:
    if: ${{ (inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && !inputs.native_preflight && needs.reuse.result == 'success'))))) }}
    needs:
    - reuse
    - promotion_request
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTANCE_RUN: ${{ needs.reuse.outputs.run_id }}
      ACCEPTANCE_NUMBER: ${{ needs.reuse.outputs.run_number }}
      ACCEPTANCE_ATTEMPT: ${{ needs.reuse.outputs.run_attempt }}
      ARTIFACT_IDS: ${{ needs.reuse.outputs.artifact_ids }}
      BUILD_SOURCE: ${{ needs.reuse.outputs.build_source }}
      BUILD_TREE: ${{ needs.reuse.outputs.build_tree }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Install the pinned APK signature reader
      run: |
        sdkmanager 'build-tools;37.0.0'
        test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
    - name: Download only selected immutable acceptance artifact IDs
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/lite-promotion"
        mkdir -p "$root"
        python3 - <<'PY' > "$root/artifact-ids.json"
        import json, os
        value = json.loads(os.environ['ARTIFACT_IDS'])
        expected = {'arm', 'helper', 'x86', 'matrix'}
        if set(value) != expected or any(not isinstance(v, int) or v < 1 for v in value.values()):
            raise SystemExit('Selected acceptance artifact IDs are incomplete')
        print(json.dumps(value))
        PY
        for key in arm helper x86 matrix; do
          artifact_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$root/artifact-ids.json" "$key")
          python3 apps/aerove-lite/tool/lite_release.py extract --artifact-id "$artifact_id" --destination "$root/$key"
        done
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs \
          "$root/arm/AEROVE-Lite-android-arm64.apk" > "$root/arm-signature.txt"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$root/arm/AEROVE-Lite-android-arm64.apk" > "$root/arm-badging.txt"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs \
          "$root/x86/apks/app-release.apk" > "$root/x86-signature.txt"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$root/x86/apks/app-release.apk" > "$root/x86-badging.txt"
    - name: Verify exact source, ABI contracts, native receipts and twelve Android captures
      run: |
        python3 apps/aerove-lite/tool/lite_release.py validate \
          --arm "$RUNNER_TEMP/lite-promotion/arm" --helper "$RUNNER_TEMP/lite-promotion/helper" \
          --runtime "$RUNNER_TEMP/lite-promotion/x86" --matrix "$RUNNER_TEMP/lite-promotion/matrix" \
          --source "$BUILD_SOURCE" --tree "$BUILD_TREE" \
          --root "$GITHUB_WORKSPACE" --release-source "$GITHUB_SHA" \
          --release-run "$GITHUB_RUN_ID" --release-attempt "$GITHUB_RUN_ATTEMPT" \
          --receipt "$RUNNER_TEMP/lite-promotion/promotion.json" \
          --run "$ACCEPTANCE_RUN" --attempt "$ACCEPTANCE_ATTEMPT" --number "$ACCEPTANCE_NUMBER" \
          --helper-source apps/aerove-lite/regexp2 \
          --arm-badging "$RUNNER_TEMP/lite-promotion/arm-badging.txt" \
          --arm-signature "$RUNNER_TEMP/lite-promotion/arm-signature.txt" \
          --x86-badging "$RUNNER_TEMP/lite-promotion/x86-badging.txt" \
          --x86-signature "$RUNNER_TEMP/lite-promotion/x86-signature.txt" \
          --output "$RUNNER_TEMP/lite-promotion/validated.json"
    - name: Preserve the separate build and release promotion receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: aerove-lite-product-promotion-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-promotion/promotion.json
        if-no-files-found: error
    - name: Render source-bound release notes
      run: |
        info="$RUNNER_TEMP/lite-promotion/arm/BUILD_INFO.json"
        tag=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("lite-v"+str(d["version"])+"+"+str(d["version_code"]))' "$info")
        python3 apps/aerove-lite/tool/lite_release.py previous-changelog \
          --output "$RUNNER_TEMP/lite-promotion/previous-changelog.md" --target-tag "$tag"
        python3 apps/aerove-lite/tool/lite_release_notes.py --tag "$tag" --build-info "$info" \
          --source-changelog docs/aerove-lite/CHANGELOG.md --acceptance-run "$ACCEPTANCE_RUN" \
          --acceptance-attempt "$ACCEPTANCE_ATTEMPT" \
          --previous-changelog "$RUNNER_TEMP/lite-promotion/previous-changelog.md" \
          --output "$RUNNER_TEMP/lite-promotion/notes.md"
    - name: Create or resume a matching draft, upload originals and read them back
      run: |
        python3 apps/aerove-lite/tool/lite_release.py publish \
          --directory "$RUNNER_TEMP/lite-promotion/arm" \
          --validated "$RUNNER_TEMP/lite-promotion/validated.json" \
          --notes "$RUNNER_TEMP/lite-promotion/notes.md" \
          --source "$GITHUB_SHA" --run "$ACCEPTANCE_RUN" --attempt "$ACCEPTANCE_ATTEMPT" \
          --number "$ACCEPTANCE_NUMBER" \
          --root "$GITHUB_WORKSPACE" --receipt "$RUNNER_TEMP/lite-promotion/promotion.json" \
          --release-run "$GITHUB_RUN_ID" --release-attempt "$GITHUB_RUN_ATTEMPT"
  build_arm:
    name: build (arm64-v8a)
    if: ${{ inputs.accepted_build_run == '' && (!inputs.publish_release || github.event_name != 'workflow_dispatch') && ((inputs.diagnostic_target == 'none' || (!inputs.diagnostic_target && github.event_name != 'workflow_dispatch')) && (!inputs.meow_host_only && (!inputs.qa84_only && (!inputs.qa79_only && (!inputs.client_preflight && (!inputs.native_preflight && !inputs.publish_release)))))) }}
