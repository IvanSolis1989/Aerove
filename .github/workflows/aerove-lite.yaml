      run: |
        mkdir -p app/build/reports
        gradle --no-daemon :app:tasks --all 2>&1 | tee app/build/reports/gradle-tasks.txt
    - name: Require both independent preflight results
      if: ${{ always() }}
      env:
        OWNER_FIXTURE_OUTCOME: ${{ steps.owner_fixture_checks.outcome }}
        KOTLIN_CHECKS_OUTCOME: ${{ steps.kotlin_checks.outcome }}
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        results = {key: os.environ.get(key, '') for key in ('OWNER_FIXTURE_OUTCOME', 'KOTLIN_CHECKS_OUTCOME')}
        receipt = dict(source=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID'], results=results,
                       appApkBuilt=False, acceptance=False)
        output = Path('apps/aerove-lite/app/build/reports/client-preflight-results.json')
        output.parent.mkdir(parents=True, exist_ok=True)
        output.write_text(json.dumps(receipt, indent=2) + '\n')
        assert all(value == 'success' for value in results.values()), results
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: AEROVE-Lite-Kotlin-verification
