name: Lite265 evidence inspection only (no build)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}

jobs:
  evidence_inspection:
    name: Lite265 evidence inspection only (no build)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'IvanSolis1989/Aerove' &&
      github.repository_owner == 'IvanSolis1989' &&
      github.actor == 'IvanSolis1989' &&
      github.ref == 'refs/heads/codex/lite265-evidence-readback'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: '42066278567'
      ORIGINAL_ATTEMPT: '1'
      ORIGINAL_SOURCE: '4190ff45f8eedc6734fa666e2658b71abf147479'
      ORIGINAL_BRANCH: 'codex/lite-shared-flutter-complete114'
      EXPECTED_TREE: '8ca6fb6bc19867e9302923ba9bea8d289972a8b6'
      FULL_JOB_ID: '127408997671'
      PREVIEW_JOB_ID: '127408997657'
      FULL_ARTIFACT_ID: '13437875787'
      FULL_ARTIFACT_NAME: 'AEROVE-Lite-current-acceptance-flutter-full-attempt-1'
      FULL_ARTIFACT_BYTES: '7889136'
      FULL_ARTIFACT_SHA256: 'd41f300267952441d65c7a41b606d7d48acba0e5e978272d2af54951f33429ca'
      ARM_ARTIFACT_ID: '13436109593'
      ARM_ARTIFACT_NAME: 'AEROVE-Lite-preview-arm64-attempt-1'
      ARM_ARTIFACT_BYTES: '47810677'
      ARM_ARTIFACT_SHA256: '4b8064c747418990d476badd5db6f801a91c3dd1d6acbe8ce903dca1f8d3cbc6'
    steps:
      - name: Checkout immutable failed source for identity binding
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4190ff45f8eedc6734fa666e2658b71abf147479
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Read exact original run artifacts and preserve a bounded failure report
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath, PureWindowsPath
          import re
          import subprocess
          import sys
          import zipfile

          repo = "IvanSolis1989/Aerove"
          run_id = int(os.environ["ORIGINAL_RUN"])
          attempt = int(os.environ["ORIGINAL_ATTEMPT"])
          source = os.environ["ORIGINAL_SOURCE"]
          expected_tree = os.environ["EXPECTED_TREE"]
          root = Path(os.environ["RUNNER_TEMP"]) / "lite265-readback"
          root.mkdir()
          report_path = root / "report.json"

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def gh_json(route):
              result = subprocess.run(["gh", "api", route], check=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      text=True, timeout=90)
              return json.loads(result.stdout)

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def gh_archive(artifact_id, destination):
              try:
                  with destination.open("wb") as output:
                      subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{artifact_id}/zip"],
                                     stdout=output, stderr=subprocess.PIPE, check=True, timeout=240)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                  destination.unlink(missing_ok=True)
                  raw = getattr(error, "stderr", b"") or b""
                  message = raw.decode(errors="replace") if isinstance(raw, bytes) else raw
                  message = re.sub(r"https?://[^\s\"']+", "<URL redacted>", message)
                  message = re.sub(r"(?i)(token|authorization|password|secret)=\S+", r"\1=<redacted>", message)
                  raise SystemExit(f"Artifact {artifact_id} download failed: {message[:1200]}") from None
              return destination

          def artifact_row(rows, artifact_id, name, size, sha256=None):
              found = [row for row in rows if row.get("id") == artifact_id]
              require(len(found) == 1, f"Expected one artifact ID {artifact_id}")
              row = found[0]
              require(row.get("name") == name and row.get("size_in_bytes") == size
                      and row.get("expired") is False
                      and row.get("workflow_run", {}).get("id") == run_id
                      and row.get("workflow_run", {}).get("head_sha") == source,
                      f"Artifact metadata identity mismatch for {artifact_id}")
              value = row.get("digest", "")
              require(re.fullmatch(r"sha256:[0-9a-f]{64}", value) is not None,
                      f"Artifact digest is missing or invalid for {artifact_id}")
              if sha256 is not None:
                  require(value == "sha256:" + sha256, f"Artifact digest mismatch for {artifact_id}")
              detail = gh_json(f"repos/{repo}/actions/artifacts/{artifact_id}")
              for key in ("id", "name", "size_in_bytes", "digest", "expired"):
                  require(detail.get(key) == row.get(key), f"Artifact detail/list mismatch for {artifact_id}")
              return row

          def safe_archive(row, label):
              path = root / f"{label}.zip"
              gh_archive(row["id"], path)
              actual_size = path.stat().st_size
              actual_hash = digest(path)
              require(actual_size == row["size_in_bytes"], f"Archive byte size mismatch for {label}")
              require("sha256:" + actual_hash == row["digest"], f"Archive digest mismatch for {label}")
              archive = zipfile.ZipFile(path)
              infos = archive.infolist()
              names = [item.filename for item in infos]
              require(names and len(names) == len(set(names)), f"Empty or duplicate archive paths in {label}")
              require(sum(item.file_size for item in infos) <= 512 * 1024 * 1024,
                      f"Uncompressed archive exceeds the bounded readback limit: {label}")
              for item in infos:
                  posix = PurePosixPath(item.filename)
                  windows = PureWindowsPath(item.filename)
                  mode = item.external_attr >> 16
                  require(not posix.is_absolute() and not windows.is_absolute() and not windows.drive
                          and ".." not in posix.parts and "\\" not in item.filename and posix.parts,
                          f"Unsafe archive path in {label}")
                  require(not (mode and (mode & 0o170000) == 0o120000)
                          and (not mode or (mode & 0o170000) in (0o100000, 0o040000)),
                          f"Non-regular archive entry in {label}")
              require(archive.testzip() is None, f"ZIP CRC failure in {label}")
              return path, archive, infos

          def sha_bytes(value):
              return hashlib.sha256(value).hexdigest()

          def redacted(text):
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              text = re.sub(r"https?://[^\s\"']+", "<URL redacted>", text)
              text = re.sub(r"(?i)\b(bearer|token|authorization|password|passwd|secret|api[_-]?key)\s*[:=]\s*[^\s,;]+",
                            r"\1=<redacted>", text)
              text = re.sub(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", "<IP redacted>", text)
              text = re.sub(r"\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b", "<MAC redacted>", text)
              text = re.sub(r"\bemulator-[0-9]+\b", "<device serial redacted>", text)
              text = re.sub(r"(?i)(serial(?:number)?\s*[:=]\s*)[^\s,;]+", r"\1<redacted>", text)
              return text

          run = gh_json(f"repos/{repo}/actions/runs/{run_id}")
          require(run.get("id") == run_id and run.get("run_attempt") == attempt
                  and run.get("head_sha") == source and run.get("head_branch") == os.environ["ORIGINAL_BRANCH"]
                  and run.get("path") == ".github/workflows/aerove-lite.yaml"
                  and run.get("status") == "completed" and run.get("conclusion") == "failure"
                  and run.get("repository", {}).get("full_name") == repo,
                  "Original failed run identity/state mismatch")
          local_source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          local_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          require(local_source == source and local_tree == expected_tree,
                  "Immutable checkout source/tree mismatch")

          jobs_payload = gh_json(f"repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100")
          jobs = jobs_payload.get("jobs")
          require(isinstance(jobs, list) and jobs_payload.get("total_count") == len(jobs),
                  "Job API response is incomplete")
          by_id = {job.get("id"): job for job in jobs}
          expected_jobs = {
              int(os.environ["FULL_JOB_ID"]): ("acceptance (Flutter UI and same-session native lifecycle)", "failure"),
              int(os.environ["PREVIEW_JOB_ID"]): ("Flutter production UI preview (representative only)", "failure"),
              127401476340: ("build (arm64-v8a) / package", "success"),
              127401036780: ("build (x86_64) / package", "success"),
              127396763516: ("build (arm64-v8a) / rust", "success"),
              127396763933: ("build (arm64-v8a) / helper", "success"),
              127396763976: ("build (x86_64) / rust", "success"),
              127396763696: ("build (x86_64) / helper", "success"),
          }
          job_report = []
          for job_id, (name, conclusion) in expected_jobs.items():
              job = by_id.get(job_id)
              require(job is not None and job.get("name") == name and job.get("run_id") == run_id
                      and job.get("run_attempt") == attempt and job.get("head_sha") == source
                      and job.get("status") == "completed" and job.get("conclusion") == conclusion,
                      f"Original job identity/conclusion mismatch: {job_id}")
              failed_steps = [{"name": step.get("name"), "conclusion": step.get("conclusion")}
                              for step in job.get("steps", []) if step.get("conclusion") == "failure"]
              job_report.append({"id": job_id, "name": name, "conclusion": conclusion,
                                 "failedSteps": failed_steps})

          artifacts_payload = gh_json(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")
          artifact_rows = artifacts_payload.get("artifacts")
          require(isinstance(artifact_rows, list) and artifacts_payload.get("total_count") == len(artifact_rows),
                  "Artifact API response is incomplete")
          full = artifact_row(artifact_rows, int(os.environ["FULL_ARTIFACT_ID"]),
                              os.environ["FULL_ARTIFACT_NAME"], int(os.environ["FULL_ARTIFACT_BYTES"]),
                              os.environ["FULL_ARTIFACT_SHA256"])
          arm = artifact_row(artifact_rows, int(os.environ["ARM_ARTIFACT_ID"]),
                             os.environ["ARM_ARTIFACT_NAME"], int(os.environ["ARM_ARTIFACT_BYTES"]),
                             os.environ["ARM_ARTIFACT_SHA256"])
          preview_name = "AEROVE-Lite-Flutter-UI-preview-attempt-1"
          preview_rows = [item for item in artifact_rows if item.get("name") == preview_name]
          require(len(preview_rows) == 1, "Expected one preview UI artifact row")
          require(preview_rows[0].get("id") == 13436893896, "Fixed original preview artifact ID differs")
          preview = artifact_row(artifact_rows, 13436893896, preview_name, 63540,
                                 "6505f200c37f7235541c1a7c4071688a0370dd7e9049748b316d9e2a2db6c537")

          arm_zip, arm_archive, arm_infos = safe_archive(arm, "arm64-producer")
          arm_files = {item.filename: item for item in arm_infos if not item.is_dir()}
          apk_name = "AEROVE-Lite-android-arm64.apk"
          require(set(arm_files) == {apk_name, "BUILD_INFO.json", "SHA256SUMS"},
                  "Unexpected ARM64 producer artifact contents")
          build_info = json.loads(arm_archive.read(arm_files["BUILD_INFO.json"]))
          apk_hash = sha_bytes(arm_archive.read(arm_files[apk_name]))
          checksum_lines = arm_archive.read(arm_files["SHA256SUMS"]).decode().splitlines()
          expected_checksums = {f"{apk_hash}  {apk_name}",
                                f"{sha_bytes(arm_archive.read(arm_files['BUILD_INFO.json']))}  BUILD_INFO.json"}
          require(set(checksum_lines) == expected_checksums and len(checksum_lines) == 2,
                  "ARM64 producer SHA256SUMS mismatch")
          require(build_info.get("product") == "AEROVE Lite" and build_info.get("channel") == "preview"
                  and build_info.get("application_id") == "dev.aerove.lite"
                  and build_info.get("abi") == "arm64-v8a" and build_info.get("min_sdk") == 33
                  and build_info.get("version_code") == 36 and build_info.get("source") == source
                  and build_info.get("tree") == expected_tree
                  and build_info.get("workflow") == f"https://github.com/{repo}/actions/runs/{run_id}"
                  and build_info.get("run_number") == run.get("run_number")
                  and build_info.get("run_attempt") == attempt and build_info.get("apk_sha256") == apk_hash,
                  "ARM64 BUILD_INFO does not bind the exact source/run/APK identity")
          signer = build_info.get("signer_sha256")
          require(signer == "09f9e021ddac36ead015d27e073b673e79fdf4e02605c402a505781963b1a4d8",
                  "ARM64 signer fingerprint does not match the fixed Lite identity")
          arm_archive.close()

          full_zip, full_archive, full_infos = safe_archive(full, "flutter-full")
          preview_zip, preview_archive, preview_infos = safe_archive(preview, "flutter-preview")
          evidence = []
          pngs = []
          receipts = []
          install_markers = []
          launch_markers = []
          emulator_exit_markers = []
          runner_markers = []
          meow = []
          screenshot_found = False

          def sanitized(value):
              if isinstance(value, dict):
                  return {key: ("<redacted>" if re.search(r"(?i)(password|passwd|secret|api[_-]?key|authorization|token|serial)", key)
                                else sanitized(child)) for key, child in value.items()}
              if isinstance(value, list):
                  return [sanitized(child) for child in value]
              return redacted(value) if isinstance(value, str) else value

          for label, archive, infos in (("flutter-full", full_archive, full_infos),
                                        ("flutter-preview", preview_archive, preview_infos)):
              for item in infos:
                  if item.is_dir():
                      continue
                  name = item.filename
                  lower = name.lower()
                  if label == "flutter-full" and name == "consentNavigationTheme12/failure.png":
                      raw = archive.read(item)
                      require(len(raw) == 14964 and sha_bytes(raw) == "d2d5d3c070d270fac37b01e132d61676d58a2b012a156246e8d95ade7082fbef",
                              "Original failure screenshot identity mismatch")
                      (root / "failure.png").write_bytes(raw)
                      screenshot_found = True
                      pngs.append({"artifact": label, "path": name, "bytes": len(raw), "sha256": sha_bytes(raw)})
                      continue
                  is_full_log = label == "flutter-full" and name == "final-logcat.out"
                  is_runner = label == "flutter-full" and name == "consentNavigationTheme12.out"
                  is_preview_stdout = label == "flutter-preview" and lower.endswith("emulator.stdout.log")
                  is_preview_stderr = label == "flutter-preview" and (lower.endswith((".stderr", ".err", ".stderr.log", ".stderr.txt")))
                  is_preview_json = label == "flutter-preview" and lower.endswith(("bootstrap.json", "emulator-owner.json"))
                  if not any((is_full_log, is_runner, is_preview_stdout, is_preview_stderr, is_preview_json)):
                      continue
                  require(item.file_size <= (24 * 1024 * 1024 if is_full_log else 2 * 1024 * 1024),
                          "Focused source file exceeds its bounded readback limit: " + name)
                  raw = archive.read(item)
                  text = raw.decode("utf-8", errors="replace")
                  entry = {"artifact": label, "path": name, "bytes": len(raw), "sha256": sha_bytes(raw)}
                  if is_preview_json:
                      entry["sanitizedPayload"] = sanitized(json.loads(text))
                      receipts.append(entry)
                      continue
                  lines = text.splitlines()
                  selected = set()
                  if is_full_log:
                      require(len(lines) >= 3950, "Original full log is shorter than the fixed crash window")
                      selected.update(range(3499, 3950))
                      timestamp = re.compile(r"^11-05 17:25:(?:[012][0-9]|30)\.")
                      relevant = re.compile(r"(?i)(surfaceflinger|screenshot|capture|graphic|vulkan|gfxstream|angle|flutter|meow|dev\.aerove|AndroidRuntime|DEBUG|libc|ActivityTaskManager|WindowManager|BufferQueue|RenderEngine|HWUI|(?:^|\s)[EF]\s)")
                      centers = [i for i, line in enumerate(lines) if timestamp.search(line) and relevant.search(line)]
                      for i in centers:
                          selected.update(range(max(0, i - 20), min(len(lines), i + 21)))
                      entry["selection"] = {"fixedCrashLines": [3500, 3950], "timedWindow": "11-05 17:25:00–17:25:30", "contextLines": 20, "timedMatchCount": len(centers)}
                  elif is_preview_stdout:
                      selected.update(range(max(0, len(lines) - 100), len(lines)))
                  else:
                      selected.update(range(len(lines)))
                  positions = sorted(selected)
                  ranges = []
                  for index in positions:
                      if not ranges or index + 1 > ranges[-1][1] + 1:
                          ranges.append([index + 1, index + 1])
                      else:
                          ranges[-1][1] = index + 1
                  entry["selectedLineRanges"] = ranges
                  entry["excerpt"] = [{"line": i + 1, "text": redacted(lines[i])} for i in positions
                                      if not re.search(r"(?i)(password|secret|api[_-]?key|authorization)", lines[i])]
                  entry["suppressedSensitiveLineCount"] = len(positions) - len(entry["excerpt"])
                  entry["totalLines"] = len(lines)
                  evidence.append(entry)
          require(screenshot_found, "Original failure screenshot not found")
          require(any(row["path"] == "final-logcat.out" for row in evidence), "Focused full log missing")
          require(any(row["path"].lower().endswith("emulator.stdout.log") for row in evidence), "Preview stdout missing")
          require(any(row["path"].lower().endswith("bootstrap.json") for row in receipts)
                  and any(row["path"].lower().endswith("emulator-owner.json") for row in receipts), "Preview owner/bootstrap JSON missing")
          require(sum(len(json.dumps(row)) for row in evidence + receipts) < 3 * 1024 * 1024,
                  "Focused evidence exceeds 3 MiB; no silent truncation allowed")
          report = {
              "role": "evidenceReadback", "accepted": False, "compiled": False,
              "appApkBuilt": False, "fullCiAccepted": False,
              "originalRun": {"id": run_id, "attempt": attempt, "source": source,
                              "tree": expected_tree, "branch": os.environ["ORIGINAL_BRANCH"],
                              "status": run.get("status"), "conclusion": run.get("conclusion")},
              "jobs": job_report,
              "arm64Producer": {"artifactId": arm["id"], "artifactBytes": arm["size_in_bytes"],
                                "artifactSha256": arm["digest"].removeprefix("sha256:"),
                                "apk": apk_name, "apkSha256": apk_hash,
                                "applicationId": build_info.get("application_id"),
                                "version": build_info.get("version"), "versionCode": build_info.get("version_code"),
                                "abi": build_info.get("abi"), "minSdk": build_info.get("min_sdk"),
                                "signerSha256": signer},
              "fullArtifact": {"id": full["id"], "name": full["name"], "bytes": full["size_in_bytes"],
                               "sha256": full["digest"].removeprefix("sha256:")},
              "previewArtifact": {"id": preview["id"], "name": preview["name"],
                                  "bytes": preview["size_in_bytes"],
                                  "sha256": preview["digest"].removeprefix("sha256:")},
              "actualInstallEvidence": install_markers[:80],
              "actualLaunchEvidence": launch_markers[:80],
              "pngs": pngs[:120],
              "ownedEmulatorExitEvidence": emulator_exit_markers[:80],
              "runnerFailureEvidence": runner_markers[:80],
              "meowFlutterDiagnostics": meow[:80],
              "receiptFacts": receipts[:100],
              "sourceFiles": evidence,
          }
          full_archive.close()
          preview_archive.close()
          report_path.write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          require(report_path.stat().st_size <= 4 * 1024 * 1024, "Focused report exceeds 4 MiB")
          print(f"Evidence readback report prepared ({report_path.stat().st_size} bytes); acceptance remains false.")
          PY

      - name: Upload bounded evidence report only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lite265-evidence-readback-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lite265-readback/report.json
            ${{ runner.temp }}/lite265-readback/failure.png
          if-no-files-found: error
          compression-level: 6
