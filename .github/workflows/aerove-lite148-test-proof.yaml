name: Lite148 frozen Test graph and keep proof (no APK producer)
run-name: Lite148 Test-only ${{ inputs.phase || 'registration' }} proof
on:
  push:
    branches: [codex/aerove-lite148-test-proof-34]
    paths: [.github/workflows/aerove-lite148-test-proof.yaml]
  workflow_dispatch:
    inputs:
      phase:
        description: graph first; keep-proof only after reviewing actual graph admission
        type: choice
        options: [graph, keep-proof, baseline-transport]
        default: graph
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: lite148-test-proof-${{ github.event_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
jobs:
  proof:
    if: github.repository == 'IvanSolis1989/Aerove' && github.ref == 'refs/heads/codex/aerove-lite148-test-proof-34' && github.event_name == 'workflow_dispatch' && inputs.phase != 'baseline-transport'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Reject unknown diagnostic phase before any setup
        env:
          PROOF_PHASE: ${{ inputs.phase }}
        run: |
          case "$PROOF_PHASE" in graph|keep-proof) ;; *) exit 2 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Freeze original App checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: af2d7d947678d690cff696746d9600b353bef731
          path: original
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze corrected Test checkout separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dbe285c3bc09448807d462246fbda77cde3d2a8b
          path: corrected-test
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - name: Prepare only the pinned compile SDK and build tools
        run: |
          timeout --kill-after=10s 300s sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.1/android.jar"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: 9.6.0
          cache-disabled: true
      - name: Bounded guarded graph or actual keep proof; never build any APK
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_PHASE: ${{ inputs.phase }}
          PROOF_ABI: ${{ matrix.abi }}
        run: |
          python3 .github/scripts/lite148_test_only_proof.py \
            --app-root "$GITHUB_WORKSPACE/original" --test-root "$GITHUB_WORKSPACE/corrected-test" \
            --output "$RUNNER_TEMP/lite148-test-proof-$PROOF_ABI" \
            --abi "$PROOF_ABI" --phase "$PROOF_PHASE"
      - name: Preserve rejection or proof without production acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lite148-test-proof-${{ matrix.abi }}-${{ inputs.phase }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lite148-test-proof-${{ matrix.abi }}/
          if-no-files-found: error
  baseline_transport:
    if: github.repository == 'IvanSolis1989/Aerove' && github.ref == 'refs/heads/codex/aerove-lite148-test-proof-34' && github.event_name == 'workflow_dispatch' && inputs.phase == 'baseline-transport'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: af2d7d947678d690cff696746d9600b353bef731
          path: original
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dbe285c3bc09448807d462246fbda77cde3d2a8b
          path: corrected-test
          persist-credentials: false
      - name: Baseline transport only; no toolchain setup or task actions
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_ABI: ${{ matrix.abi }}
        run: |
          timeout --signal=TERM --kill-after=5s 95s \
            python3 .github/scripts/lite148_test_only_proof.py \
            --app-root "$GITHUB_WORKSPACE/original" --test-root "$GITHUB_WORKSPACE/corrected-test" \
            --output "$RUNNER_TEMP/lite148-test-proof-$PROOF_ABI" \
            --abi "$PROOF_ABI" --phase baseline-transport
      - name: Preserve baseline request stages without acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lite148-baseline-transport-${{ matrix.abi }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lite148-test-proof-${{ matrix.abi }}/
          if-no-files-found: error
