name: AEROVE Meow bridge preflight
on:
  push:
    branches: [codex/aerove-meow-preflight]
    paths:
      - apps/aerove-lite/meow-native/**
      - .github/workflows/aerove-meow-preflight.yaml
  workflow_dispatch:
    inputs:
      phase:
        description: Explicit host-only proof or full host plus Android proof; fixed push runs all three legs
        type: choice
        options: [host, android]
        default: host
      initialize_lock:
        description: Explicit first bridge lock/source archive bootstrap when no bridge Cargo.lock exists
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: meow-preflight-${{ github.ref }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: '1.98.1'
  NDK_VERSION: '28.2.13676358'
defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      resolve: ${{ steps.plan.outputs.resolve }}
      android: ${{ steps.plan.outputs.android }}
      proof: ${{ steps.plan.outputs.proof }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: plan
        name: Admit explicit source and lock plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PHASE: ${{ inputs.phase }}
          INITIALIZE_LOCK: ${{ inputs.initialize_lock }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import sys
          sys.path.insert(0,'apps/aerove-lite/meow-native')
          from build_policy import decide_plan, load_policy
          root=Path('apps/aerove-lite/meow-native')
          policy=load_policy(root)
          plan=decide_plan((root/'Cargo.lock').is_file(),json.loads((root/'source.json').read_text())['archiveSha256'],
              os.environ['EVENT_NAME'],os.environ['REQUESTED_PHASE'],os.environ['INITIALIZE_LOCK']=='true',
              resolve_requested=bool(policy and policy['resolveLock']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key,value in plan.items():output.write(f'{key}={str(value).lower()}\n')
          print(json.dumps(plan,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Meow requested proof: '+plan['proof']+'; Android required: '+str(plan['android']).lower()+'\n')
          PY
  host:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/aerove-lite/meow-native -> target
          key: meow-host-1.98.1
          cache-on-failure: true
          cache-directories: apps/aerove-lite/meow-native/.upstream
      - name: Python source preparation and Android link policy checks
        run: |
          python3 apps/aerove-lite/meow-native/test_build.py
          python3 apps/aerove-lite/meow-native/test_core_tests.py
      - name: Record actual host C and CMake prerequisites
        run: |
          set -euo pipefail
          clang --version
          cmake --version
          ninja --version
          pkg-config --version
      - id: fresh
        name: Detect the explicit fresh producer replay entry
        run: |
          if [ -f apps/aerove/test/common/fresh_native_runtime_producer_fixture.dart ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: steps.fresh.outputs.enabled == 'true'
        with:
          go-version: '1.27.1'
          cache: false
      - uses: ./.github/actions/flutter
        if: steps.fresh.outputs.enabled == 'true'
        with:
          flutter-version: 3.47.6
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.fresh.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: steps.fresh.outputs.enabled == 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - name: Select the existing SDK for the JVM composer
        if: steps.fresh.outputs.enabled == 'true'
        run: |
          sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0' "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        if: steps.fresh.outputs.enabled == 'true'
        with:
          gradle-version: 9.6.0
      - name: Prepare the existing production helpers and Flutter hooks
        if: steps.fresh.outputs.enabled == 'true'
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/meow-fresh-runtime"
          test ! -e "$root"
          mkdir -p "$root/prerequisites"
          python3 apps/aerove-lite/tool/ci_artifacts.py host-helper \
            --go "$(go env GOROOT)/bin/go" \
            --directory "$root/helper-staging" --destination "$root/helper" \
            --receipt "$root/prerequisites/helper.json"
          (cd packages/aerove_client && flutter pub get --enforce-lockfile)
          (cd apps/aerove && flutter pub get --enforce-lockfile)
          (cd apps/aerove-lite && flutter pub get --enforce-lockfile)
          (cd apps/aerove && python3 tool/mihomo_source.py prepare)
      - name: Export actual fresh producer input and compose its runtime plan
        if: steps.fresh.outputs.enabled == 'true'
        timeout-minutes: 15
        env:
          AEROVE_FILTER_HELPER: ${{ runner.temp }}/meow-fresh-runtime/helper/hostverify
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/meow-fresh-runtime"
          fixture="$root/fixture"
          mkdir -p "$fixture"
          (
            cd apps/aerove
            flutter test --no-pub --concurrency 1 --dart-define=AEROVE_TEST_SUITE_PRODUCT=true \
              --dart-define="FRESH_RUNTIME_SOURCE=$GITHUB_SHA" --dart-define="FRESH_RUNTIME_OUTPUT=$fixture" \
              test/common/fresh_native_runtime_producer_fixture.dart \
              --plain-name 'fresh default no-selection runtime export'
          ) 2>&1 | tee "$root/producer.log"
          test -s "$fixture/producer-manifest.json"
          (
            cd apps/aerove-lite
            gradle --no-daemon -p android -Ptarget-platform=android-x64 -PliteAbi=x86_64 \
              -PsourceSha="$GITHUB_SHA" -DfreshRuntime.fixture="$fixture" :app:prepareFreshRuntimeReplayFixture
          ) 2>&1 | tee "$root/composer.log"
          test -s "$fixture/native/final-plan-manifest.json"
      - name: Load the actual fresh plan through the locked Native owner
        if: steps.fresh.outputs.enabled == 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root = Path('apps/aerove-lite/meow-native').resolve()
          sys.path.insert(0, str(root))
          from prepare import prepare
          from build_policy import load_policy
          from clang_probe import probe
          from core_tests import run_logged
          output = Path(os.environ['RUNNER_TEMP']) / 'meow-fresh-runtime'
          policy = load_policy(root)
          upstream = prepare()
          lock = root / 'Cargo.lock'
          before = hashlib.sha256(lock.read_bytes()).hexdigest()
          assert before == policy['expectedLockBeforeSha256'] and not policy['resolveLock']
          environment = dict(os.environ, CARGO_TARGET_DIR=str(root / 'target'), RUSTUP_TOOLCHAIN='1.98.1',
              AEROVE_FRESH_FIXTURE_SOURCE=os.environ['GITHUB_SHA'],
              AEROVE_FRESH_PLAN_FIXTURE=str(output / 'fixture/native/final-plan-manifest.json'))
          clang = probe(root / 'build/libclang-probe.json', environment)
          environment['LIBCLANG_PATH'] = clang['library']['path']
          version = subprocess.check_output(['rustc', '--version'], env=environment, text=True).strip()
          assert version.startswith('rustc 1.98.1 '), version
          command = ['cargo', 'test', '--locked', '--features', 'fresh-producer-replay', '--lib',
              'owned_runtime::fresh_shared_producer_replay::fresh_shared_producer_owned_loader',
              '--', '--exact', '--test-threads=1', '--nocapture']
          result = run_logged(command, root, environment, output / 'native.stdout.log', output / 'native.stderr.log', timeout=900)
          after = hashlib.sha256(lock.read_bytes()).hexdigest()
          receipt = dict(source=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID'],
              attempt=os.environ['GITHUB_RUN_ATTEMPT'], command=command, commandExit=result.returncode,
              lockBefore=before, lockAfter=after, lockUnchanged=before == after,
              toolchain=version, sourceProvenance=json.loads((upstream / 'AEROVE_SOURCE_PROVENANCE.json').read_text()),
              appApkBuilt=False, androidExecuted=False, original312Input=False, acceptance=False)
          (output / 'native-command.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert result.returncode == 0 and before == after, receipt
          native = json.loads((output / 'fixture/native/native-result.json').read_text())
          assert native['nativeReady'] and native['nativeJoined'] and native['controlPortReleased'], 'Native replay lacks its ready/join/port receipt'
          assert native['accepted'] is False and native['original312Input'] is False
          PY
      - name: Real locked host proxy lifecycle chain
        env:
          INITIALIZE_LOCK: ${{ needs.plan.outputs.bootstrap }}
          REQUESTED_PROOF: ${{ needs.plan.outputs.proof }}
          RESOLVE_LOCK: ${{ needs.plan.outputs.resolve }}
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/meow-host-command.log"
          import json, os, subprocess
          from pathlib import Path
          root=Path('apps/aerove-lite/meow-native')
          initial=os.environ['INITIALIZE_LOCK']=='true'
          command=['python3',str(root/'build.py')]
          if initial:command.append('--initialize-lock')
          if os.environ['RESOLVE_LOCK']=='true':command.append('--resolve-lock')
          try:
              subprocess.run(command,check=True)
          finally:
              receipt=root/'build/host-receipt.json'
              if receipt.is_file():
                  result=json.loads(receipt.read_text())
                  result['requestedProof']=os.environ['REQUESTED_PROOF']
                  result['proofScope']='host-only result; full Android acceptance requires aggregate verify'
                  receipt.write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Preserve actual source, lock and host terminal result
        if: always()
        run: |
          set -euo pipefail
          root=apps/aerove-lite/meow-native
          evidence="$RUNNER_TEMP/meow-host-evidence"
          mkdir -p "$evidence"
          cp "$root/source.json" "$root/Cargo.toml" "$root/rust-toolchain.toml" "$evidence/"
          for file in Cargo.lock build-policy.json build/host-receipt.json build/libclang-probe.json build/lock-before-resolution.lock build/metadata.stdout.json build/metadata.stderr.log .upstream/meow-rs/AEROVE_SOURCE_PROVENANCE.json; do
            if [ -f "$root/$file" ]; then cp "$root/$file" "$evidence/"; fi
          done
          if [ -f "$RUNNER_TEMP/meow-host-command.log" ]; then cp "$RUNNER_TEMP/meow-host-command.log" "$evidence/"; fi
          if [ -d "$RUNNER_TEMP/meow-fresh-runtime" ]; then cp -a "$RUNNER_TEMP/meow-fresh-runtime" "$evidence/fresh-runtime"; fi
          python3 - "$root" "$evidence" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          source_root=Path(sys.argv[1]);root=Path(sys.argv[2]);provenance=root/'AEROVE_SOURCE_PROVENANCE.json'
          sys.path.insert(0,str(source_root))
          from build_policy import copy_policy_evidence
          copy_policy_evidence(source_root,root)
          core_tests=source_root/'build/core-tests'
          if core_tests.is_dir():
              shutil.copytree(core_tests,root/'core-tests')
          if provenance.exists():
              source=json.loads((root/'source.json').read_text())
              source['archiveSha256']=json.loads(provenance.read_text())['archiveSha256']
              (root/'source.resolved.json').write_text(json.dumps(source,indent=2)+'\n')
          rows=[dict(path=p.relative_to(root).as_posix(),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(root.rglob('*')) if p.is_file()]
          (root/'evidence-files.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Meow-host-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meow-host-evidence/
          if-no-files-found: error
  android:
    if: ${{ needs.plan.outputs.android == 'true' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - run: sdkmanager "ndk;$NDK_VERSION" 'cmake;3.22.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/aerove-lite/meow-native -> target
          key: meow-${{ matrix.target }}-1.98.1-ndk28.2
          cache-directories: apps/aerove-lite/meow-native/.upstream
      - name: Link the real locked bridge for this Android ABI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export CMAKE="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"
          export PATH="$ANDROID_SDK_ROOT/cmake/3.22.1/bin:$PATH"
          python3 apps/aerove-lite/meow-native/build.py --target "$TARGET" --ndk "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" 2>&1 | tee "$RUNNER_TEMP/meow-android-link.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Meow-link-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: |
            apps/aerove-lite/meow-native/build/
            apps/aerove-lite/meow-native/Cargo.lock
            ${{ runner.temp }}/meow-android-link.log
          if-no-files-found: warn
  verify:
    if: always()
    needs: [plan, host, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate only the explicitly planned proof
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HOST_RESULT: ${{ needs.host.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_REQUIRED: ${{ needs.plan.outputs.android }}
          PROOF: ${{ needs.plan.outputs.proof }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$HOST_RESULT" = success
          case "$PROOF:$ANDROID_REQUIRED:$ANDROID_RESULT" in
            host-android:true:success) ;;
            bootstrap-host-only:false:skipped|host-only:false:skipped|resolve-host-only:false:skipped) ;;
            *) echo 'Planned Meow proof failed or has an unexpected skipped leg' >&2; exit 1 ;;
          esac
          printf 'Accepted Meow preflight proof: %s\n' "$PROOF" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ANDROID_REQUIRED" != true ]; then
            echo 'Host-only proof: no Android ABI/link/16KiB acceptance from this run.' >> "$GITHUB_STEP_SUMMARY"
          fi
