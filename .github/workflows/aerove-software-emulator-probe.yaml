name: AEROVE AOSP synthetic functional diagnosis (not acceptance)
'on':
  push:
    branches: [test/software-emulator-boot-probe]
    paths:
      - .github/workflows/aerove-software-emulator-probe.yaml
      - apps/aerove-lite/tool/software_emulator_boot_probe.py
      - apps/aerove-lite/tool/software_functional_probe.py
permissions:
  contents: read
  actions: read
concurrency:
  group: software-emulator-boot-probe
  cancel-in-progress: false
jobs:
  boot-probe:
    if: github.repository == 'IvanSolis1989/Aerove' && github.ref == 'refs/heads/test/software-emulator-boot-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check repository workspace layout
        run: python3 tooling/workspace.py check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
      - name: Install debugger and emulator runtime libraries
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gdb libpulse0
      - name: Prepare isolated API 33 software-only emulator
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'system-images;android-33;default;x86_64' 'platforms;android-37.1' 'build-tools;37.0.0'
          echo no | avdmanager create avd --force -n tcg_probe --package 'system-images;android-33;default;x86_64' --device pixel_6
          archive="$RUNNER_TEMP/emulator-linux_x64-13823996.zip"
          curl --fail --location --silent --show-error --connect-timeout 20 --max-time 240 \
            https://dl.google.com/android/repository/emulator-linux_x64-13823996.zip -o "$archive"
          printf '%s  %s\n' 5a580b0169e3fd26c99a67b86720f367f78828b1733d748cbe566e001b517024 "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/tcg-sdk"
          unzip -q "$archive" -d "$RUNNER_TEMP/tcg-sdk"
          if test -e "$ANDROID_HOME/emulator"; then
            mv "$ANDROID_HOME/emulator" "$RUNNER_TEMP/original-sdk-emulator"
          fi
          mv "$RUNNER_TEMP/tcg-sdk/emulator" "$ANDROID_HOME/emulator"
          "$ANDROID_HOME/emulator/emulator" -no-window -version | tee "$RUNNER_TEMP/pinned-emulator-version.txt"
          grep -F "36.1.9" "$RUNNER_TEMP/pinned-emulator-version.txt"
          "$ANDROID_HOME/emulator/emulator" -help-gpu
      - name: Fetch and verify immutable original 368 APK
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import os,sys; from pathlib import Path; sys.path.insert(0,'apps/aerove-lite/tool'); from lite368_diagnostic import verified_fetch; verified_fetch(Path(os.environ['RUNNER_TEMP'])/'software-original368')"
      - name: Diagnose original APK synthetic functions without KVM
        # Software CPU consent/readback alone took 25 minutes in run 42985922542.
        timeout-minutes: 75
        env:
          AEROVE_SOFTWARE_APK_RUNTIME: ${{ runner.temp }}/software-original368
        run: python3 apps/aerove-lite/tool/software_emulator_boot_probe.py
      - name: Preserve software probe evidence, never acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: software-cpu-boot-probe
          path: ${{ runner.temp }}/software-emulator-probe/
          if-no-files-found: warn

