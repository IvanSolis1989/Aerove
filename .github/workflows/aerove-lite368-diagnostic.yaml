name: 'AEROVE Lite #368 fixed-APK diagnostics'
'on':
  push:
    branches:
    - test/368-same-apk-diagnostics
    paths:
    - .github/workflows/aerove-lite368-diagnostic.yaml
    - apps/aerove-lite/tool/lite368_diagnostic.py
    - apps/aerove-lite/tool/test_lite368_diagnostic.py
    - apps/aerove-lite/tool/emulator_current.py
    - apps/aerove-lite/tool/test_emulator_current.py
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: lite368-fixed-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ github.repository == 'IvanSolis1989/Aerove' && github.ref == 'refs/heads/test/368-same-apk-diagnostics' && (github.event_name
      == 'push' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        phase:
        - flutter-ui
        - flutter-platform
        - flutter-full
    name: 'Fixed #368 fault capture (${{ matrix.phase }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ANDROID_SERIAL: emulator-5554
      AEROVE_GUEST_ANGLE: '1'
      AEROVE_LITE368_DIAGNOSTIC: '1'
      AEROVE_LITE368_BOOT_CRASH: '1'
      AEROVE_CLEAR_FRAME_TRACE: '1'
      AEROVE_GLASS_CONSUMER_RECEIPT: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Verify fixed identity and ordinary acceptance guards
      working-directory: apps/aerove-lite/tool
      run: env -u AEROVE_LITE368_DIAGNOSTIC -u AEROVE_LITE368_BOOT_CRASH -u AEROVE_GUEST_ANGLE -u ANDROID_SERIAL python3 -B
        -m unittest test_lite368_diagnostic test_emulator_current test_ci_artifacts test_prebuilt_android_runtime test_android_acceptance
        test_flutter_android_qa
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Verify the owned host fault collector before SDK execution
      timeout-minutes: 8
      working-directory: apps/aerove-lite/tool
      env:
        AEROVE_TEST_SIGILL_GDB: '1'
      run: |
        set -euo pipefail
        ulimit -c 0
        if ! command -v gdb >/dev/null 2>&1; then
          sudo -n env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=10s 90s \
            apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 update
          sudo -n env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=10s 150s \
            apt-get -o DPkg::Lock::Timeout=30 -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            install --yes --no-install-recommends gdb
        fi
        command -v gdb
        timeout --signal=TERM --kill-after=5s 10s \
          sudo -n -- gdb -nx -nh --batch -ex 'show version' -ex quit
        timeout --signal=TERM --kill-after=10s 90s \
          env -u AEROVE_LITE368_DIAGNOSTIC -u AEROVE_LITE368_BOOT_CRASH -u AEROVE_GUEST_ANGLE -u ANDROID_SERIAL python3 -B -m unittest -v test_emulator_current.SigillCaptureHostTests
    - name: Prepare pinned APK signature verifier and independent owner fixture compiler
      run: sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0'
    - name: Fetch exact prebuilt x86 runtime
      run: python3 apps/aerove-lite/tool/lite368_diagnostic.py fetch --directory "$RUNNER_TEMP/lite-runtime-input"
    - name: Checkout the immutable Smart fixture sources
      if: ${{ matrix.phase == 'flutter-platform' }}
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: IvanSolis1989/Smart-Config-Kit
        ref: 5e28b84fa5161c67222b1b12f71732a2e7b80fae
        path: .ci-fixture-sources/smart-config
        persist-credentials: false
        fetch-depth: 1
        sparse-checkout: "Meow\u5185\u6838\u7CFB\nrulesets/generated/fused\ntools/lib\n"
    - name: Prepare and read back the pinned Smart Android fixture
      if: ${{ matrix.phase == 'flutter-platform' }}
      timeout-minutes: 5
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        python3 apps/aerove-lite/tool/prepare_smart_config_meow_ci_fixture.py prepare \
          --smart-repository "$GITHUB_WORKSPACE/.ci-fixture-sources/smart-config" \
          --app-repository "$GITHUB_WORKSPACE" \
          --geo-cache "$RUNNER_TEMP/lite-smart-geodata" --download \
          --output "$RUNNER_TEMP/lite-smart-config-meow" \
          --receipt "$RUNNER_TEMP/lite-diagnostics/flutter-platform/smart-fixture-source.json"
        echo "SMART_CONFIG_MEOW_FIXTURE_DIR=$RUNNER_TEMP/lite-smart-config-meow" >> "$GITHUB_ENV"
        echo "SMART_CONFIG_MEOW_FIXTURE_RECEIPT=$RUNNER_TEMP/lite-diagnostics/flutter-platform/smart-fixture-source.json" >> "$GITHUB_ENV"
    - name: Existing API33 emulator environment with unchanged configuration
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        sdk_install_dir="$RUNNER_TEMP/lite-diagnostics/sdk-install"
        mkdir -p "$sdk_install_dir"
        for sdk_attempt in 1 2; do
          sdk_install_log="$sdk_install_dir/attempt-${sdk_attempt}.log"
          set +e
          timeout --signal=TERM --kill-after=10s 180s sdkmanager --install 'build-tools;37.0.0' 'system-images;android-33;google_apis;x86_64' --channel=0 2>&1 | tee "$sdk_install_log"
          sdk_install_status=("${PIPESTATUS[@]}")
          set -e
          sdkmanager_rc="${sdk_install_status[0]}"
          tee_rc="${sdk_install_status[1]}"
          printf 'sdkmanager_exit=%s\ntee_exit=%s\n' "$sdkmanager_rc" "$tee_rc" > "$sdk_install_dir/attempt-${sdk_attempt}.status.txt"
          if (( tee_rc != 0 )); then
            printf 'SDK install log tee failed (exit %s)\n' "$tee_rc" >&2
            exit "$tee_rc"
          fi
          if (( sdkmanager_rc == 0 )); then
            break
          fi
          if (( sdkmanager_rc == 124 || sdkmanager_rc == 137 )); then
            exit "$sdkmanager_rc"
          fi
          if (( sdk_attempt == 1 )) &&
              grep -Eiq 'Failed to download package archive for (emulator|system-images/android-33/google_apis/x86_64): (closed|.*connection reset|.*read (timed out|timeout)|.*EOF(Exception)?|.*unexpected end of (file|stream))([[:space:]:.]|$)' "$sdk_install_log" &&
              ! grep -Eiq 'LicenseNotAccepted|license.*(not accepted|not been accepted)|no space left on device|insufficient.*(space|storage)|not enough.*space|failed to find package|unknown package|package .*not (found|available)|UnsupportedClassVersionError|requires? (Java|JDK)' "$sdk_install_log"; then
            printf 'Retrying emulator SDK install once after a diagnosed archive transport interruption\n' >&2
            continue
          fi
          exit "$sdkmanager_rc"
        done
        mkdir -p "$RUNNER_TEMP/lite-diagnostics/${{ matrix.phase }}"
        { id; stat -c 'mode=%a owner=%U group=%G type=%F' /dev/kvm; } > "$RUNNER_TEMP/lite-diagnostics/${{ matrix.phase }}/kvm-access.txt"
        if ! test -c /dev/kvm || ! test -r /dev/kvm || ! test -w /dev/kvm; then
          echo 'Existing /dev/kvm read/write access required; diagnosis does not change device permissions or fall back to software.' >&2
          exit 1
        fi
        echo no | avdmanager create avd --force -n test --package 'system-images;android-33;google_apis;x86_64' --device pixel_6
        avd_directory="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
        sed -i '/^[[:space:]]*disk\.dataPartition\.size[[:space:]]*=/d' "$avd_directory/test.avd/config.ini"
        printf 'hw.cpu.ncore=2\ndisk.dataPartition.size=4G\n' >> "$avd_directory/test.avd/config.ini"
        cp "$avd_directory/test.avd/config.ini" "$RUNNER_TEMP/lite-diagnostics/${{ matrix.phase }}/avd-config.ini"
        emulator_archive_url='https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip'
        emulator_archive_sha256='cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd'
        emulator_stage="$(mktemp -d "$RUNNER_TEMP/lite-emulator-16740729.XXXXXX")"
        emulator_archive="$emulator_stage/emulator-linux_x64-16740729.zip"
        printf 'url=%s\nsize=349658551\nsha256=%s\n' "$emulator_archive_url" "$emulator_archive_sha256" > "$sdk_install_dir/pinned-emulator-archive.txt"
        curl --fail --location --silent --show-error --connect-timeout 20 --max-time 240 \
          --output "$emulator_archive" "$emulator_archive_url" \
          2> "$sdk_install_dir/pinned-emulator-download.stderr.txt"
        test "$(stat -c '%s' "$emulator_archive")" = '349658551'
        printf '%s  %s\n' "$emulator_archive_sha256" "$emulator_archive" | sha256sum --check --strict > "$sdk_install_dir/pinned-emulator-sha256.txt"
        unzip -q "$emulator_archive" -d "$emulator_stage/extracted"
        test -x "$emulator_stage/extracted/emulator/emulator"
        test -f "$emulator_stage/extracted/emulator/source.properties"
        cp "$emulator_stage/extracted/emulator/source.properties" "$sdk_install_dir/pinned-emulator-source.properties"
        if test -e "$ANDROID_HOME/emulator"; then
          mv "$ANDROID_HOME/emulator" "$emulator_stage/previous-emulator"
        fi
        mv "$emulator_stage/extracted/emulator" "$ANDROID_HOME/emulator"
        "$ANDROID_HOME/emulator/emulator" -no-window -version > "$RUNNER_TEMP/lite-diagnostics/${{ matrix.phase }}/emulator-version.txt" 2>&1
        grep -E '37\.2\.13\.0.*16740729' "$RUNNER_TEMP/lite-diagnostics/${{ matrix.phase }}/emulator-version.txt"
    - name: Real API 33 ${{ matrix.phase }} verification
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        python3 apps/aerove-lite/tool/emulator_current.py ${{ matrix.phase }} --runtime-directory "$RUNNER_TEMP/lite-runtime-input"
    - name: Preserve diagnostic evidence and both identities, never acceptance
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Lite368-diagnostic-${{ matrix.phase }}-attempt-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/lite-diagnostics/
          ${{ runner.temp }}/lite-runtime-input.api.json
          ${{ runner.temp }}/lite-runtime-input.fetch.json
        if-no-files-found: error
