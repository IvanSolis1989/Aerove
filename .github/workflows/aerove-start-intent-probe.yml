name: AEROVE stop cancels stale route start
on:
  push:
    branches: [dot/aerove-cancel-stale-route-start-20261128]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 6
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/flutter
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          cache-read-only: true
      - name: Prepare client-only dependencies, without native app packaging
        id: prepare
        run: |
          sed -i 's/build_assets: true/build_assets: false/g' apps/aerove/pubspec.yaml packages/aerove_client/pubspec.yaml
          (cd packages/aerove_client && flutter pub get)
          (cd apps/aerove && flutter pub get)
          (cd packages/aerove_client && dart run intl_utils:generate)
          (cd packages/aerove_client && dart run build_runner build --delete-conflicting-outputs)
      - uses: ./.github/actions/aerove-test-font
        id: fixture_font
        with:
          system-fonts: 'false'
      - name: Reproduce both failures on their exact previous sources
        working-directory: apps/aerove
        run: |
          source=packages/aerove_client/lib/providers/actions/setup.dart
          target="../../$source"
          fixed="$RUNNER_TEMP/aerove-fixed-setup.dart"
          report="$RUNNER_TEMP/aerove-stop-before.jsonl"
          cp "$target" "$fixed"
          trap 'cp "$fixed" "$target"' EXIT
          verify_old() {
            local base="$1" name="$2" reason="$3"
            git show "$base:$source" > "$target"
            if flutter test --no-pub --machine test/providers/setup_action_test.dart \
                --name "$name\$" > "$report" 2>&1; then
              cat "$report"
              return 1
            fi
            python3 - "$report" "$name" "$reason" <<'PY'
          import json
          import sys
          from pathlib import Path

          report, name, reason = sys.argv[1:]
          events = []
          for line in Path(report).read_text().splitlines():
              try:
                  value = json.loads(line)
              except ValueError:
                  print(line)
                  continue
              if isinstance(value, dict):
                  events.append(value)
          ids = {e["test"]["id"] for e in events if e.get("type") == "testStart"
                 and e["test"]["name"].endswith(name)}
          assert len(ids) == 1, events
          assert any(e.get("type") == "error" and e.get("testID") in ids
                     and reason in e.get("error", "") for e in events), events
          assert any(e.get("type") == "testDone" and e.get("testID") in ids
                     and e.get("result") in {"failure", "error"} for e in events), events
          print(f"Previous source reproduced: {reason}.")
          PY
          }
          verify_old 4f2d7097896887c9b0e149683830d071d19ee55f \
            'stop does not wait for new VPN routes' 'stop waited for new VPN routes'
          verify_old b01d521857f1778a4db071dd7151a59bdb9940ee \
            'stop supersedes a start waiting for VPN routes' 'stop remained behind stale start'
      - name: Standard lifecycle regressions
        working-directory: apps/aerove
        run: |
          flutter test --no-pub --concurrency 1 test/providers/setup_action_test.dart test/providers/action_test.dart test/core/controller_test.dart
      - name: Dashboard pending start interaction
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.fixture_font.outcome == 'success' }}
        working-directory: apps/aerove
        run: |
          flutter test --no-pub --concurrency 1 test/views/dashboard/current_outbound_test.dart
      - name: Lite startup and recovery regressions
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.fixture_font.outcome == 'success' }}
        working-directory: apps/aerove
        run: |
          flutter test --no-pub --concurrency 1 --dart-define=AEROVE_TEST_SUITE_PRODUCT=true test/providers/meow_proxy_recovery_test.dart test/core/meow_test.dart
