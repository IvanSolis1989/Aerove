    steps:
      - name: Validate one fixed Lite265 part and emit bounded log transport
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath, PureWindowsPath
          import re
          import subprocess
          import zipfile
          import zlib

          repo = "IvanSolis1989/Aerove"
          original_run = int(os.environ["ORIGINAL_RUN"])
          transfer_run = int(os.environ["TRANSFER_RUN"])
          batch_run = int(os.environ["BATCH_RUN_ID"])
          index = int(os.environ["PART_INDEX"])
          payload_length = int(os.environ["PART_LENGTH"])
          artifact_id = int(os.environ["PART_ARTIFACT_ID"])
          temp = Path(os.environ["RUNNER_TEMP"])
          zip_path = temp / f"lite265-part-{index:02d}.zip"

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def api(route):
              try:
                  result = subprocess.run(["gh", "api", route], stdout=subprocess.PIPE,
                                          stderr=subprocess.PIPE, timeout=45, check=False)
              except subprocess.TimeoutExpired:
                  raise SystemExit("GitHub API request timed out") from None
              require(result.returncode == 0, "GitHub API request failed")
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  raise SystemExit("GitHub API response was not valid JSON") from None

          original = api(f"repos/{repo}/actions/runs/{original_run}")
          require(original.get("id") == original_run and original.get("run_attempt") == 1
                  and original.get("head_sha") == os.environ["ORIGINAL_SOURCE"]
                  and original.get("head_branch") == "codex/lite-shared-flutter-complete114"
                  and original.get("status") == "completed" and original.get("conclusion") == "failure"
                  and original.get("repository", {}).get("full_name") == repo
                  and original.get("path") == ".github/workflows/aerove-lite.yaml",
                  "Original Lite265 producer identity mismatch")
          transfer = api(f"repos/{repo}/actions/runs/{transfer_run}")
          require(transfer.get("id") == transfer_run and transfer.get("run_attempt") == 1
                  and transfer.get("head_sha") == os.environ["TRANSFER_SOURCE"]
                  and transfer.get("head_branch") == os.environ["ORIGINAL_TRANSFER_BRANCH"]
                  and transfer.get("status") == "completed" and transfer.get("conclusion") == "success"
                  and transfer.get("repository", {}).get("full_name") == repo
                  and transfer.get("path") == ".github/workflows/xclash-android.yaml",
                  "Original Lite265 byte-transfer producer run identity mismatch")
          require(os.environ["BATCH_BRANCH"] == "codex/lite265-log-transfer"
                  and batch_run > 0 and re.fullmatch(r"[0-9a-f]{40}", os.environ["BATCH_SOURCE"]),
                  "Batch transfer dispatch identity malformed")
          listing = api(f"repos/{repo}/actions/runs/{transfer_run}/artifacts?per_page=100")
          rows = listing.get("artifacts")
          require(isinstance(rows, list) and listing.get("total_count") == len(rows) and len(rows) <= 65,
                  "Original transfer artifact listing is incomplete or over limit")
          require(len({row.get("name") for row in rows}) == len(rows), "Duplicate transfer artifact names")
          found = [row for row in rows if row.get("id") == artifact_id]
          require(len(found) == 1, f"Slice artifact ID mismatch for index {index}")
          row = found[0]
          expected = {"name": os.environ["PART_ARTIFACT_NAME"],
                      "size_in_bytes": int(os.environ["PART_ARTIFACT_BYTES"]),
                      "digest": "sha256:" + os.environ["PART_ARTIFACT_SHA256"]}
          for key, value in expected.items():
              require(row.get(key) == value, f"Slice artifact API {key} mismatch at index {index}")
          require(row.get("expired") is False and row.get("workflow_run", {}).get("id") == transfer_run
                  and row.get("workflow_run", {}).get("head_sha") == os.environ["TRANSFER_SOURCE"],
                  f"Slice artifact source/expiry mismatch at index {index}")
          detail = api(f"repos/{repo}/actions/artifacts/{artifact_id}")
          for key, value in expected.items():
              require(detail.get(key) == value, f"Slice artifact detail {key} mismatch")
          try:
              with zip_path.open("wb") as output:
                  downloaded = subprocess.run(
                      ["gh", "api", f"repos/{repo}/actions/artifacts/{artifact_id}/zip"],
                      stdout=output, stderr=subprocess.PIPE, timeout=90, check=False)
          except subprocess.TimeoutExpired:
              raise SystemExit(f"Slice {index} transport timed out") from None
          require(downloaded.returncode == 0, f"Slice {index} transport failed (exit {downloaded.returncode})")
          archive_bytes = zip_path.read_bytes()
          archive_sha = hashlib.sha256(archive_bytes).hexdigest()
          require(len(archive_bytes) == expected["size_in_bytes"]
                  and archive_sha == os.environ["PART_ARTIFACT_SHA256"],
                  f"Slice {index} ZIP size/digest mismatch")
          with zipfile.ZipFile(zip_path) as archive:
              infos = archive.infolist()
              require(len(infos) == 1 and infos[0].filename == os.environ["PART_FILE_NAME"]
                      and not infos[0].is_dir() and infos[0].file_size == payload_length,
                      f"Slice {index} ZIP file set/size mismatch")
              info = infos[0]
              path = PurePosixPath(info.filename)
              win = PureWindowsPath(info.filename)
              mode = info.external_attr >> 16
              kind = mode & 0o170000
              require(not path.is_absolute() and not win.is_absolute() and not win.drive
                      and ".." not in path.parts and "\\" not in info.filename
                      and kind != 0o120000 and (not mode or kind == 0o100000),
                      f"Slice {index} ZIP path/type is unsafe")
              require(archive.testzip() is None, f"Slice {index} ZIP CRC failure")
              payload = archive.read(info)
          payload_sha = hashlib.sha256(payload).hexdigest()
          require(len(payload) == payload_length and payload_sha == os.environ["PART_PAYLOAD_SHA256"],
                  f"Slice {index} payload size/hash mismatch")
          compressed = zlib.compress(payload, level=9)
          compressed_sha = hashlib.sha256(compressed).hexdigest()
          encoded = base64.b64encode(compressed).decode("ascii")
          line_capacity = 16 * 1024 - 16
          chunks = [encoded[pos:pos + line_capacity] for pos in range(0, len(encoded), line_capacity)]
          lines = [f"{sequence:04d}/{len(chunks):04d}:{chunk}"
                   for sequence, chunk in enumerate(chunks, start=1)]
          require(chunks and all(len(line.encode("ascii")) <= 16 * 1024 for line in lines),
                  "Encoded slice line exceeds the 16 KiB bound")
          header = {
              "role": "byteTransferOnly", "accepted": False, "compiled": False,
              "appApkBuilt": False, "fullCiAccepted": False, "published": False,
              "original": {"runId": original_run, "runAttempt": 1,
                           "source": os.environ["ORIGINAL_SOURCE"], "tree": os.environ["ORIGINAL_TREE"],
                           "apkSha256": os.environ["ORIGINAL_APK_SHA256"],
                           "artifactId": int(os.environ["ORIGINAL_ARTIFACT_ID"]),
                           "artifactName": os.environ["ORIGINAL_ARTIFACT_NAME"],
                           "artifactArchiveSha256": os.environ["ORIGINAL_ARTIFACT_SHA256"]},
              "transfer": {"runId": transfer_run, "attempt": 1,
                           "source": os.environ["TRANSFER_SOURCE"], "branch": os.environ["ORIGINAL_TRANSFER_BRANCH"]},
              "batchTransfer": {"runId": batch_run, "attempt": int(os.environ["BATCH_RUN_ATTEMPT"]),
                                "source": os.environ["BATCH_SOURCE"], "branch": os.environ["BATCH_BRANCH"]},
              "slice": {"index": index, "offset": int(os.environ["PART_OFFSET"]),
                        "length": len(payload), "payloadSha256": payload_sha,
                        "artifactId": artifact_id, "artifactName": row["name"],
                        "artifactBytes": row["size_in_bytes"], "artifactSha256": archive_sha},
              "encoding": "zlib+base64", "compressedBytes": len(compressed),
              "compressedSha256": compressed_sha, "lineCount": len(lines),
              "wireLineMaxBytes": 16 * 1024,
          }
          print("[[LITE265_SLICE_BEGIN]]", flush=True)
          print(json.dumps(header, sort_keys=True, separators=(",", ":")), flush=True)
          print("[[LITE265_SLICE_DATA_BEGIN]]", flush=True)
          for line in lines:
              print(line, flush=True)
          print("[[LITE265_SLICE_DATA_END]]", flush=True)
          print("[[LITE265_SLICE_END]]", flush=True)
          PY
