name: Lite265 byte transfer only (no build)
run-name: Lite265 byte transfer only (no build)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}

jobs:
  prepare_and_upload:
    name: Lite265 byte transfer only (no build)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'IvanSolis1989/Aerove' &&
      github.repository_owner == 'IvanSolis1989' &&
      github.actor == 'IvanSolis1989' &&
      github.ref == 'refs/heads/codex/lite265-byte-transfer'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: '42066278567'
      ORIGINAL_ATTEMPT: '1'
      ORIGINAL_SOURCE: '4190ff45f8eedc6734fa666e2658b71abf147479'
      EXPECTED_TREE: '8ca6fb6bc19867e9302923ba9bea8d289972a8b6'
      ORIGINAL_ARTIFACT_ID: '13436109593'
      ORIGINAL_ARTIFACT_NAME: 'AEROVE-Lite-preview-arm64-attempt-1'
      ORIGINAL_ARTIFACT_BYTES: '47810677'
      ORIGINAL_ARTIFACT_SHA256: '4b8064c747418990d476badd5db6f801a91c3dd1d6acbe8ce903dca1f8d3cbc6'
      APK_NAME: 'AEROVE-Lite-android-arm64.apk'
      APK_SHA256: 'a7f97bb4bd9026a69319a65e339e8a241c35a6598ee4cc0dd1a4f521a4dc9654'
      PART_BYTES: '2097152'
      TRANSFER_RUN_ID: ${{ github.run_id }}
      TRANSFER_RUN_ATTEMPT: ${{ github.run_attempt }}
      TRANSFER_GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout immutable Lite265 source identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4190ff45f8eedc6734fa666e2658b71abf147479
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Verify and split original Lite APK bytes without rebuilding
        id: prepare
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath, PureWindowsPath
          import re
          import subprocess
          import zipfile

          repo = "IvanSolis1989/Aerove"
          run_id = int(os.environ["ORIGINAL_RUN"])
          attempt = int(os.environ["ORIGINAL_ATTEMPT"])
          source = os.environ["ORIGINAL_SOURCE"]
          tree = os.environ["EXPECTED_TREE"]
          root = Path(os.environ["RUNNER_TEMP"]) / "lite265-byte-transfer"
          parts_dir = root / "parts"
          parts_dir.mkdir(parents=True)

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def gh_json(route):
              result = subprocess.run(["gh", "api", route], check=True, capture_output=True,
                                      text=True, timeout=90)
              return json.loads(result.stdout)

          def gh_archive(artifact_id, destination):
              try:
                  with destination.open("wb") as output:
                      subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{artifact_id}/zip"],
                                     stdout=output, stderr=subprocess.PIPE, check=True, timeout=300)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                  destination.unlink(missing_ok=True)
                  raw = getattr(error, "stderr", b"") or b""
                  message = raw.decode(errors="replace") if isinstance(raw, bytes) else raw
                  message = re.sub(r"https?://[^\s\"']+", "<URL redacted>", message)
                  message = re.sub(r"(?i)(token|authorization|password|secret)=\S+", r"\1=<redacted>", message)
                  raise SystemExit(f"Original Lite artifact transfer failed: {message[:1200]}") from None

          def sha_file(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          require(subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
                  and subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip() == tree,
                  "Immutable Lite265 source/tree checkout mismatch")
          original_run = gh_json(f"repos/{repo}/actions/runs/{run_id}")
          require(original_run.get("id") == run_id and original_run.get("run_attempt") == attempt
                  and original_run.get("head_sha") == source and original_run.get("status") == "completed"
                  and original_run.get("conclusion") == "failure"
                  and original_run.get("repository", {}).get("full_name") == repo,
                  "Original Lite265 run identity/conclusion mismatch")
          listing = gh_json(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")
          rows = listing.get("artifacts")
          require(isinstance(rows, list) and listing.get("total_count") == len(rows),
                  "Artifact API listing is incomplete")
          matches = [row for row in rows if row.get("id") == int(os.environ["ORIGINAL_ARTIFACT_ID"])]
          require(len(matches) == 1, "Expected exactly one fixed Lite ARM64 artifact")
          row = matches[0]
          expected_digest = "sha256:" + os.environ["ORIGINAL_ARTIFACT_SHA256"]
          require(row.get("name") == os.environ["ORIGINAL_ARTIFACT_NAME"]
                  and row.get("size_in_bytes") == int(os.environ["ORIGINAL_ARTIFACT_BYTES"])
                  and row.get("digest") == expected_digest and row.get("expired") is False
                  and row.get("workflow_run", {}).get("id") == run_id
                  and row.get("workflow_run", {}).get("head_sha") == source,
                  "Original Lite artifact API identity/size/digest mismatch")
          detail = gh_json(f"repos/{repo}/actions/artifacts/{row['id']}")
          for key in ("id", "name", "size_in_bytes", "digest", "expired"):
              require(detail.get(key) == row.get(key), "Artifact detail/list metadata mismatch")

          archive_path = root / "original-artifact.zip"
          gh_archive(row["id"], archive_path)
          require(archive_path.stat().st_size == int(os.environ["ORIGINAL_ARTIFACT_BYTES"])
                  and sha_file(archive_path) == os.environ["ORIGINAL_ARTIFACT_SHA256"],
                  "Original Lite artifact ZIP byte size/SHA-256 mismatch")
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]
              require(names and len(names) == len(set(names)), "Empty or duplicate paths in original Lite ZIP")
              require(sum(item.file_size for item in infos) <= 160 * 1024 * 1024,
                      "Original Lite artifact exceeds the bounded 160 MiB uncompressed size")
              for item in infos:
                  posix = PurePosixPath(item.filename)
                  windows = PureWindowsPath(item.filename)
                  mode = item.external_attr >> 16
                  require(not posix.is_absolute() and not windows.is_absolute() and not windows.drive
                          and ".." not in posix.parts and "\\" not in item.filename and posix.parts,
                          "Unsafe path in original Lite artifact ZIP")
                  file_type = mode & 0o170000
                  require(not (file_type == 0o120000)
                          and (not mode or file_type in (0o100000, 0o040000)),
                          "Non-regular entry in original Lite artifact ZIP")
              require(archive.testzip() is None, "Original Lite artifact ZIP CRC failure")
              files = {item.filename: item for item in infos if not item.is_dir()}
              apk_name = os.environ["APK_NAME"]
              require(set(files) == {apk_name, "BUILD_INFO.json", "SHA256SUMS"},
                      "Unexpected original Lite artifact file set")
              build_info_bytes = archive.read(files["BUILD_INFO.json"])
              sums_bytes = archive.read(files["SHA256SUMS"])
              build_info = json.loads(build_info_bytes.decode("utf-8", errors="strict"))
              apk_info = files[apk_name]
              require(build_info.get("product") == "AEROVE Lite" and build_info.get("channel") == "preview"
                      and build_info.get("application_id") == "dev.aerove.lite"
                      and build_info.get("version") == "0.2.0-beta.4" and build_info.get("version_code") == 36
                      and build_info.get("min_sdk") == 33 and build_info.get("abi") == "arm64-v8a"
                      and build_info.get("source") == source and build_info.get("tree") == tree
                      and build_info.get("run_number") == 265 and build_info.get("run_attempt") == attempt
                      and build_info.get("workflow") == f"https://github.com/{repo}/actions/runs/{run_id}"
                      and build_info.get("signer_sha256") == "09f9e021ddac36ead015d27e073b673e79fdf4e02605c402a505781963b1a4d8",
                      "Lite265 BUILD_INFO does not match the fixed source/package/version/signing identity")
              require(build_info.get("apk_sha256") == os.environ["APK_SHA256"],
                      "Lite265 BUILD_INFO APK hash differs from the fixed original APK hash")
              require(len(sums_bytes) > 0, "Original Lite SHA256SUMS is empty")
              expected_sums = (f"{os.environ['APK_SHA256']}  {apk_name}\n"
                               f"{hashlib.sha256(build_info_bytes).hexdigest()}  BUILD_INFO.json\n")
              require(sums_bytes.decode("utf-8", errors="strict") == expected_sums,
                      "Original Lite SHA256SUMS full content does not match APK/BUILD_INFO")

              chunk_size = int(os.environ["PART_BYTES"])
              apk_hash = hashlib.sha256()
              apk_bytes = 0
              parts = []
              with archive.open(apk_info) as source_apk:
                  index = 0
                  offset = 0
                  while True:
                      chunk = source_apk.read(chunk_size)
                      if not chunk:
                          break
                      part_name = f"part-{index:02d}.bin"
                      (parts_dir / part_name).write_bytes(chunk)
                      parts.append({"index": index,
                                    "artifactName": f"Lite265-original-byte-part-{index:02d}-attempt-{os.environ['TRANSFER_RUN_ATTEMPT']}",
                                    "fileName": part_name, "offset": offset, "length": len(chunk),
                                    "sha256": hashlib.sha256(chunk).hexdigest()})
                      apk_hash.update(chunk)
                      apk_bytes += len(chunk)
                      offset += len(chunk)
                      index += 1
              require(apk_bytes > 0 and apk_hash.hexdigest() == os.environ["APK_SHA256"],
                      "Streamed Lite APK bytes/hash do not match the fixed original SHA-256")
              require(1 <= len(parts) <= 64 and all(part["length"] == chunk_size for part in parts[:-1])
                      and 0 < parts[-1]["length"] <= chunk_size,
                      "Lite APK does not fit the bounded 64-part segmentation plan")
              manifest = {
                  "role": "byteTransferOnly", "accepted": False, "compiled": False,
                  "fullCiAccepted": False, "appApkBuilt": False, "published": False,
                  "repository": repo,
                  "original": {"runId": run_id, "runAttempt": attempt, "source": source, "tree": tree,
                               "runConclusion": "failure", "artifactId": row["id"], "artifactName": row["name"],
                               "artifactBytes": row["size_in_bytes"], "artifactSha256": os.environ["ORIGINAL_ARTIFACT_SHA256"]},
                  "apk": {"fileName": apk_name, "bytes": apk_bytes, "sha256": apk_hash.hexdigest(),
                          "partBytesMaximum": chunk_size, "partCount": len(parts), "parts": parts},
                  "buildInfo": build_info,
                  "buildInfoRawUtf8": build_info_bytes.decode("utf-8", errors="strict"),
                  "buildInfoBytes": len(build_info_bytes), "buildInfoSha256": hashlib.sha256(build_info_bytes).hexdigest(),
                  "sha256SumsRawUtf8": sums_bytes.decode("utf-8", errors="strict"),
                  "sha256SumsBytes": len(sums_bytes), "sha256SumsSha256": hashlib.sha256(sums_bytes).hexdigest(),
                  "transfer": {"workflowRunId": int(os.environ["TRANSFER_RUN_ID"]),
                               "workflowRunAttempt": int(os.environ["TRANSFER_RUN_ATTEMPT"]),
                               "workflowSha": os.environ["TRANSFER_GITHUB_SHA"],
                               "branch": "codex/lite265-byte-transfer"},
                  "reassembly": "Concatenate part files by ascending index; verify each part offset/length/SHA-256 and final APK SHA-256."
              }
              manifest_path = root / "manifest.json"
              manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
              require(manifest_path.stat().st_size < 100_000, "Lite transfer manifest unexpectedly large")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"part_count={len(parts)}\n")
          print(f"Prepared {len(parts)} original Lite APK byte segments; no build or acceptance performed.")
          PY

      - name: Upload original Lite APK bytes 00 of 64
        if: ${{ success() && steps.prepare.outputs.part_count > 0 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lite265-original-byte-part-00-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lite265-byte-transfer/parts/part-00.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload original Lite APK bytes 01 of 64
