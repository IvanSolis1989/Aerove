name: Lite270 failure evidence inspection only (no build)
run-name: Lite270 failure evidence inspection only (no build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite270-failure-inspector-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}

jobs:
  inspect_original_failure:
    name: Lite270 failure evidence inspection only (no build)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'IvanSolis1989/Aerove' &&
      github.repository_owner == 'IvanSolis1989' &&
      github.actor == 'IvanSolis1989' &&
      github.ref == 'refs/heads/codex/lite270-failure-inspector'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: '42088312836'
      ORIGINAL_ATTEMPT: '1'
      ORIGINAL_SOURCE: '52c4a7537f58b3de77e70cccdaf1eae2ccc3adca'
      ORIGINAL_BRANCH: 'codex/lite265-original-recheck'
      ORIGINAL_ARTIFACT_ID: '13443424355'
      ORIGINAL_ARTIFACT_NAME: 'Lite265-recheck-flutter-ui-attempt-1'
      ORIGINAL_ARTIFACT_BYTES: '47650'
      ORIGINAL_ARTIFACT_SHA256: '6dfce6fcb96abd370560685b307328db9a831a7619b6618e6ee70a91432f657b'
    steps:
      - name: Verify original failed Lite270 run and read artifact in memory
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath, PureWindowsPath
          import re
          import subprocess
          import zipfile

          repo = "IvanSolis1989/Aerove"
          run_id = int(os.environ["ORIGINAL_RUN"])
          attempt = int(os.environ["ORIGINAL_ATTEMPT"])
          source = os.environ["ORIGINAL_SOURCE"]
          expected_artifact = {
              "id": int(os.environ["ORIGINAL_ARTIFACT_ID"]),
              "name": os.environ["ORIGINAL_ARTIFACT_NAME"],
              "size_in_bytes": int(os.environ["ORIGINAL_ARTIFACT_BYTES"]),
              "digest": "sha256:" + os.environ["ORIGINAL_ARTIFACT_SHA256"],
          }
          temp = Path(os.environ["RUNNER_TEMP"])
          archive_path = temp / "lite270-failure-artifact.zip"

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def gh_json(route):
              result = subprocess.run(["gh", "api", route], check=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      text=True, timeout=45)
              return json.loads(result.stdout)

          def redact(text):
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              text = re.sub(r"https?://[^\s\"']+", "<URL redacted>", text)
              text = re.sub(r"(?i)\b(bearer|token|authorization|password|passwd|secret|api[_-]?key)\s*[:=]\s*[^\s,;]+",
                            r"\1=<redacted>", text)
              text = re.sub(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", "<IP redacted>", text)
              text = re.sub(r"(?<![\w:])(?:[0-9A-Fa-f]{0,4}:){3,}[0-9A-Fa-f]{0,4}(?![\w:])|"
                            r"(?<![\w:])::[0-9A-Fa-f]{0,4}(?![\w:])|(?<![\w:])[0-9A-Fa-f]{0,4}::(?![\w:])",
                            "<IPv6 redacted>", text)
              text = re.sub(r"\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b", "<MAC redacted>", text)
              text = re.sub(r"\bemulator-[0-9]+\b", "<device serial redacted>", text)
              text = re.sub(r"(?i)(serial(?:number)?\s*[:=]\s*)[^\s,;]+", r"\1<redacted>", text)
              return text

          run = gh_json(f"repos/{repo}/actions/runs/{run_id}")
          require(run.get("id") == run_id and run.get("run_attempt") == attempt
                  and run.get("head_sha") == source and run.get("head_branch") == os.environ["ORIGINAL_BRANCH"]
                  and run.get("status") == "completed" and run.get("conclusion") == "failure"
                  and run.get("repository", {}).get("full_name") == repo,
                  "Original Lite270 run identity/conclusion mismatch")
          listing = gh_json(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")
          rows = listing.get("artifacts")
          require(isinstance(rows, list) and listing.get("total_count") == len(rows),
                  "Original artifact listing is incomplete")
          matches = [row for row in rows if row.get("id") == expected_artifact["id"]]
          require(len(matches) == 1, "Expected exactly one fixed Lite265 original failure artifact")
          row = matches[0]
          for key, value in expected_artifact.items():
              require(row.get(key) == value, f"Original artifact {key} mismatch")
          require(row.get("expired") is False and row.get("workflow_run", {}).get("id") == run_id
                  and row.get("workflow_run", {}).get("head_sha") == source,
                  "Original artifact run/source/expiry binding mismatch")
          detail = gh_json(f"repos/{repo}/actions/artifacts/{row['id']}")
          for key, value in expected_artifact.items():
              require(detail.get(key) == value, f"Artifact detail {key} mismatch")

          try:
              with archive_path.open("wb") as output:
                  result = subprocess.run(
                      ["gh", "api", f"repos/{repo}/actions/artifacts/{row['id']}/zip"],
                      stdout=output, stderr=subprocess.PIPE, check=True, timeout=120)
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
              archive_path.unlink(missing_ok=True)
              raw = getattr(error, "stderr", b"") or b""
              message = raw.decode(errors="replace") if isinstance(raw, bytes) else raw
              message = redact(message)
              raise SystemExit(f"Original failure artifact transport failed: {message[:1000]}") from None
          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          require(archive_path.stat().st_size == expected_artifact["size_in_bytes"]
                  and digest == os.environ["ORIGINAL_ARTIFACT_SHA256"],
                  "Original artifact ZIP size/SHA-256 mismatch")

          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]
              require(names and len(names) == len(set(names)), "Empty or duplicate archive paths")
              require(sum(item.file_size for item in infos) <= 20 * 1024 * 1024,
                      "Artifact uncompressed content exceeds 20 MiB inspection bound")
              for item in infos:
                  posix = PurePosixPath(item.filename)
                  windows = PureWindowsPath(item.filename)
                  mode = item.external_attr >> 16
                  require(not posix.is_absolute() and not windows.is_absolute() and not windows.drive
                          and ".." not in posix.parts and "\\" not in item.filename and posix.parts,
                          "Unsafe artifact path")
                  file_type = mode & 0o170000
                  require(file_type != 0o120000 and (not mode or file_type in (0o100000, 0o040000)),
                          "Artifact contains a non-regular entry")
              require(not any(PurePosixPath(item.filename).suffix.casefold() == ".apk" for item in infos),
                      "Unexpected APK entry in failure evidence artifact; refusing to read APK bytes")
              require(archive.testzip() is None, "Original artifact ZIP CRC failure")
              files = {item.filename: item for item in infos if not item.is_dir()}
              by_basename = {}
              for name, info in files.items():
                  by_basename.setdefault(PurePosixPath(name).name.casefold(), []).append((name, info))

              def unique_file(basename, required=False):
                  found = by_basename.get(basename.casefold(), [])
                  if required:
                      require(len(found) == 1, f"Expected one {basename} evidence file")
                  return found[0] if len(found) == 1 else None

              def file_record(found):
                  if found is None:
                      return None
                  name, info = found
                  raw = archive.read(info)
                  return {"path": redact(name), "bytes": info.file_size,
                          "sha256": hashlib.sha256(raw).hexdigest(), "raw": raw}

              def selected_fields(doc):
                  if not isinstance(doc, dict):
                      return {"topLevelType": type(doc).__name__}
                  wanted = re.compile(
                      r"(?i)(error|ready|cleanup|exit|command|guestangle|angle|route|renderer|backend|"
                      r"api|sdk|status|state|phase|reason|failure|message|owner|process|emulator|"
                      r"stderr|stdout|started|finished|result|outcome|signal|code|booted|bootcomplete)"
                  )
                  def safe(value, depth=0):
                      if depth > 3:
                          return "<nested value omitted>"
                      if isinstance(value, str):
                          return redact(value)[:800]
                      if isinstance(value, (int, float, bool)) or value is None:
                          return value
                      if isinstance(value, list):
                          return [safe(item, depth + 1) for item in value[:20]]
                      if isinstance(value, dict):
                          result = {}
                          for key, child in list(value.items())[:40]:
                              if not re.search(r"(?i)(token|secret|password|credential|config|profile|address|serial|mac)", str(key)) and wanted.search(str(key).replace("_", "")):
                                  result[str(key)] = safe(child, depth + 1)
                          return result
                      return f"<{type(value).__name__}>"
                  result = {}
                  for key, value in doc.items():
                      if not re.search(r"(?i)(token|secret|password|credential|config|profile|address|serial|mac)", str(key)) and wanted.search(str(key).replace("_", "")):
                          result[str(key)] = safe(value)
                  return result

              evidence_files = []
              owner = unique_file("EMULATOR-OWNER.json", required=True)
              bootstrap = unique_file("BOOTSTRAP.json", required=True)
              owner_record = file_record(owner)
              bootstrap_record = file_record(bootstrap)
              for name, record in (("EMULATOR-OWNER.json", owner_record), ("BOOTSTRAP.json", bootstrap_record)):
                  raw = record.pop("raw")
                  try:
                      doc = json.loads(raw.decode("utf-8", errors="strict"))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      doc = None
                  record["topLevel"] = selected_fields(doc) if doc is not None else {"parseError": True}
                  record["role"] = name
                  evidence_files.append(record)

              stderr_file = unique_file("emulator.stderr.log", required=True)
              stderr_record = file_record(stderr_file)
              stderr_raw = stderr_record.pop("raw")
              stderr_text = redact(stderr_raw.decode("utf-8", errors="replace"))
              stdout_candidates = [(name, info) for name, info in files.items()
                                   if "stdout" in PurePosixPath(name).name.casefold()
                                   and "emulator" in PurePosixPath(name).name.casefold()]
              require(len(stdout_candidates) <= 1, "Multiple emulator stdout files are ambiguous")
              stdout_record = file_record(stdout_candidates[0]) if stdout_candidates else None
              stdout_tail = None
              if stdout_record is not None:
                  stdout_raw = stdout_record.pop("raw")
                  stdout_lines = stdout_raw.decode("utf-8", errors="replace").splitlines()
                  stdout_tail = {"path": stdout_record["path"], "bytes": stdout_record["bytes"],
                                 "sha256": stdout_record["sha256"],
                                 "last100Lines": [redact(line)[:1000] for line in stdout_lines[-100:]]}

              guest_sources = []
              def find_guest_logs(value, path):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          next_path = path + "." + str(key)
                          normalized = str(key).casefold().replace("_", "")
                          if isinstance(child, str) and ("guestlogcat" in normalized or ("guestlogcat" in next_path.casefold().replace("_", "") and str(key).casefold() in ("stdout", "text", "log"))):
                              guest_sources.append((next_path, child))
                          else:
                              find_guest_logs(child, next_path)
                  elif isinstance(value, list):
                      for index, child in enumerate(value[:100]):
                          find_guest_logs(child, f"{path}[{index}]")
              # Re-read the already CRC-checked bootstrap member in memory for guest logcat fields.
              if bootstrap is not None:
                  bootstrap_text = archive.read(bootstrap[1]).decode("utf-8", errors="replace")
                  try:
                      bootstrap_doc = json.loads(bootstrap_text)
                  except json.JSONDecodeError:
                      bootstrap_doc = None
              if bootstrap_doc is not None:
                  find_guest_logs(bootstrap_doc, "BOOTSTRAP.json")
              guest_keywords = re.compile(r"(?i)(ANGLE|EGL|SurfaceFlinger|FATAL|SIGABRT|abort|crash|"
                                          r"OpenGL|Vulkan|GFXSTREAM|SwiftShader|Lavapipe)")
              guest_windows = []
              for source_path, log_text in guest_sources:
                  log_lines = log_text.splitlines()
                  selected = set()
                  for index, line in enumerate(log_lines):
                      if guest_keywords.search(line):
                          selected.update(range(max(0, index - 10), min(len(log_lines), index + 11)))
                  positions = sorted(selected)
                  ranges = []
                  for index in positions:
                      if not ranges or index + 1 > ranges[-1][1] + 1:
                          ranges.append([index + 1, index + 1])
                      else:
                          ranges[-1][1] = index + 1
                  guest_windows.append({"source": redact(source_path), "lineRanges": ranges,
                                        "lines": [{"line": index + 1, "text": redact(log_lines[index])[:1000]}
                                                  for index in positions]})

              cap_files = [(name, info) for name, info in files.items()
                           if "cap" in PurePosixPath(name).name.casefold()
                           and "proof" in PurePosixPath(name).name.casefold()]
              require(len(cap_files) <= 4, "Too many candidate CAP proof files")
              cap_proofs = []
              for name, info in cap_files:
                  raw = archive.read(info)
                  try:
                      doc = json.loads(raw.decode("utf-8", errors="strict"))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      doc = None
                  cap_proofs.append({"path": redact(name), "bytes": info.file_size, "sha256": hashlib.sha256(raw).hexdigest(),
                                     "routeFields": selected_fields(doc) if doc is not None else {"parseError": True}})

              report = {
                  "role": "evidenceReadback", "accepted": False, "compiled": False,
                  "originalRun": {"id": run_id, "attempt": attempt, "source": source,
                                  "branch": run.get("head_branch"), "conclusion": run.get("conclusion"),
                                  "workflowPath": run.get("path")},
                  "artifact": {"id": row["id"], "name": row["name"], "bytes": row["size_in_bytes"],
                               "sha256": digest, "zipCrcVerified": True,
                               "uncompressedBytes": sum(item.file_size for item in infos)},
                  "emulatorOwner": owner_record,
                  "bootstrap": bootstrap_record,
                  "emulatorStderrFull": {**stderr_record, "text": stderr_text},
                  "emulatorStdoutLast100": stdout_tail,
                  "bootstrapGuestLogcatRouteWindows": guest_windows,
                  "capProofRouteFields": cap_proofs,
                  "otherEvidencePaths": [{"path": redact(item.filename), "bytes": item.file_size}
                                          for item in infos if not item.is_dir()
                                          and PurePosixPath(item.filename).name.casefold()
                                          not in {"emulator-owner.json", "bootstrap.json", "emulator.stderr.log"}
                                          and item.filename not in {candidate[0] for candidate in stdout_candidates}
                                          and all(item.filename != candidate[0] for candidate in cap_files)],
              }
              encoded = json.dumps(report, ensure_ascii=False, separators=(",", ":"))
              require(len(encoded.encode("utf-8")) < 200 * 1024, "Redacted evidence JSON exceeds 200 KiB")
              print(encoded, flush=True)
          PY
