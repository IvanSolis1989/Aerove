name: Lite265 single-slice log transfer pilot (no build)
run-name: Lite265 single-slice log transfer pilot (no build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite265-log-transfer-pilot-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}

jobs:
  transfer_one_original_slice:
    name: Lite265 byte-transfer pilot index 21 (no build)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'IvanSolis1989/Aerove' &&
      github.repository_owner == 'IvanSolis1989' &&
      github.actor == 'IvanSolis1989' &&
      github.ref == 'refs/heads/codex/lite265-log-transfer'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSFER_RUN: '42087750789'
      TRANSFER_ATTEMPT: '1'
      TRANSFER_SOURCE: '9c271297042650827182a74933760eda4126fc57'
      TRANSFER_BRANCH: 'codex/lite265-byte-transfer'
      ORIGINAL_RUN: '42066278567'
      ORIGINAL_ATTEMPT: '1'
      ORIGINAL_SOURCE: '4190ff45f8eedc6734fa666e2658b71abf147479'
      ORIGINAL_TREE: '8ca6fb6bc19867e9302923ba9bea8d289972a8b6'
      ORIGINAL_APK_SHA256: 'a7f97bb4bd9026a69319a65e339e8a241c35a6598ee4cc0dd1a4f521a4dc9654'
      ORIGINAL_ARTIFACT_ID: '13436109593'
      ORIGINAL_ARTIFACT_NAME: 'AEROVE-Lite-preview-arm64-attempt-1'
      ORIGINAL_ARTIFACT_SHA256: '4b8064c747418990d476badd5db6f801a91c3dd1d6acbe8ce903dca1f8d3cbc6'
      SLICE_ARTIFACT_ID: '13443387417'
      SLICE_ARTIFACT_NAME: 'Lite265-original-byte-part-21-attempt-1'
      SLICE_ARTIFACT_BYTES: '2097288'
      SLICE_ARTIFACT_SHA256: '4ce13fe586a56319c1e950b964253ba1a22f008e1ecab9301035c63f4c047635'
      SLICE_FILE_NAME: 'part-21.bin'
      SLICE_INDEX: '21'
      SLICE_OFFSET: '44040192'
      SLICE_BYTES: '2097152'
      SLICE_SHA256: '3b8b04d158180e25d8358d5be3d8181f48537c09c312dd78e4d79624c7fc7624'
    steps:
      - name: Validate fixed runs and stream one verified original segment to stdout
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath, PureWindowsPath
          import re
          import subprocess
          import zipfile
          import zlib

          repo = "IvanSolis1989/Aerove"
          transfer_run = int(os.environ["TRANSFER_RUN"])
          transfer_attempt = int(os.environ["TRANSFER_ATTEMPT"])
          original_run = int(os.environ["ORIGINAL_RUN"])
          original_attempt = int(os.environ["ORIGINAL_ATTEMPT"])
          slice_id = int(os.environ["SLICE_ARTIFACT_ID"])
          temp = Path(os.environ["RUNNER_TEMP"])
          archive_path = temp / "lite265-original-part-21.zip"

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def api(route):
              try:
                  result = subprocess.run(["gh", "api", route], stdout=subprocess.PIPE,
                                          stderr=subprocess.PIPE, timeout=45, check=False)
              except subprocess.TimeoutExpired:
                  raise SystemExit("GitHub API metadata request timed out") from None
              require(result.returncode == 0, "GitHub API metadata request failed")
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  raise SystemExit("GitHub API metadata was not valid JSON") from None

          original = api(f"repos/{repo}/actions/runs/{original_run}")
          require(original.get("id") == original_run and original.get("run_attempt") == original_attempt
                  and original.get("head_sha") == os.environ["ORIGINAL_SOURCE"]
                  and original.get("head_branch") == "codex/lite-shared-flutter-complete114"
                  and original.get("status") == "completed" and original.get("conclusion") == "failure"
                  and original.get("repository", {}).get("full_name") == repo
                  and original.get("path") == ".github/workflows/aerove-lite.yaml",
                  "Original Lite265 run/source/attempt identity mismatch")
          transfer = api(f"repos/{repo}/actions/runs/{transfer_run}")
          require(transfer.get("id") == transfer_run and transfer.get("run_attempt") == transfer_attempt
                  and transfer.get("head_sha") == os.environ["TRANSFER_SOURCE"]
                  and transfer.get("head_branch") == os.environ["TRANSFER_BRANCH"]
                  and transfer.get("status") == "completed" and transfer.get("conclusion") == "success"
                  and transfer.get("repository", {}).get("full_name") == repo
                  and transfer.get("path") == ".github/workflows/xclash-android.yaml",
                  "Successful original Lite265 byte-transfer run/source/attempt mismatch")
          listing = api(f"repos/{repo}/actions/runs/{transfer_run}/artifacts?per_page=100")
          rows = listing.get("artifacts")
          require(isinstance(rows, list) and listing.get("total_count") == len(rows) and len(rows) <= 65,
                  "Lite265 transfer artifact list is incomplete or exceeds its defined bound")
          names = [row.get("name") for row in rows]
          require(len(names) == len(set(names)), "Duplicate transfer artifact names")
          matches = [row for row in rows if row.get("id") == slice_id]
          require(len(matches) == 1, "Fixed Lite265 slice artifact ID is missing or duplicated")
          row = matches[0]
          expected = {
              "name": os.environ["SLICE_ARTIFACT_NAME"],
              "size_in_bytes": int(os.environ["SLICE_ARTIFACT_BYTES"]),
              "digest": "sha256:" + os.environ["SLICE_ARTIFACT_SHA256"],
          }
          for key, value in expected.items():
              require(row.get(key) == value, f"Transfer slice API {key} mismatch")
          require(row.get("expired") is False and row.get("workflow_run", {}).get("id") == transfer_run
                  and row.get("workflow_run", {}).get("head_sha") == os.environ["TRANSFER_SOURCE"],
                  "Transfer slice artifact run/source/expiry mismatch")
          detail = api(f"repos/{repo}/actions/artifacts/{slice_id}")
          for key, value in expected.items():
              require(detail.get(key) == value, f"Transfer slice detail {key} mismatch")

          try:
              with archive_path.open("wb") as output:
                  result = subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{slice_id}/zip"],
                                          stdout=output, stderr=subprocess.PIPE, timeout=90, check=False)
          except subprocess.TimeoutExpired:
              archive_path.unlink(missing_ok=True)
              raise SystemExit("Fixed slice archive download timed out") from None
          if result.returncode:
              archive_path.unlink(missing_ok=True)
              raise SystemExit(f"Fixed slice archive transport failed (exit {result.returncode})")
          archive_hash = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          require(archive_path.stat().st_size == int(os.environ["SLICE_ARTIFACT_BYTES"])
                  and archive_hash == os.environ["SLICE_ARTIFACT_SHA256"],
                  "Transfer slice ZIP size/SHA-256 mismatch")
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              require(len(infos) == 1 and infos[0].filename == os.environ["SLICE_FILE_NAME"]
                      and not infos[0].is_dir() and infos[0].file_size == int(os.environ["SLICE_BYTES"]),
                      "Transfer ZIP does not contain exactly the expected original part-21.bin")
              name = PurePosixPath(infos[0].filename)
              windows = PureWindowsPath(infos[0].filename)
              mode = infos[0].external_attr >> 16
              file_type = mode & 0o170000
              require(not name.is_absolute() and not windows.is_absolute() and not windows.drive
                      and ".." not in name.parts and "\\" not in infos[0].filename
                      and file_type != 0o120000 and (not mode or file_type == 0o100000),
                      "Transfer slice ZIP path/type is unsafe")
              require(archive.testzip() is None, "Transfer slice ZIP CRC failure")
              payload = archive.read(infos[0])
          payload_hash = hashlib.sha256(payload).hexdigest()
          require(len(payload) == int(os.environ["SLICE_BYTES"])
                  and payload_hash == os.environ["SLICE_SHA256"],
                  "Original part 21 payload length/SHA-256 mismatch")
          compressed = zlib.compress(payload, level=9)
          compressed_hash = hashlib.sha256(compressed).hexdigest()
          encoded = base64.b64encode(compressed).decode("ascii")
          line_capacity = 16 * 1024 - 16
          chunks = [encoded[index:index + line_capacity] for index in range(0, len(encoded), line_capacity)]
          require(chunks and all(len(chunk.encode("ascii")) <= 16 * 1024 - 16 for chunk in chunks),
                  "Encoded payload line bound violated")
          wire_lines = [f"{sequence:04d}/{len(chunks):04d}:{chunk}"
                        for sequence, chunk in enumerate(chunks, start=1)]
          require(all(len(line.encode("ascii")) <= 16 * 1024 for line in wire_lines),
                  "Sequenced stdout line exceeds 16 KiB")
          header = {
              "role": "byteTransferOnly", "accepted": False, "compiled": False,
              "appApkBuilt": False,
              "fullCiAccepted": False, "published": False,
              "original": {"runId": original_run, "runAttempt": original_attempt,
                           "source": os.environ["ORIGINAL_SOURCE"],
                           "tree": os.environ["ORIGINAL_TREE"],
                           "apkSha256": os.environ["ORIGINAL_APK_SHA256"],
                           "artifactId": int(os.environ["ORIGINAL_ARTIFACT_ID"]),
                           "artifactName": os.environ["ORIGINAL_ARTIFACT_NAME"],
                           "artifactArchiveSha256": os.environ["ORIGINAL_ARTIFACT_SHA256"]},
              "transfer": {"runId": transfer_run, "attempt": transfer_attempt,
                           "source": os.environ["TRANSFER_SOURCE"],
                           "branch": os.environ["TRANSFER_BRANCH"]},
              "slice": {"index": int(os.environ["SLICE_INDEX"]),
                        "offset": int(os.environ["SLICE_OFFSET"]), "length": len(payload),
                        "payloadSha256": payload_hash, "artifactId": slice_id,
                        "artifactName": row["name"], "artifactBytes": row["size_in_bytes"],
                        "artifactSha256": archive_hash},
              "encoding": "zlib+base64", "compressedBytes": len(compressed),
              "compressedSha256": compressed_hash, "lineCount": len(chunks),
              "base64CharactersPerLine": line_capacity, "wireLineMaxBytes": 16 * 1024,
          }
          header_json = json.dumps(header, sort_keys=True, separators=(",", ":"))
          print("[[LITE265_SLICE_BEGIN]]", flush=True)
          print(header_json, flush=True)
          print("[[LITE265_SLICE_DATA_BEGIN]]", flush=True)
          for line in wire_lines:
              print(line, flush=True)
          print("[[LITE265_SLICE_DATA_END]]", flush=True)
          print("[[LITE265_SLICE_END]]", flush=True)
          PY
