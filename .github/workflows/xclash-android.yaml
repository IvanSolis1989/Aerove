name: XClash Android 17 install diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xclash-install-parse-33-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and verify published APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xclash-diagnostic/apks" "$RUNNER_TEMP/xclash-diagnostic/logs"
          base='https://github.com/IvanSolis1989/XClash/releases/download'
          curl --fail --location --retry 3 --retry-all-errors "$base/v0.9.0%2B2026101407/XClash-android-arm64.apk" -o "$RUNNER_TEMP/xclash-diagnostic/apks/old.apk"
          curl --fail --location --retry 3 --retry-all-errors "$base/v0.9.1-pre.4-X%2B2026101714/XClash-android-arm64.apk" -o "$RUNNER_TEMP/xclash-diagnostic/apks/new.apk"
          printf '%s  %s\n' 'dc83613947edbb90c21186e990baaa19509515c3d13e83b8f6dd88c8a1e97b7f' "$RUNNER_TEMP/xclash-diagnostic/apks/old.apk" '3ada37e79954f0023e77c1ef6726b77f59c7d2c663d0274d0e053078d4b98ea5' "$RUNNER_TEMP/xclash-diagnostic/apks/new.apk" | sha256sum --check
          sha256sum "$RUNNER_TEMP/xclash-diagnostic/apks/old.apk" "$RUNNER_TEMP/xclash-diagnostic/apks/new.apk" | tee "$RUNNER_TEMP/xclash-diagnostic/logs/apk-sha256.txt"

      - name: Prepare public-API archive probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xclash-diagnostic/src/org/codex/archiveprobe"
          cat > "$RUNNER_TEMP/xclash-diagnostic/src/org/codex/archiveprobe/ProbeActivity.java" <<'JAVA'
          package org.codex.archiveprobe;

          import android.app.Activity;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.Signature;
          import android.os.Bundle;
          import android.util.Log;
          import java.security.MessageDigest;
          import java.util.Locale;

          public final class ProbeActivity extends Activity {
              private static final String TAG = "ArchiveProbe";
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  String path = getIntent().getStringExtra("archive");
                  String expectedPackage = getIntent().getStringExtra("expectedPackage");
                  String expectedVersion = getIntent().getStringExtra("expectedVersion");
                  long expectedCode = getIntent().getLongExtra("expectedCode", -1L);
                  String expectedCert = getIntent().getStringExtra("expectedCert");
                  try {
                      PackageManager pm = getPackageManager();
                      PackageInfo info = pm.getPackageArchiveInfo(path,
                              PackageManager.GET_ACTIVITIES | PackageManager.GET_SERVICES |
                              PackageManager.GET_PROVIDERS | PackageManager.GET_SIGNING_CERTIFICATES);
                      if (info == null || info.applicationInfo == null) {
                          Log.e(TAG, "ARCHIVE_PROBE_FAIL parse returned null for " + path);
                          finish();
                          return;
                      }
                      info.applicationInfo.sourceDir = path;
                      info.applicationInfo.publicSourceDir = path;
                      CharSequence label = pm.getApplicationLabel(info.applicationInfo);
                      StringBuilder certs = new StringBuilder();
                      if (info.signingInfo != null) {
                          for (Signature signature : info.signingInfo.getApkContentsSigners()) {
                              if (certs.length() > 0) certs.append(',');
                              certs.append(hex(MessageDigest.getInstance("SHA-256")
                                      .digest(signature.toByteArray())));
                          }
                      }
                      long code = info.getLongVersionCode();
                      Log.i(TAG, "ARCHIVE_METADATA package=" + info.packageName +
                              " version=" + info.versionName + " code=" + code +
                              " label=" + String.valueOf(label) + " signerSha256=" + certs);
                      if (!expectedPackage.equals(info.packageName) ||
                              !expectedVersion.equals(info.versionName) || code != expectedCode ||
                              !certs.toString().toLowerCase(Locale.ROOT).contains(expectedCert)) {
                          Log.e(TAG, "ARCHIVE_PROBE_FAIL metadata or signer mismatch");
                      } else {
                          Log.i(TAG, "ARCHIVE_PROBE_PASS");
                      }
                  } catch (Throwable t) {
                      Log.e(TAG, "ARCHIVE_PROBE_FAIL exception", t);
                  } finally {
                      finish();
                  }
              }
              private static String hex(byte[] bytes) {
                  StringBuilder out = new StringBuilder(bytes.length * 2);
                  for (byte b : bytes) out.append(String.format(Locale.ROOT, "%02x", b & 0xff));
                  return out.toString();
              }
          }
          JAVA
          cat > "$RUNNER_TEMP/xclash-diagnostic/AndroidManifest.xml" <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.codex.archiveprobe">
            <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="37" />
            <application android:label="ArchiveProbe" android:debuggable="true">
              <activity android:name=".ProbeActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > "$RUNNER_TEMP/xclash-diagnostic/run_diagnostics.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root="$RUNNER_TEMP/xclash-diagnostic"
          logs="$root/logs"
          mkdir -p "$logs" "$root/classes" "$root/dex"
          status=0
          trap 'adb logcat -d -v threadtime > "$logs/logcat-final.txt" 2>&1 || true; adb shell dumpsys package com.follow.clash.dev > "$logs/dumpsys-xclash-final.txt" 2>&1 || true' EXIT
          {
            echo "Android SDK: $ANDROID_HOME"
            sdkmanager --list_installed 2>&1 || true
            echo "API 37 image packages:"
            sdkmanager --list_installed 2>/dev/null | grep -E 'system-images;android-37|build-tools;37' || true
            echo "Emulator:"
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abi
            adb shell getconf PAGE_SIZE || true
          } > "$logs/emulator-environment.txt" 2>&1
          platform="$ANDROID_HOME/platforms/android-37.0/android.jar"
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -f "$platform" || { echo "Missing $platform" | tee -a "$logs/build-probe.txt"; exit 1; }
          {
            echo "Build tools: $bt"
            javac --release 8 -classpath "$platform" -d "$root/classes" "$root/src/org/codex/archiveprobe/ProbeActivity.java"
            "$bt/d8" --min-api 24 --output "$root/dex" "$root/classes/org/codex/archiveprobe/ProbeActivity.class"
            "$bt/aapt" package -f -M "$root/AndroidManifest.xml" -I "$platform" -F "$root/probe-unsigned.apk"
            (cd "$root/dex" && zip -q "$root/probe-unsigned.apk" classes.dex)
            keytool -genkeypair -alias archiveprobe -keystore "$root/probe.p12" -storepass android -keypass android -storetype PKCS12 -dname 'CN=ArchiveProbe,O=Codex,C=US' -keyalg RSA -keysize 2048 -validity 3650 -noprompt
            "$bt/apksigner" sign --ks "$root/probe.p12" --ks-pass pass:android --key-pass pass:android --out "$root/probe.apk" "$root/probe-unsigned.apk"
            "$bt/apksigner" verify --verbose --print-certs "$root/probe.apk"
          } > "$logs/build-probe.txt" 2>&1
          adb install -r -t "$root/probe.apk" > "$logs/install-probe-app.txt" 2>&1 || { cat "$logs/install-probe-app.txt"; exit 1; }
          adb shell run-as org.codex.archiveprobe mkdir -p files > "$logs/probe-private-dir.txt" 2>&1
          probe_one() {
            local which="$1" apk="$2" version="$3" code="$4"
            local dest="/data/user/0/org.codex.archiveprobe/files/${which}.apk"
            adb shell -T "run-as org.codex.archiveprobe sh -c 'cat > files/${which}.apk'" < "$apk" > "$logs/copy-${which}.txt" 2>&1 || return 1
            local local_sha device_sha
            local_sha="$(sha256sum "$apk" | awk '{print $1}')"
            device_sha="$(adb shell -T "run-as org.codex.archiveprobe sha256sum files/${which}.apk" | awk '{print $1}')"
            printf 'local=%s\ndevice=%s\n' "$local_sha" "$device_sha" > "$logs/archive-sha256-${which}.txt"
            [ "$local_sha" = "$device_sha" ] || { echo "Probe archive hash mismatch: $which" >&2; return 1; }
            adb logcat -c
            adb shell am start -W -n org.codex.archiveprobe/.ProbeActivity \
              --es archive "$dest" --es expectedPackage com.follow.clash.dev \
              --es expectedVersion "$version" --el expectedCode "$code" \
              --es expectedCert 0fc82c3b7b089b6244d9ed167b352ff76185417d07689853caca286fbdeb6e60 \
              > "$logs/probe-start-${which}.txt" 2>&1 || true
            local found=0
            for _ in $(seq 1 30); do
              if adb logcat -d -s ArchiveProbe:I ArchiveProbe:E | grep -q 'ARCHIVE_PROBE_\(PASS\|FAIL\)'; then found=1; break; fi
              sleep 1
            done
            adb logcat -d -v threadtime -s ArchiveProbe:I ArchiveProbe:E > "$logs/archive-probe-${which}.txt" 2>&1 || true
            if [ "$found" -eq 0 ] || grep -q 'ARCHIVE_PROBE_FAIL' "$logs/archive-probe-${which}.txt" || ! grep -q 'ARCHIVE_PROBE_PASS' "$logs/archive-probe-${which}.txt"; then
              echo "Archive parse/metadata check failed for $which" | tee -a "$logs/results.txt"
              return 1
            fi
            echo "Archive parse/metadata check passed for $which" | tee -a "$logs/results.txt"
          }
          probe_one old "$root/apks/old.apk" '0.9.0' 2026101407 || status=1
          probe_one new "$root/apks/new.apk" '0.9.1-pre.4-X' 2026101714 || status=1
          # Install old first, then test replacement by the new release. Do not launch XClash.
          adb uninstall com.follow.clash.dev > "$logs/uninstall-before-install.txt" 2>&1 || true
          set +e
          adb install --no-streaming -r -t "$root/apks/old.apk" > "$logs/install-old.txt" 2>&1
          old_rc=$?
          set -e
          if [ "$old_rc" -eq 0 ]; then
            echo 'Old release install: success' | tee -a "$logs/results.txt"
          elif grep -q 'INSTALL_FAILED_NO_MATCHING_ABIS' "$logs/install-old.txt"; then
            echo 'Old release install: NO_MATCHING_ABIS (reported separately; not counted as install pass)' | tee -a "$logs/results.txt"
            status=1
          else
            echo "Old release install failed rc=$old_rc" | tee -a "$logs/results.txt"
            status=1
          fi
          set +e
          adb install --no-streaming -r -t "$root/apks/new.apk" > "$logs/install-new-upgrade.txt" 2>&1
          new_rc=$?
          set -e
          if [ "$new_rc" -eq 0 ]; then
            if [ "$old_rc" -eq 0 ]; then
              echo 'New release upgrade after old release: success' | tee -a "$logs/results.txt"
            else
              echo 'New release install: success; old release was not installed, so upgrade was not tested' | tee -a "$logs/results.txt"
            fi
            adb shell pm path com.follow.clash.dev > "$logs/installed-apk-path.txt" 2>&1 || true
            adb shell dumpsys package com.follow.clash.dev > "$logs/dumpsys-xclash-after-install.txt" 2>&1 || true
          elif grep -q 'INSTALL_FAILED_NO_MATCHING_ABIS' "$logs/install-new-upgrade.txt"; then
            echo 'New release install: NO_MATCHING_ABIS (reported separately; not counted as install pass)' | tee -a "$logs/results.txt"
            status=1
          else
            echo "New release install/upgrade failed rc=$new_rc" | tee -a "$logs/results.txt"
            status=1
          fi
          cat "$logs/install-old.txt" "$logs/install-new-upgrade.txt" >> "$logs/results.txt" 2>/dev/null || true
          # Archive parsing is the primary reproduction; native ABI mismatch is reported independently.
          grep -q 'ARCHIVE_PROBE_PASS' "$logs/archive-probe-old.txt" 2>/dev/null || status=1
          grep -q 'ARCHIVE_PROBE_PASS' "$logs/archive-probe-new.txt" 2>/dev/null || status=1
          exit "$status"
          SH
          chmod +x "$RUNNER_TEMP/xclash-diagnostic/run_diagnostics.sh"

      - name: Run on Android API 37 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '37.0'
          system-image-api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash "$RUNNER_TEMP/xclash-diagnostic/run_diagnostics.sh"

      - name: Collect emulator logs after failure
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xclash-diagnostic/logs"
          if timeout 5s adb get-state >/dev/null 2>&1; then
            timeout 10s adb logcat -d -v threadtime > "$RUNNER_TEMP/xclash-diagnostic/logs/logcat-post-step.txt" 2>&1 || true
            timeout 10s adb shell getprop > "$RUNNER_TEMP/xclash-diagnostic/logs/device-properties.txt" 2>&1 || true
            timeout 10s adb shell dumpsys package com.follow.clash.dev > "$RUNNER_TEMP/xclash-diagnostic/logs/dumpsys-xclash-post-step.txt" 2>&1 || true
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xclash-install-parse-33-api37
          path: |
            ${{ runner.temp }}/xclash-diagnostic/logs/
            ${{ runner.temp }}/xclash-diagnostic/src/**/*.java
            ${{ runner.temp }}/xclash-diagnostic/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 14
