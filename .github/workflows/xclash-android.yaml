name: README UI previews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Install dependencies and preview font
        run: |
          flutter pub get
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Render final application UI offline
        env:
          XCLASH_SCREENSHOT_DIR: ${{ runner.temp }}/readme-previews
        run: |
          git diff --exit-code c7860fa2d506cdc2a20773d0e89f37841dea9b64 -- lib assets android plugins
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
          dart format test/readme_showcase_test.dart
          flutter test --enable-impeller --dart-define=SAFE_MODE=true --reporter expanded test/readme_showcase_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-previews
          path: ${{ runner.temp }}/readme-previews
          if-no-files-found: warn
