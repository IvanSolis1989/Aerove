name: Lite265 R8 mapping evidence inspection only
run-name: Lite265 R8 mapping evidence inspection only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite265-r8-mapping-inspector-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}

jobs:
  inspect_original_runtime_mapping:
    name: Lite265 original R8 mapping evidence only (no build)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'IvanSolis1989/Aerove' &&
      github.repository_owner == 'IvanSolis1989' &&
      github.actor == 'IvanSolis1989' &&
      github.ref == 'refs/heads/codex/lite270-failure-inspector'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: '42066278567'
      ORIGINAL_ATTEMPT: '1'
      ORIGINAL_SOURCE: '4190ff45f8eedc6734fa666e2658b71abf147479'
      ORIGINAL_TREE: '8ca6fb6bc19867e9302923ba9bea8d289972a8b6'
      ORIGINAL_BRANCH: 'codex/lite-shared-flutter-complete114'
      RUNTIME_ARTIFACT_ID: '13436773990'
      RUNTIME_ARTIFACT_NAME: 'AEROVE-Lite-runtime-contract-attempt-1'
      RUNTIME_ARTIFACT_BYTES: '59451889'
      RUNTIME_ARTIFACT_SHA256: '49e50eb6317d8993bd6137956c88c9167ea8012653040fb182d8825a8ef79a9c'
      SOURCE_MANIFEST_SHA256: '7d868f81e8ec430a6be1a74bd79a164adea270c0aa1b94f6e4816f0f5bf24f0f'
    steps:
      - name: Verify immutable Lite265 runtime artifact and print bounded R8 mapping evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath, PureWindowsPath
          import re
          import subprocess
          import zipfile

          repo = "IvanSolis1989/Aerove"
          run_id = int(os.environ["ORIGINAL_RUN"])
          attempt = int(os.environ["ORIGINAL_ATTEMPT"])
          source = os.environ["ORIGINAL_SOURCE"]
          tree = os.environ["ORIGINAL_TREE"]
          artifact_id = int(os.environ["RUNTIME_ARTIFACT_ID"])
          expected_artifact = {
              "id": artifact_id,
              "name": os.environ["RUNTIME_ARTIFACT_NAME"],
              "size_in_bytes": int(os.environ["RUNTIME_ARTIFACT_BYTES"]),
              "digest": "sha256:" + os.environ["RUNTIME_ARTIFACT_SHA256"],
          }
          archive_path = Path(os.environ["RUNNER_TEMP"]) / "lite265-runtime-contract.zip"

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def api(route):
              try:
                  result = subprocess.run(["gh", "api", route], stdout=subprocess.PIPE,
                                          stderr=subprocess.PIPE, timeout=90, check=False)
              except subprocess.TimeoutExpired:
                  raise SystemExit("GitHub API metadata request timed out") from None
              require(result.returncode == 0, "GitHub API metadata request failed")
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  raise SystemExit("GitHub API metadata was not valid JSON") from None

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def redact(text):
              text = re.sub(r"https?://[^\s\"']+", "<URL redacted>", text)
              text = re.sub(r"(?i)\b(bearer|token|authorization|password|passwd|secret|api[_-]?key)\s*[:=]\s*[^\s,;]+",
                            r"\1=<redacted>", text)
              text = re.sub(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", "<IP redacted>", text)
              text = re.sub(r"(?<![\w:])(?:[0-9A-Fa-f]{0,4}:){3,}[0-9A-Fa-f]{0,4}(?![\w:])|"
                            r"(?<![\w:])::[0-9A-Fa-f]{0,4}(?![\w:])|(?<![\w:])[0-9A-Fa-f]{0,4}::(?![\w:])",
                            "<IPv6 redacted>", text)
              text = re.sub(r"\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b", "<MAC redacted>", text)
              text = re.sub(r"\bemulator-[0-9]+\b", "<device serial redacted>", text)
              text = re.sub(r"(?i)(serial(?:number)?\s*[:=]\s*)[^\s,;]+", r"\1<redacted>", text)
              return text[:2000]

          run = api(f"repos/{repo}/actions/runs/{run_id}")
          require(run.get("id") == run_id and run.get("run_attempt") == attempt
                  and run.get("run_number") == 265 and run.get("head_sha") == source
                  and run.get("head_branch") == os.environ["ORIGINAL_BRANCH"]
                  and run.get("path") == ".github/workflows/aerove-lite.yaml"
                  and run.get("status") == "completed" and run.get("conclusion") == "failure"
                  and run.get("repository", {}).get("full_name") == repo,
                  "Original Lite265 producer run identity/conclusion mismatch")

          jobs_payload = api(f"repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100")
          jobs = jobs_payload.get("jobs")
          require(isinstance(jobs, list) and jobs_payload.get("total_count") == len(jobs),
                  "Original producer job API listing is incomplete")
          producer_jobs = {
              127401476340: "build (arm64-v8a) / package",
              127401036780: "build (x86_64) / package",
              127396763516: "build (arm64-v8a) / rust",
              127396763933: "build (arm64-v8a) / helper",
              127396763976: "build (x86_64) / rust",
              127396763696: "build (x86_64) / helper",
          }
          by_job_id = {job.get("id"): job for job in jobs}
          producer_summary = []
          for job_id, name in producer_jobs.items():
              job = by_job_id.get(job_id)
              require(job is not None and job.get("name") == name and job.get("run_id") == run_id
                      and job.get("run_attempt") == attempt and job.get("head_sha") == source
                      and job.get("status") == "completed" and job.get("conclusion") == "success",
                      f"Original producer job mismatch: {job_id}")
              producer_summary.append({"jobId": job_id, "name": name, "conclusion": "success"})

          listing = api(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")
          rows = listing.get("artifacts")
          require(isinstance(rows, list) and listing.get("total_count") == len(rows),
                  "Runtime artifact API listing is incomplete")
          matches = [row for row in rows if row.get("id") == artifact_id]
          require(len(matches) == 1, "Expected exactly one pinned runtime-contract artifact")
          row = matches[0]
          for key, value in expected_artifact.items():
              require(row.get(key) == value, f"Runtime artifact {key} mismatch")
          require(row.get("expired") is False and row.get("workflow_run", {}).get("id") == run_id
                  and row.get("workflow_run", {}).get("head_sha") == source,
                  "Runtime artifact source/expiry binding mismatch")
          detail = api(f"repos/{repo}/actions/artifacts/{artifact_id}")
          for key, value in expected_artifact.items():
              require(detail.get(key) == value, f"Runtime artifact detail {key} mismatch")

          try:
              with archive_path.open("wb") as output:
                  result = subprocess.run(
                      ["gh", "api", f"repos/{repo}/actions/artifacts/{artifact_id}/zip"],
                      stdout=output, stderr=subprocess.PIPE, timeout=300, check=False)
          except subprocess.TimeoutExpired:
              archive_path.unlink(missing_ok=True)
              raise SystemExit("Pinned runtime artifact transport timed out") from None
          if result.returncode:
              archive_path.unlink(missing_ok=True)
              raise SystemExit(f"Pinned runtime artifact transport failed (exit {result.returncode})")
          archive_bytes = archive_path.read_bytes()
          archive_sha = sha(archive_bytes)
          require(len(archive_bytes) == expected_artifact["size_in_bytes"]
                  and archive_sha == os.environ["RUNTIME_ARTIFACT_SHA256"],
                  "Pinned runtime artifact ZIP size/SHA-256 mismatch")

          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]
              require(names and len(names) == len(set(names)), "Empty or duplicate runtime archive paths")
              require(sum(item.file_size for item in infos) <= 512 * 1024 * 1024,
                      "Runtime artifact exceeds the 512 MiB uncompressed inspection bound")
              for item in infos:
                  posix = PurePosixPath(item.filename)
                  windows = PureWindowsPath(item.filename)
                  mode = item.external_attr >> 16
                  require(not posix.is_absolute() and not windows.is_absolute() and not windows.drive
                          and ".." not in posix.parts and "\\" not in item.filename and posix.parts,
                          "Unsafe runtime artifact path")
                  file_type = mode & 0o170000
                  require(file_type != 0o120000 and (not mode or file_type in (0o100000, 0o040000)),
                          "Runtime artifact contains a non-regular entry")
              require(archive.testzip() is None, "Runtime artifact ZIP CRC failure")
              files = {item.filename: item for item in infos if not item.is_dir()}
              manifest_info = files.get("source-manifest.json")
              sums_info = files.get("SHA256SUMS")
              require(manifest_info is not None and sums_info is not None,
                      "Runtime artifact lacks its manifest or checksum list")
              manifest_bytes = archive.read(manifest_info)
              require(sha(manifest_bytes) == os.environ["SOURCE_MANIFEST_SHA256"],
                      "Runtime source-manifest SHA-256 mismatch")
              source_manifest = json.loads(manifest_bytes.decode("utf-8", errors="strict"))
              require(source_manifest.get("sourceRevision") == source
                      and source_manifest.get("sourceTree") == tree
                      and str(source_manifest.get("workflowRun")) == str(run_id)
                      and source_manifest.get("runNumber") == 265
                      and source_manifest.get("runAttempt") == attempt
                      and source_manifest.get("abi") == "x86_64"
                      and source_manifest.get("prebuiltApks") is True
                      and source_manifest.get("apkInspectorOutcome") == "success",
                      "Runtime source-manifest source/tree/run/ABI/inspection binding mismatch")
              source_files = source_manifest.get("files")
              require(isinstance(source_files, list) and source_files,
                      "Runtime source-manifest file list is missing")
              manifest_by_name = {}
              for item in source_files:
                  path = item.get("path")
                  posix = PurePosixPath(str(path))
                  windows = PureWindowsPath(str(path))
                  require(isinstance(path, str) and path not in manifest_by_name
                          and not posix.is_absolute() and not windows.is_absolute() and not windows.drive
                          and ".." not in posix.parts and "\\" not in path and str(posix) == path
                          and type(item.get("bytes")) is int and item["bytes"] >= 0
                          and re.fullmatch(r"[0-9a-f]{64}", str(item.get("sha256", ""))) is not None,
                          "Runtime source-manifest file row is invalid")
                  manifest_by_name[path] = item
              require(set(files) == set(manifest_by_name) | {"source-manifest.json", "SHA256SUMS"},
                      "Runtime archive file set differs from its source manifest")
              for path, item in manifest_by_name.items():
                  info = files[path]
                  h = hashlib.sha256()
                  count = 0
                  with archive.open(info) as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          h.update(chunk)
                          count += len(chunk)
                  require(count == item["bytes"] and h.hexdigest() == item["sha256"],
                          f"Runtime manifest payload hash/size mismatch: {path}")
              sums_text = archive.read(sums_info).decode("utf-8", errors="strict")
              expected_sums = "".join(f"{item['sha256']}  {item['path']}\n" for item in source_files)
              require(sums_text == expected_sums, "Runtime artifact SHA256SUMS full content mismatch")

              mapping_infos = [(path, info) for path, info in files.items()
                               if PurePosixPath(path).name.casefold().endswith("mapping.txt")]
              require(mapping_infos, "No R8 mapping files found in the verified runtime manifest")
              targets = {"n2", "xy3"}
              found_targets = {name: [] for name in targets}
              mapping_report = []
              class_line = re.compile(r"^([^#\s].*?) -> (\S+):$")
              for path, info in sorted(mapping_infos):
                  data = archive.read(info)
                  require(len(data) == manifest_by_name[path]["bytes"]
                          and sha(data) == manifest_by_name[path]["sha256"],
                          f"Mapping file differs from source manifest: {path}")
                  text = data.decode("utf-8", errors="replace")
                  lines = text.splitlines()
                  first_class = next((index for index, line in enumerate(lines) if class_line.match(line)), len(lines))
                  headers = [redact(line) for line in lines[:first_class]
                             if "compiler" in line.casefold() or "pg_map_id" in line.casefold()]
                  blocks = []
                  current = None
                  for line_number, line in enumerate(lines, start=1):
                      match = class_line.match(line)
                      if match:
                          if current is not None:
                              blocks.append(current)
                          obfuscated = match.group(2)
                          current = ({"obfuscatedClass": obfuscated, "startLine": line_number,
                                      "lines": [{"line": line_number, "text": redact(line)}]}
                                     if obfuscated in targets else None)
                      elif current is not None:
                          current["lines"].append({"line": line_number, "text": redact(line)})
                  if current is not None:
                      blocks.append(current)
                  target_blocks = [block for block in blocks if block["obfuscatedClass"] in targets]
                  for block in target_blocks:
                      block["path"] = path
                      block["endLine"] = block["lines"][-1]["line"]
                      found_targets[block["obfuscatedClass"]].append(block)
                  mapping_report.append({"path": path, "bytes": len(data),
                                         "sha256": manifest_by_name[path]["sha256"], "headers": headers,
                                         "targetBlocks": target_blocks})

              require(all(found_targets[name] for name in targets),
                      "One or more requested obfuscated R8 classes are absent from verified mappings")
              apk_rows = []
              for path, item in sorted(manifest_by_name.items()):
                  if PurePosixPath(path).suffix.casefold() == ".apk":
                      apk_rows.append({"path": path, "bytes": item["bytes"], "sha256": item["sha256"]})
              x86_app = [item for item in apk_rows if item["path"] == "apks/app-release.apk"]
              x86_test = [item for item in apk_rows if item["path"] == "apks/app-release-androidTest.apk"]
              require(len(x86_app) == 1 and x86_app[0]["sha256"] ==
                      "07b9482e3ba7227c4746b11ea55b6eac7c64fe51a1355276686b791fbb14a1cb"
                      and len(x86_test) == 1 and x86_test[0]["sha256"] == '8abed1e675d6c0e10b1c530b38f0bf26689ed80f65f759390b6d1d614da03ec7',
                      "Runtime APK manifest entry hash identity mismatch")
              report = {
                  "role": "evidenceReadback", "accepted": False, "compiled": False,
                  "originalRun": {"id": run_id, "attempt": attempt, "runNumber": 265,
                                  "source": source, "tree": tree, "branch": run.get("head_branch"),
                                  "conclusion": run.get("conclusion")},
                  "producerJobs": producer_summary,
                  "runtimeArtifact": {"id": artifact_id, "name": row["name"],
                                      "bytes": row["size_in_bytes"], "sha256": archive_sha,
                                      "uncompressedBytes": sum(item.file_size for item in infos),
                                      "sourceManifestSha256": sha(manifest_bytes)},
                  "apkManifestEntries": apk_rows,
                  "r8Mappings": mapping_report,
              }
              encoded = json.dumps(report, ensure_ascii=False, separators=(",", ":"))
              require(len(encoded.encode("utf-8")) < 200 * 1024,
                      "R8 mapping evidence exceeds the 200 KiB stdout limit")
              print(encoded, flush=True)
          PY
