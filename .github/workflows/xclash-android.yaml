name: Std140 inspection only - no build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}

jobs:
  inspect-original140:
    name: Read original Std140 identity only
    if: ${{ github.repository == 'IvanSolis1989/Aerove' && github.ref == 'refs/heads/codex/standard140-integrity-recheck' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0b938396afbda83efef427a0b401d0682a404c93
          persist-credentials: false
          fetch-depth: 1
      - name: Read fixed archives without accepting or building the application
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import stat
          import subprocess
          import sys
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / 'apps/aerove'))
          from tool import aerove_artifact as original

          repository = 'IvanSolis1989/Aerove'
          source = '0b938396afbda83efef427a0b401d0682a404c93'
          tree = 'a5782454e82b65577b639194169ef76e278ef342'
          run_id = 42040809724
          signer = '0fc82c3b7b089b6244d9ed167b352ff76185417d07689853caca286fbdeb6e60'
          work = Path(os.environ['RUNNER_TEMP']) / 'std140-readback'
          work.mkdir()

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def command(args, target=None):
              try:
                  result = subprocess.run(args, stdout=target or subprocess.PIPE,
                                          stderr=subprocess.PIPE, timeout=180)
              except subprocess.TimeoutExpired as error:
                  raise RuntimeError(f'{args[0]} read timed out after 180 seconds') from error
              if result.returncode:
                  detail = result.stderr.decode('utf-8', errors='replace')
                  detail = re.sub(r'https?://\S+', '[URL redacted]', detail)
                  token = os.environ.get('GH_TOKEN', '')
                  if token:
                      detail = detail.replace(token, '[token redacted]')
                  raise RuntimeError(f'{args[0]} failed ({result.returncode}): {detail}')
              return result.stdout

          def api(endpoint):
              return original._json(command(['gh', 'api', '--method', 'GET',
                  f'repos/{repository}/{endpoint}', '-H', 'Accept: application/vnd.github+json',
                  '-H', 'X-GitHub-Api-Version: 2022-11-28']).decode())

          require(command(['git', 'rev-parse', 'HEAD']).decode().strip() == source,
                  'Checkout source mismatch')
          require(command(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip() == tree,
                  'Checkout tree mismatch')
          run = api(f'actions/runs/{run_id}')
          original._run_identity(repository, run, source)
          require((run['id'], run['run_number'], run['run_attempt'], run['status'], run['conclusion'])
                  == (run_id, 140, 1, 'completed', 'failure'), 'Original terminal identity changed')
          response = api(f'actions/runs/{run_id}/attempts/1/jobs?per_page=100')
          jobs = response['jobs']
          require(response['total_count'] == len(jobs) and len({j['id'] for j in jobs}) == len(jobs),
                  'Incomplete or duplicate original job list')
          pins = {
              'prep': dict(id=127291007912, started_at='2026-11-05T14:00:36Z',
                           completed_at='2026-11-05T14:03:52Z'),
              'apk': dict(id=127292807887, started_at='2026-11-05T14:03:55Z',
                          completed_at='2026-11-05T14:13:19Z'),
          }
          for name, pin in pins.items():
              matches = [j for j in jobs if j['name'] == name]
              require(len(matches) == 1, f'Original producer count mismatch: {name}')
              job = matches[0]
              require(all(job.get(k) == v for k, v in pin.items())
                      and (job.get('run_id'), job.get('head_sha'), job.get('run_attempt'),
                           job.get('status'), job.get('conclusion'))
                      == (run_id, source, 1, 'completed', 'success'), f'Producer identity mismatch: {name}')
          for name, job_id in [('regressions (regression-software 2)', 127293990774),
                               ('verify', 127299367972)]:
              matches = [j for j in jobs if j['name'] == name]
              require(len(matches) == 1 and matches[0]['id'] == job_id
                      and matches[0]['run_attempt'] == 1 and matches[0]['head_sha'] == source
                      and matches[0]['run_id'] == run_id and matches[0]['status'] == 'completed'
                      and matches[0]['conclusion'] == 'failure', 'Original failure evidence changed')

          specifications = [
              ('Aerove-android-arm64', 13423896234, 65423786,
               '559398a14dac923915ece388411a1215cac2c1ddf643e962880d3aaf4259e032',
               '2026-11-05T14:13:13Z', 'apk',
               {'Aerove-android-arm64.apk', 'BUILD_INFO.json', 'SHA256SUMS'}),
              ('xclash-generated', 13422290853, 341,
               '6795cb04adf22dad115fb04ea830b4a75b1f4d82d414cb8a82510d3ffe4bc803',
               '2026-11-05T14:03:46Z', 'prep',
               {'xclash-generated.patch', 'xclash-verified-tree.txt'}),
          ]
          archive_records = []
          payload_records = {}
          for name, artifact_id, size, digest, created_at, producer, expected in specifications:
              item = api(f'actions/artifacts/{artifact_id}')
              require((item.get('id'), item.get('name'), item.get('size_in_bytes'), item.get('digest'),
                       item.get('created_at'), item.get('expired'))
                      == (artifact_id, name, size, 'sha256:' + digest, created_at, False),
                      f'Artifact metadata mismatch: {name}')
              provenance = item.get('workflow_run', {})
              require(provenance.get('id') == run_id and provenance.get('head_sha') == source,
                      'Artifact run/source provenance mismatch')
              stamps = [datetime.fromisoformat(value.replace('Z', '+00:00')) for value in
                        (pins[producer]['started_at'], created_at, pins[producer]['completed_at'])]
              require(all(s.tzinfo is not None and s.utcoffset() == timezone.utc.utcoffset(s) for s in stamps)
                      and stamps[0] <= stamps[1] <= stamps[2], 'Artifact producer time mismatch')
              archive = work / f'{artifact_id}.zip'
              with archive.open('xb') as output:
                  command(['gh', 'api', f'repos/{repository}/actions/artifacts/{artifact_id}/zip'], output)
              require(archive.stat().st_size == size and original._digest(archive) == digest,
                      'Downloaded archive size/digest mismatch')
              destination = work / name
              destination.mkdir()
              with zipfile.ZipFile(archive) as bundle:
                  entries = bundle.infolist()
                  require(len(entries) == len(expected) and {e.filename for e in entries} == expected,
                          'Archive must contain exactly the unique expected flat files')
                  require(all(not e.is_dir() and not e.flag_bits & 1
                              and stat.S_IFMT(e.external_attr >> 16) in (0, stat.S_IFREG)
                              and e.file_size <= 100 * 1024 * 1024 for e in entries),
                          'Archive contains unsupported entries or oversized payloads')
                  require(bundle.testzip() is None, 'Archive CRC mismatch')
                  for entry in entries:
                      with bundle.open(entry) as incoming, (destination / entry.filename).open('xb') as output:
                          shutil.copyfileobj(incoming, output)
                      path = destination / entry.filename
                      payload_records[entry.filename] = dict(bytes=path.stat().st_size,
                                                            sha256=original._digest(path))
              archive_records.append(dict(id=artifact_id, name=name, bytes=size, sha256=digest,
                                          created_at=created_at, producer=dict(name=producer, attempt=1,
                                                                              **pins[producer])))

          product = work / 'Aerove-android-arm64'
          generated = work / 'xclash-generated'
          identity = original.validate_artifacts(directory=product, generated_directory=generated,
              source=source, tree=tree, repository=repository, run_id=run_id, run_number=140,
              metadata=root / 'apps/aerove/tool/upstream-version.json',
              pubspec=root / 'apps/aerove/pubspec.yaml')
          info = original._json((product / 'BUILD_INFO.json').read_text())
          require(identity == '0.13.0+2026102340' and info['appEnv'] == 'stable',
                  'Original is not the requested stable product identity')

          log = command(['gh', 'api', f'repos/{repository}/actions/jobs/127292807887/logs']).decode('utf-8')
          lines = [re.sub(r'^\S+Z\s+', '', line).strip() for line in log.splitlines()]
          certificates = [line for line in lines if re.match(r'^(?:Signer |V2 Signer:)', line)
                          and 'certificate SHA-256 digest:' in line]
          original._verify_original_signer('\n'.join(certificates), signer)
          package_prefix = "package: name='com.follow.clash.dev' versionCode='2026102340' versionName='0.13.0' "
          packages = [line for line in lines if line.startswith(package_prefix)]
          require(len(packages) == 1, 'Original SDK package/version output missing or ambiguous')
          report = dict(schema=1, role='originalArtifactReadback', accepted=False, compiled=False,
              appApkBuilt=False, fullCiAccepted=False, repository=repository,
              originalBuild=dict(source=source, tree=tree, run_id=run_id, run_number=140,
                                 run_attempt=1, conclusion='failure', info=info),
              archives=archive_records, payloads=payload_records,
              signature=dict(sha256=signer, evidence='Original CI SDK output; no SDK executed by this inspection',
                             producer_job_id=127292807887, producer_attempt=1,
                             certificate_records=certificates, package_record=packages[0]),
              inspection=dict(run_id=os.environ['GITHUB_RUN_ID'],
                              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                              workflow_source=os.environ['GITHUB_SHA']))
          output = work / 'report'
          output.mkdir()
          (output / 'original140-readback.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Original Std140 identity read back. Inspection only; full CI remains unaccepted.')
          PY
      - name: Upload identity JSON only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: std140-original-identity-inspection-only
          path: ${{ runner.temp }}/std140-readback/report/original140-readback.json
          if-no-files-found: error
          retention-days: 7
