name: Standard140 byte transfer only (no build)
run-name: Standard140 byte transfer only (no build)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}

jobs:
  prepare_and_upload:
    name: Standard140 byte transfer only (no build)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'IvanSolis1989/Aerove' &&
      github.repository_owner == 'IvanSolis1989' &&
      github.actor == 'IvanSolis1989' &&
      github.ref == 'refs/heads/codex/standard140-byte-transfer'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: '42040809724'
      ORIGINAL_ATTEMPT: '1'
      ORIGINAL_SOURCE: '0b938396afbda83efef427a0b401d0682a404c93'
      EXPECTED_TREE: 'a5782454e82b65577b639194169ef76e278ef342'
      ORIGINAL_ARTIFACT_ID: '13423896234'
      ORIGINAL_ARTIFACT_NAME: 'Aerove-android-arm64'
      ORIGINAL_ARTIFACT_BYTES: '65423786'
      ORIGINAL_ARTIFACT_SHA256: '559398a14dac923915ece388411a1215cac2c1ddf643e962880d3aaf4259e032'
      APK_NAME: 'Aerove-android-arm64.apk'
      APK_BYTES: '67280131'
      APK_SHA256: 'da6d4c34ede0ea4829528e5d49b0783382f3318ad4957ca19e29240dbe373faa'
      BUILD_INFO_BYTES: '646'
      BUILD_INFO_SHA256: 'c3baa18541c1f48dc2b57f588275ed6182b961d88ec8937233d20a2a01f0a08b'
      SHA256SUMS_BYTES: '173'
      SHA256SUMS_SHA256: 'dcb7c9274ff5947a321fd89eae502fdb9828ca3b2ee97fc8fe613e7ffbf37483'
      PART_BYTES: '2097152'
    steps:
      - name: Checkout immutable Standard140 source identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0b938396afbda83efef427a0b401d0682a404c93
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Verify and split original APK bytes without rebuilding
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath, PureWindowsPath
          import re
          import subprocess
          import zipfile

          repo = "IvanSolis1989/Aerove"
          run_id = int(os.environ["ORIGINAL_RUN"])
          attempt = int(os.environ["ORIGINAL_ATTEMPT"])
          source = os.environ["ORIGINAL_SOURCE"]
          tree = os.environ["EXPECTED_TREE"]
          root = Path(os.environ["RUNNER_TEMP"]) / "standard140-byte-transfer"
          parts_dir = root / "parts"
          parts_dir.mkdir(parents=True)

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def gh_json(route):
              result = subprocess.run(["gh", "api", route], check=True, capture_output=True,
                                      text=True, timeout=90)
              return json.loads(result.stdout)

          def gh_archive(artifact_id, destination):
              try:
                  with destination.open("wb") as output:
                      subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{artifact_id}/zip"],
                                     stdout=output, stderr=subprocess.PIPE, check=True, timeout=300)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                  destination.unlink(missing_ok=True)
                  raw = getattr(error, "stderr", b"") or b""
                  message = raw.decode(errors="replace") if isinstance(raw, bytes) else raw
                  message = re.sub(r"https?://[^\s\"']+", "<URL redacted>", message)
                  message = re.sub(r"(?i)(token|authorization|password|secret)=\S+", r"\1=<redacted>", message)
                  raise SystemExit(f"Original artifact transfer failed: {message[:1200]}") from None

          def sha_file(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          require(subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
                  and subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip() == tree,
                  "Immutable source/tree checkout mismatch")
          original_run = gh_json(f"repos/{repo}/actions/runs/{run_id}")
          require(original_run.get("id") == run_id and original_run.get("run_attempt") == attempt
                  and original_run.get("head_sha") == source and original_run.get("status") == "completed"
                  and original_run.get("conclusion") == "failure"
                  and original_run.get("repository", {}).get("full_name") == repo,
                  "Original Standard140 run identity/conclusion mismatch")
          listing = gh_json(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")
          rows = listing.get("artifacts")
          require(isinstance(rows, list) and listing.get("total_count") == len(rows),
                  "Artifact API listing is incomplete")
          matches = [row for row in rows if row.get("id") == int(os.environ["ORIGINAL_ARTIFACT_ID"])]
          require(len(matches) == 1, "Expected exactly one fixed original APK artifact")
          row = matches[0]
          expected_digest = "sha256:" + os.environ["ORIGINAL_ARTIFACT_SHA256"]
          require(row.get("name") == os.environ["ORIGINAL_ARTIFACT_NAME"]
                  and row.get("size_in_bytes") == int(os.environ["ORIGINAL_ARTIFACT_BYTES"])
                  and row.get("digest") == expected_digest and row.get("expired") is False
                  and row.get("workflow_run", {}).get("id") == run_id
                  and row.get("workflow_run", {}).get("head_sha") == source,
                  "Original APK artifact API identity/size/digest mismatch")
          detail = gh_json(f"repos/{repo}/actions/artifacts/{row['id']}")
          for key in ("id", "name", "size_in_bytes", "digest", "expired"):
              require(detail.get(key) == row.get(key), "Artifact detail/list metadata mismatch")

          archive_path = root / "original-artifact.zip"
          gh_archive(row["id"], archive_path)
          require(archive_path.stat().st_size == int(os.environ["ORIGINAL_ARTIFACT_BYTES"])
                  and sha_file(archive_path) == os.environ["ORIGINAL_ARTIFACT_SHA256"],
                  "Original artifact ZIP byte size/SHA-256 mismatch")
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]
              require(names and len(names) == len(set(names)), "Empty or duplicate paths in original ZIP")
              require(sum(item.file_size for item in infos) <= 100 * 1024 * 1024,
                      "Original artifact exceeds the bounded uncompressed size")
              for item in infos:
                  posix = PurePosixPath(item.filename)
                  windows = PureWindowsPath(item.filename)
                  mode = item.external_attr >> 16
                  require(not posix.is_absolute() and not windows.is_absolute() and not windows.drive
                          and ".." not in posix.parts and "\\" not in item.filename and posix.parts,
                          "Unsafe path in original artifact ZIP")
                  file_type = mode & 0o170000
                  require(not (file_type == 0o120000)
                          and (not mode or file_type in (0o100000, 0o040000)),
                          "Non-regular entry in original artifact ZIP")
              require(archive.testzip() is None, "Original artifact ZIP CRC failure")
              files = {item.filename: item for item in infos if not item.is_dir()}
              apk_name = os.environ["APK_NAME"]
              require(set(files) == {apk_name, "BUILD_INFO.json", "SHA256SUMS"},
                      "Unexpected original artifact file set")
              build_info_bytes = archive.read(files["BUILD_INFO.json"])
              sums_bytes = archive.read(files["SHA256SUMS"])
              require(len(build_info_bytes) == int(os.environ["BUILD_INFO_BYTES"])
                      and hashlib.sha256(build_info_bytes).hexdigest() == os.environ["BUILD_INFO_SHA256"],
                      "Original BUILD_INFO size/SHA-256 mismatch")
              require(len(sums_bytes) == int(os.environ["SHA256SUMS_BYTES"])
                      and hashlib.sha256(sums_bytes).hexdigest() == os.environ["SHA256SUMS_SHA256"],
                      "Original SHA256SUMS size/SHA-256 mismatch")
              build_info = json.loads(build_info_bytes)
              require(build_info.get("source") == source and build_info.get("version") == "0.13.0+2026102340"
                      and build_info.get("appEnv") == "stable"
                      and build_info.get("applicationId") == "com.follow.clash.dev"
                      and build_info.get("workflow") == f"https://github.com/{repo}/actions/runs/{run_id}",
                      "Original BUILD_INFO source/version/package/workflow binding mismatch")
              apk_info = files[apk_name]
              require(apk_info.file_size == int(os.environ["APK_BYTES"]), "Original APK entry size mismatch")
              sums_text = sums_bytes.decode("utf-8")
              expected_sums = (f"{os.environ['APK_SHA256']}  {apk_name}\n"
                               f"{os.environ['BUILD_INFO_SHA256']}  BUILD_INFO.json\n")
              require(sums_text == expected_sums, "Original SHA256SUMS content mismatch")
              apk_hash = hashlib.sha256()
              total_apk_bytes = 0
              chunk_size = int(os.environ["PART_BYTES"])
              parts = []
              with archive.open(apk_info) as source_apk:
                  index = 0
                  offset = 0
                  while True:
                      chunk = source_apk.read(chunk_size)
                      if not chunk:
                          break
                      part_name = f"part-{index:02d}.bin"
                      part_path = parts_dir / part_name
                      part_path.write_bytes(chunk)
                      part_hash = hashlib.sha256(chunk).hexdigest()
                      parts.append({"index": index, "artifactName": f"Std140-original-byte-part-{index:02d}-attempt-1",
                                    "fileName": part_name, "offset": offset, "length": len(chunk),
                                    "sha256": part_hash})
                      apk_hash.update(chunk)
                      total_apk_bytes += len(chunk)
                      offset += len(chunk)
                      index += 1
              require(total_apk_bytes == int(os.environ["APK_BYTES"])
                      and apk_hash.hexdigest() == os.environ["APK_SHA256"],
                      "Reassembled original APK stream does not match the pinned source APK hash")
              require(len(parts) == 33 and parts[-1]["length"] == 171267
                      and all(part["length"] == chunk_size for part in parts[:-1]),
                      "Unexpected 2 MiB segmentation geometry")
              manifest = {
                  "role": "byteTransferOnly", "accepted": False, "compiled": False,
                  "fullCiAccepted": False, "appApkBuilt": False, "published": False,
                  "repository": repo,
                  "transfer": {"runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                               "workflowSource": os.environ["GITHUB_SHA"]},
                  "original": {"runId": run_id, "runAttempt": attempt, "source": source, "tree": tree,
                               "runConclusion": "failure", "artifactId": row["id"], "artifactName": row["name"],
                               "artifactBytes": row["size_in_bytes"], "artifactSha256": os.environ["ORIGINAL_ARTIFACT_SHA256"]},
                  "apk": {"fileName": apk_name, "bytes": total_apk_bytes, "sha256": apk_hash.hexdigest(),
                          "parts": parts},
                  "buildInfo": build_info,
                  "sha256Sums": sums_text,
                  "buildInfoBytes": len(build_info_bytes), "buildInfoSha256": hashlib.sha256(build_info_bytes).hexdigest(),
                  "sha256SumsBytes": len(sums_bytes), "sha256SumsFileSha256": hashlib.sha256(sums_bytes).hexdigest(),
                  "reassembly": "Concatenate part files in ascending index order; verify each part hash and final APK SHA-256."
              }
              (root / "manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
              require((root / "manifest.json").stat().st_size < 100_000, "Transfer manifest unexpectedly large")
          print(f"Prepared {len(parts)} immutable APK byte segments; no build or acceptance performed.")
          PY

      - name: Upload original APK bytes 00 of 33
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Std140-original-byte-part-00-attempt-1
          path: ${{ runner.temp }}/standard140-byte-transfer/parts/part-00.bin
