name: Aerove Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README*.md'
      - AGENTS.md
      - CLAUDE.md
      - CHANGELOG.md
      - 'docs/**'
      - 'snapshots/**'
      - '.agents/**/*.md'
  workflow_dispatch:
    inputs:
      prepare_sources:
        description: Allow regenerated sources and formatting in the exported patch
        type: boolean
        default: false
      build_apk:
        description: Build the Android arm64 APK after verification
        type: boolean
        default: true
      publish_release:
        description: Publish the verified APK to Aerove Releases
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: xclash-android-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check fork download links
        env:
          REPOSITORY: ${{ github.repository }}
        run: python3 tool/sync_fork_readme.py --repository "$REPOSITORY" --check
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Test repository commit hooks
        run: bash tool/hooks/test.sh
      - name: Test upstream version selection
        run: python3 -m unittest tool.test_xclash_version -v
      - name: Generate and format sources
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/xclash-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/xclash-pubspec.yaml" pubspec.yaml' EXIT
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
          dart run intl_utils:generate
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test
          cp "$RUNNER_TEMP/xclash-pubspec.yaml" pubspec.yaml
          git add -- lib test
          git diff --cached --binary -- lib test > "$RUNNER_TEMP/xclash-generated.patch"
          git write-tree > "$RUNNER_TEMP/xclash-verified-tree.txt"
          git restore --staged -- lib test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xclash-generated
          path: |
            ${{ runner.temp }}/xclash-generated.patch
            ${{ runner.temp }}/xclash-verified-tree.txt
      - name: Require committed generated sources
        if: ${{ !inputs.prepare_sources }}
        run: test "$(cat "$RUNNER_TEMP/xclash-verified-tree.txt")" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Analyze
        id: analyze
        run: flutter analyze --no-fatal-infos
      - name: Install preview font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - uses: actions/cache/restore@v4
        id: device_font_cache
        with:
          path: ${{ runner.temp }}/misans-fixture
          key: misans-vf-4.009-0ddef90648998900175cfdca9a6f087a2544c182f130b0ad4f7e94a03a115e79
      - name: Prepare device font regression fixture
        id: device_font
        run: |
          python3 - "$RUNNER_TEMP/misans-fixture" <<'PY'
          from pathlib import Path
          import hashlib, struct, sys, time, urllib.parse, urllib.request, zlib
          output = Path(sys.argv[1])
          output.mkdir(parents=True, exist_ok=True)
          font_hash = '0ddef90648998900175cfdca9a6f087a2544c182f130b0ad4f7e94a03a115e79'
          license_hash = '4a93a27cd2bd81b3b5ecfd0a853144a876fa26938a93a68443c67d74172fcb86'
          if all(path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == expected
                 for path, expected in [(output / 'MiSansVF.ttf', font_hash),
                                        (output / 'MiSans-license.pdf', license_hash)]):
              print('Verified cached MiSans font and license')
              sys.exit(0)
          first, last = 213458452, 227869191
          request = urllib.request.Request(
              'https://hyperos.mi.com/font-download/MiSans.zip',
              headers={'Range': f'bytes={first}-{last}', 'User-Agent': 'Mozilla/5.0'})
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      assert response.status == 206
                      assert response.headers.get('Content-Range') == f'bytes {first}-{last}/227880072'
                      data = response.read(last - first + 2)
                  assert len(data) == last - first + 1, f'Range body: {len(data)} bytes, expected {last-first+1}'
                  break
              except Exception as error:
                  print(f'MiSans range attempt {attempt + 1}: {error}', flush=True)
                  if attempt == 2:
                      raise
                  time.sleep(attempt + 1)
          header = struct.unpack_from('<4s5H3L2H', data)
          assert header[0] == b'PK\x03\x04' and header[3] == 8 and not header[2] & 1
          assert data[30:30 + header[9]].endswith(b'/MiSansVF.ttf')
          start = 30 + header[9] + header[10]
          font = zlib.decompress(data[start:start + 14410630], -15)
          assert len(font) == 20093424 and zlib.crc32(font) & 0xffffffff == 3747145830
          assert hashlib.sha256(font).hexdigest() == font_hash
          (output / 'MiSansVF.ttf').write_bytes(font)
          license_url = 'https://hyperos.mi.com/font-download/' + urllib.parse.quote('MiSans字体知识产权许可协议.pdf')
          with urllib.request.urlopen(license_url, timeout=30) as response:
              license_data = response.read(1000000)
          assert hashlib.sha256(license_data).hexdigest() == license_hash
          (output / 'MiSans-license.pdf').write_bytes(license_data)
          PY
          echo "XCLASH_MISANS_FONT=$RUNNER_TEMP/misans-fixture/MiSansVF.ttf" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.device_font.outcome == 'success' && steps.device_font_cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/misans-fixture
          key: misans-vf-4.009-0ddef90648998900175cfdca9a6f087a2544c182f130b0ad4f7e94a03a115e79
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
      - name: Verify luminous ink rendering
        env:
          XCLASH_REQUIRE_IMPELLER: 'true'
          XCLASH_SCREENSHOT_DIR: ${{ runner.temp }}/xclash-previews/ink-probe
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/ink-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/ink-pubspec.yaml" pubspec.yaml' EXIT
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
          flutter test --enable-impeller --reporter expanded test/widgets/glass_foreground_test.dart test/widgets/target_icon_test.dart test/widgets/selection_mark_test.dart test/widgets/loading_ink_test.dart test/widgets/core_status_button_test.dart
      - name: Verify feather blend pixels
        id: feather
        env:
          XCLASH_REQUIRE_IMPELLER: 'true'
          XCLASH_SCREENSHOT_DIR: ${{ runner.temp }}/xclash-previews/feather
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/feather-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/feather-pubspec.yaml" pubspec.yaml' EXIT
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
          flutter test --enable-impeller --reporter expanded test/widgets/header_blur_occlusion_test.dart test/widgets/header_blur_test.dart
          XCLASH_REQUIRE_IMPELLER=false XCLASH_SCREENSHOT_DIR="$XCLASH_SCREENSHOT_DIR/software" flutter test --reporter expanded test/widgets/header_blur_occlusion_test.dart test/widgets/header_blur_test.dart
      - name: Upload feather blend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xclash-feather
          path: ${{ runner.temp }}/xclash-previews/feather
          if-no-files-found: ignore
      - name: Verify reported UI regressions
        id: reported
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        env:
          XCLASH_REQUIRE_IMPELLER: 'true'
          XCLASH_SCREENSHOT_DIR: ${{ runner.temp }}/xclash-previews/reported
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/reported-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/reported-pubspec.yaml" pubspec.yaml' EXIT
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
          tests=(test/widgets/aurora_activity_test.dart test/widgets/aurora_motion_test.dart test/widgets/aurora_lifecycle_test.dart test/widgets/theme_cross_fade_test.dart test/widgets/subscription_usage_fill_test.dart test/widgets/dashboard_text_bounds_test.dart test/widgets/proxies_scroll_work_test.dart test/widgets/sheet_occlusion_test.dart test/widgets/sheet_surface_render_test.dart test/views/dashboard/foreground_test.dart test/views/dashboard/traffic_test.dart test/views/aurora_settings_test.dart)
          flutter test --enable-impeller --reporter expanded "${tests[@]}"
          XCLASH_REQUIRE_IMPELLER=false XCLASH_SCREENSHOT_DIR="$XCLASH_SCREENSHOT_DIR/software" flutter test --reporter expanded "${tests[@]}"
      - name: Upload reported regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xclash-reported
          path: ${{ runner.temp }}/xclash-previews/reported
          if-no-files-found: ignore
      - name: Ink performance and transition probes
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.feather.outcome == 'success' && steps.reported.outcome == 'success' }}
        env:
          XCLASH_REQUIRE_IMPELLER: 'true'
          XCLASH_SCREENSHOT_DIR: ${{ runner.temp }}/xclash-previews/performance
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/performance-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/performance-pubspec.yaml" pubspec.yaml' EXIT
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
          flutter test --enable-impeller --reporter expanded \
            test/widgets/ink_motion_baseline_test.dart \
            test/widgets/navigation_dock_ink_test.dart \
            test/widgets/navigation_dock_collapse_test.dart \
            test/pages/home_dock_scroll_test.dart \
            test/pages/home_test.dart \
            test/widgets/aurora_transform_test.dart \
            test/widgets/aurora_motion_test.dart \
            test/widgets/aurora_activity_test.dart \
            test/widgets/aurora_lifecycle_test.dart \
            test/widgets/aurora_text_colors_test.dart \
            test/widgets/glass_ink_cache_test.dart \
            test/widgets/glass_ink_geometry_test.dart \
            test/widgets/dashboard_text_bounds_test.dart \
            test/widgets/shared_text_bounds_test.dart \
            test/widgets/glass_wallpaper_sampling_test.dart \
            test/widgets/source_blur_cache_test.dart \
            test/widgets/sheet_occlusion_test.dart \
            test/widgets/popup_occlusion_test.dart \
            test/widgets/home_first_frame_glass_test.dart \
            test/widgets/liquid_glass_host_test.dart \
            test/widgets/glass_page_handover_test.dart \
            test/widgets/settings_route_transition_test.dart \
            test/widgets/open_container_test.dart \
            test/widgets/theme_cross_fade_test.dart \
            test/widgets/scaffold_actions_test.dart \
            test/widgets/header_title_test.dart \
            test/widgets/core_status_button_test.dart \
            test/widgets/proxy_card_focus_test.dart \
            test/widgets/proxies_list_test.dart \
            test/widgets/proxies_scroll_work_test.dart \
            test/widgets/proxies_tab_test.dart \
            test/widgets/floating_scrollbar_test.dart \
            test/widgets/scrollbar_inset_test.dart \
            test/views/proxies_list_test.dart \
            test/widgets/subscription_usage_fill_test.dart \
            test/views/dashboard/foreground_test.dart \
            test/views/dashboard/traffic_test.dart \
            test/views/dashboard/current_outbound_test.dart \
            test/views/dns_queries_view_test.dart \
            test/common/aurora_rotation_test.dart \
            test/views/aurora_settings_test.dart \
            test/widgets/glass_foreground_test.dart test/widgets/target_icon_test.dart
      - name: Upload focused rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xclash-performance
          path: ${{ runner.temp }}/xclash-previews/performance
          if-no-files-found: ignore
      - name: UI and configuration regressions
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.feather.outcome == 'success' && steps.reported.outcome == 'success' }}
        env:
          XCLASH_SCREENSHOT_DIR: ${{ runner.temp }}/xclash-previews
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/xclash-test-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/xclash-test-pubspec.yaml" pubspec.yaml' EXIT
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('pubspec.yaml')
          text, count = re.subn(
              r'(?m)^(    setup:\s*\n      build_assets: )true(\s*)$',
              r'\g<1>false\2', path.read_text())
          if count != 1:
              raise SystemExit('Expected exactly one enabled setup native hook')
          path.write_text(text)
          PY
          test_status=0
          XCLASH_REQUIRE_IMPELLER=true \
            XCLASH_SCREENSHOT_DIR="$RUNNER_TEMP/xclash-previews/impeller" \
            flutter test --enable-impeller --reporter expanded \
              test/widgets/header_blur_test.dart test/widgets/glass_scroll_test.dart \
              test/widgets/liquid_glass_host_test.dart test/widgets/glass_foreground_test.dart \
              test/widgets/sliver_glass_group_test.dart test/widgets/header_title_test.dart test/widgets/sheet_surface_render_test.dart test/widgets/subscription_usage_fill_test.dart test/views/dashboard/traffic_test.dart \
              test/widgets/aurora_motion_test.dart test/widgets/glass_button_test.dart \
              test/widgets/record_glass_routes_test.dart test/widgets/sidebar_glass_test.dart test/widgets/target_icon_test.dart \
              test/widgets/settings_route_transition_test.dart \
              test/widgets/open_container_test.dart test/widgets/route_motion_hold_test.dart || test_status=1
          flutter test --reporter expanded \
            test/application_theme_test.dart \
            test/features/glass_feature_surfaces_test.dart \
            test/pages/editor_load_test.dart test/pages/scan_test.dart \
            test/models/config_test.dart test/models/dns_override_test.dart test/providers/config_test.dart \
            test/manager/theme_manager_test.dart \
            test/common/preferences_test.dart test/common/dialog_test.dart test/common/tray_menu_test.dart \
            test/common/request_test.dart test/common/path_test.dart test/common/protocol_test.dart \
            test/common/xclash_defaults_test.dart test/common/task_dns_override_test.dart \
            test/common/aurora_test.dart \
            test/common/task_test.dart test/common/migration_test.dart \
            test/providers/profiles_action_test.dart test/providers/backup_action_test.dart \
            test/providers/action_test.dart \
            test/views/aurora_settings_test.dart test/views/theme_test.dart \
            test/views/dns_view_test.dart test/views/scripts_source_test.dart \
            test/views/proxies_list_test.dart test/views/dashboard/ \
            test/views/script_content_test.dart test/pages/home_test.dart \
            test/widgets/ test/l10n/ test/lint/ || test_status=1
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xclash-previews
          path: ${{ runner.temp }}/xclash-previews
          if-no-files-found: ignore

  apk:
    if: ${{ github.event_name == 'push' || inputs.build_apk }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: xclash-generated
          path: ${{ runner.temp }}/xclash-generated
      - name: Apply verified generated sources
        run: |
          patch="$RUNNER_TEMP/xclash-generated/xclash-generated.patch"
          if test -s "$patch"; then git apply "$patch"; fi
          git add -- lib test
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/xclash-generated/xclash-verified-tree.txt")"
          git restore --staged -- lib test
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify recorded upstream release against official refs
        run: |
          git fetch --no-tags --recurse-submodules=no https://github.com/chen08209/FlClash.git \
            '+refs/heads/*:refs/remotes/upstream/*' \
            '+refs/tags/v*:refs/upstream-tags/v*'
      - name: Restore persistent Android test signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XCLASH_ANDROID_DEBUG_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo '::error::Configure XCLASH_ANDROID_DEBUG_KEYSTORE before building.'; exit 1; }
          install -d -m 700 "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Set version for this Android build
        id: version
        run: |
          python3 tool/xclash_version.py release-plan \
            --metadata tool/upstream-version.json \
            --pubspec pubspec.yaml \
            --head "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            > "$RUNNER_TEMP/xclash-version.json"
          plan="$RUNNER_TEMP/xclash-version.json"
          printf 'name=%s\nnumber=%s\ntag=%s\napp_env=%s\n' \
            "$(jq -er .name "$plan")" \
            "$(jq -er .number "$plan")" \
            "$(jq -er .tag "$plan")" \
            "$(jq -er .app_env "$plan")" >> "$GITHUB_OUTPUT"
          printf 'upstream_repository=%s\nupstream_source_commit=%s\n' \
            "$(jq -er .upstream_repository "$plan")" \
            "$(jq -er .upstream_source_commit "$plan")" >> "$GITHUB_OUTPUT"
          printf 'upstream_tag=%s\nupstream_tag_commit=%s\nupstream_pubspec_version=%s\n' \
            "$(jq -er .upstream_tag "$plan")" \
            "$(jq -er .upstream_tag_commit "$plan")" \
            "$(jq -er .upstream_pubspec_version "$plan")" >> "$GITHUB_OUTPUT"
          printf 'upstream_pubspec_source_commit=%s\n' \
            "$(jq -er .upstream_pubspec_source_commit "$plan")" >> "$GITHUB_OUTPUT"
          printf 'upstream_source_branches=%s\n' \
            "$(jq -cer .upstream_source_branches "$plan")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - name: Build Android arm64
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
          APP_ENV: ${{ steps.version.outputs.app_env }}
          UPSTREAM_REPOSITORY: ${{ steps.version.outputs.upstream_repository }}
          UPSTREAM_SOURCE_COMMIT: ${{ steps.version.outputs.upstream_source_commit }}
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
          UPSTREAM_TAG_COMMIT: ${{ steps.version.outputs.upstream_tag_commit }}
          UPSTREAM_PUBSPEC_VERSION: ${{ steps.version.outputs.upstream_pubspec_version }}
          UPSTREAM_PUBSPEC_SOURCE_COMMIT: ${{ steps.version.outputs.upstream_pubspec_source_commit }}
          UPSTREAM_SOURCE_BRANCHES: ${{ steps.version.outputs.upstream_source_branches }}
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --build-name "$VERSION_NAME" --build-number "$VERSION_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Aerove-android-arm64.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs dist/Aerove-android-arm64.apk
          "$build_tools/aapt" dump badging dist/Aerove-android-arm64.apk > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.follow.clash.dev' versionCode='$VERSION_NUMBER' versionName='$VERSION_NAME'" "$RUNNER_TEMP/apk-badging.txt"
          jq -n --arg source "$GITHUB_SHA" --arg version "$VERSION_NAME+$VERSION_NUMBER" \
            --arg app_env "$APP_ENV" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg upstream_repository "$UPSTREAM_REPOSITORY" \
            --arg upstream_source_commit "$UPSTREAM_SOURCE_COMMIT" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg upstream_tag_commit "$UPSTREAM_TAG_COMMIT" \
            --arg upstream_pubspec_version "$UPSTREAM_PUBSPEC_VERSION" \
            --arg upstream_pubspec_source_commit "$UPSTREAM_PUBSPEC_SOURCE_COMMIT" \
            --argjson upstream_source_branches "$UPSTREAM_SOURCE_BRANCHES" \
            '{source: $source, version: $version, appEnv: $app_env, workflow: $run, signing: "persistent Android test key", applicationId: "com.follow.clash.dev", upstream: {repository: $upstream_repository, sourceCommit: $upstream_source_commit, tag: $upstream_tag, tagCommit: $upstream_tag_commit, sourceBranches: $upstream_source_branches, pubspecVersion: $upstream_pubspec_version, pubspecSourceCommit: $upstream_pubspec_source_commit}}' \
            > dist/BUILD_INFO.json
          (cd dist && sha256sum Aerove-android-arm64.apk BUILD_INFO.json > SHA256SUMS)
      - name: Android model and service regressions
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Aerove-android-arm64
          path: dist/

  release:
    if: >-
      github.repository == 'IvanSolis1989/Aerove' && github.ref == 'refs/heads/main' &&
      !inputs.prepare_sources && (github.event_name == 'push' || inputs.publish_release)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Aerove-android-arm64
          path: dist
      - name: Publish verified APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.apk.outputs.tag }}
        run: |
          set -euo pipefail
          check_main_inputs() {
            git fetch --no-tags --recurse-submodules=no origin main
            main=$(git rev-parse FETCH_HEAD)
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "$main"; then
              echo '::error::The build source is no longer an ancestor of main; publication stopped.'
              return 1
            fi
            git diff --no-renames --name-only -z "$GITHUB_SHA" "$main" > "$RUNNER_TEMP/release-main-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/*|snapshots/*|.agents/*.md) continue ;;
                README*.md|AGENTS.md|CLAUDE.md|CHANGELOG.md)
                  if [[ "$path" != */* ]]; then continue; fi ;;
              esac
              printf '::error::main changed an APK input (%q); this build will not replace latest.\n' "$path"
              return 1
            done < "$RUNNER_TEMP/release-main-paths"
          }
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(jq -r .source dist/BUILD_INFO.json)" = "$GITHUB_SHA"
          check_main_inputs
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>/dev/null || true)
          if test -n "$existing"; then
            test "$(jq -r .targetCommitish <<< "$existing")" = "$GITHUB_SHA"
            if test "$(jq -r .isDraft <<< "$existing")" = false; then
              echo 'This release is already published; its assets were preserved.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          {
            printf '# Aerove Android\n\n'
            printf '适用于 Android ARM64，内置随机流体渐变底图与液态玻璃主题。\n\n'
            printf '版本：`%s`\n\n' "$(jq -r .version dist/BUILD_INFO.json)"
            printf '源码：`%s`\n\n构建记录：%s/%s/actions/runs/%s\n\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '使用固定测试签名，包名为 `com.follow.clash.dev`。目标设备上的玻璃效果仍需安装后验收。\n\n'
            printf '下载后可用 `SHA256SUMS` 核对文件完整性；上游版本、源码和构建信息见 `BUILD_INFO.json`。\n'
          } > "$RUNNER_TEMP/xclash-release.md"
          if test -z "$existing"; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Aerove $TAG · 安卓版" --draft --notes-file "$RUNNER_TEMP/xclash-release.md"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            dist/Aerove-android-arm64.apk dist/SHA256SUMS dist/BUILD_INFO.json --clobber
          check_main_inputs
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          printf 'Published APK: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
