name: AEROVE Standard internal x86 QA probe of an existing package (diagnostic only)
run-name: ${{ inputs.evidence_only && format('AEROVE evidence only - Lite147 matrix and runner tools - not a Standard release - controller {0}', github.sha) || (github.event_name == 'workflow_dispatch' && format('AEROVE Standard internal x86 QA probe of artifact {0} from run {1} for formal run {2}', inputs.qa_artifact_id, inputs.qa_run_id, inputs.formal_run_id) || format('AEROVE Standard internal x86 QA probe registration {0} {1}', github.event_name, github.sha)) }}

on:
  push:
    branches: [codex/aerove-lite-meow-app, codex/aerove-standard-host-crash-31]
    paths: [.github/workflows/aerove-standard-x86-qa-probe.yaml]
  workflow_dispatch:
    inputs:
      formal_run_id:
        description: Successful Aerove Android run that defined the reused x86 QA package
        type: string
        required: true
      qa_run_id:
        description: Internal x86 QA run whose first attempt built the package once
        type: string
        required: true
      qa_artifact_id:
        description: The single QA package artifact of that run; it is downloaded and re-verified, never rebuilt
        type: string
        required: true

      evidence_only:
        description: Read fixed Lite147 evidence and existing runner debugger inventory only; no package, emulator or acceptance
        type: boolean
        default: false

      host_crash_observer:
        description: Observe only the owned emulator host in the isolated diagnostic controller; never acceptance
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: standard-internal-x86-qa-probe-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}

jobs:
  probe_existing_qa:
    if: ${{ !inputs.evidence_only && github.repository == 'IvanSolis1989/Aerove' && github.event_name == 'workflow_dispatch' && ((!inputs.host_crash_observer && github.ref == 'refs/heads/codex/aerove-lite-meow-app') || (inputs.host_crash_observer && github.ref == 'refs/heads/codex/aerove-standard-host-crash-31')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HOST_CRASH_OBSERVER: ${{ inputs.host_crash_observer }}
      FORMAL_RUN_ID: ${{ inputs.formal_run_id }}
      QA_RUN_ID: ${{ inputs.qa_run_id }}
      QA_ARTIFACT_ID: ${{ inputs.qa_artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Prepare Ubuntu GDB before any host-observer SDK or QA package work
        if: ${{ inputs.host_crash_observer && !inputs.evidence_only && github.repository == 'IvanSolis1989/Aerove' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/aerove-standard-host-crash-31' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          receipt="$RUNNER_TEMP/standard-x86-qa-render/environment/gdb"
          mkdir -p "$receipt"
          reused_installed=false
          apt_executed=false
          last_completed=workspace-initialized
          finish_prepare() {
            rc=$?
            trap - EXIT
            if [[ -n "${private:-}" && -e "$private/public-keyring-owner.json" ]]; then
              if /usr/bin/timeout --signal=TERM --kill-after=1s 2s /usr/bin/python3 - "$private/public-keyring-owner.json" "$receipt" <<'CLEANUP'
          import json, os, re, stat, sys
          from pathlib import Path

          marker, receipt = map(Path, sys.argv[1:])
          result = dict(role="ownedPublicArchiveKeyringCleanup", status="CHECKING", recursive=False)
          try:
              record_info = marker.lstat()
              if not stat.S_ISREG(record_info.st_mode) or record_info.st_uid != os.getuid() or stat.S_IMODE(record_info.st_mode) != 0o600 or record_info.st_size > 4096:
                  raise ValueError("Public keyring ownership record is not private task data")
              owner = json.loads(marker.read_text())
              directory = Path(owner["path"])
              if not re.fullmatch(r"/tmp/aerove-archive\.[A-Za-z0-9_]+", str(directory)) or owner["uid"] != os.getuid():
                  raise ValueError("Public keyring directory is outside the recorded task scope")
              parent = directory.parent.lstat()
              info = directory.lstat()
              if (not stat.S_ISDIR(parent.st_mode) or parent.st_uid != 0 or stat.S_IMODE(parent.st_mode) != 0o1777
                      or not stat.S_ISDIR(info.st_mode) or info.st_uid != owner["uid"] or info.st_mode & 0o022
                      or (info.st_dev, info.st_ino) != (owner["dev"], owner["ino"])):
                  raise ValueError("Public keyring cleanup directory identity differs")
              entries = list(directory.iterdir())
              if any(entry.name != "verified-ubuntu-archive.gpg" for entry in entries):
                  raise ValueError("Unexpected contents retained in the owned public keyring directory")
              for entry in entries:
                  key = entry.lstat()
                  if not stat.S_ISREG(key.st_mode) or key.st_uid != owner["uid"] or stat.S_IMODE(key.st_mode) != 0o444:
                      raise ValueError("Public keyring cleanup file identity differs")
              for entry in entries:
                  entry.unlink()
              directory.rmdir()
              result.update(status="CLEANED", directory=str(directory), removedFiles=len(entries), directoryRemoved=True)
          except Exception as error:
              result.update(status="FAILED", directoryRemoved=False, errorType=type(error).__name__,
                            message=str(error) if isinstance(error, ValueError) else "Owned public keyring cleanup failed")
          finally:
              (receipt / "public-keyring-cleanup.json").write_text(json.dumps(result, indent=2) + "\n")
          sys.exit(0 if result["status"] == "CLEANED" else 1)
          CLEANUP
              then :; else
                if [[ "$rc" -eq 0 ]]; then rc=1; fi
              fi
            fi
            printf "reusedInstalledGdb=%s\naptExecuted=%s\nlastCompletedStage=%s\n" "$reused_installed" "$apt_executed" "$last_completed" > "$receipt/mode.txt"; printf "role=diagnosticToolPreparation\ncompiled=false\nemulatorStarted=false\naccepted=false\nexitCode=%s\n" "$rc" > "$receipt/STATUS.txt"
            exit "$rc"
          }
          trap finish_prepare EXIT
          printf 'controller=%s\nimage=%s\n' "$GITHUB_SHA" "${ImageVersion:-unknown}" > "$receipt/controller.txt"
          private=$(mktemp -d "$RUNNER_TEMP/gdb-apt.XXXXXX")
          [[ "$private" =~ ^/[A-Za-z0-9_./-]+$ ]] || exit 2
          chmod 755 "$private"
          mkdir -p "$private/home" "$private/lists/partial" "$private/archives/partial"
          if [[ -x /usr/bin/gdb ]]; then
            reused_installed=true
          else
            /usr/bin/python3 - "$private" "$receipt" <<'PY'
          import hashlib, json, os, re, stat, sys
          from pathlib import Path
          from urllib.parse import urlsplit

          KEYRING = "/usr/share/keyrings/ubuntu-archive-keyring.gpg"
          MIRROR = "mirror+file:/etc/apt/apt-mirrors.txt"

          def official_uri(value):
              uri = urlsplit(value)
              if (uri.scheme not in {"http", "https"} or uri.hostname not in {"archive.ubuntu.com", "azure.archive.ubuntu.com", "security.ubuntu.com"}
                      or uri.port is not None or uri.username or uri.password or uri.query or uri.fragment or uri.path.rstrip("/") != "/ubuntu"):
                  raise ValueError("Ubuntu source URI is outside the existing official archive scope")
              return value

          def validate_sources(text, classic=False, mirrors=()):
              if classic:
                  combined = {}
                  for line in text.splitlines():
                      line = re.sub(r"\s+#.*$", "", line).strip()
                      if not line or line.startswith("#"):
                          continue
                      match = re.fullmatch(r"deb\s+(?:\[([^]]+)\]\s+)?(\S+)\s+(\S+)\s+(.+)", line)
                      if not match:
                          raise ValueError("Unsupported classic Ubuntu source record")
                      options = (match[1] or "").split()
                      if len(options) != len(set(options)) or any(option not in {"arch=amd64", "signed-by=" + KEYRING} for option in options):
                          raise ValueError("Unsupported classic Ubuntu source option")
                      record = combined.setdefault((match[2], match[3]), dict(Types="deb", URIs=match[2], Suites=match[3], Components="", **{"Signed-By": KEYRING}))
                      record["Components"] = " ".join(dict.fromkeys((record["Components"] + " " + match[4]).split()))
                  records = list(combined.values())
              else:
                  records = []
                  for block in re.split(r"\n\s*\n", text.strip()):
                      fields = {}
                      for line in block.splitlines():
                          if not line.strip() or line.lstrip().startswith("#"):
                              continue
                          key, sep, value = line.partition(":")
                          if not sep or key in fields or key not in {"Types", "URIs", "Suites", "Components", "Signed-By", "Architectures"}:
                              raise ValueError("Unsupported Ubuntu source record")
                          fields[key] = value.strip()
                      if fields:
                          records.append(fields)
              if not records or len(records) > 4:
                  raise ValueError("Missing or oversized Ubuntu source set")
              for fields in records:
                  if (fields.get("Types") != "deb" or fields.get("Signed-By") != KEYRING
                          or not fields.get("Suites", "").split() or not set(fields["Suites"].split()) <= {"noble", "noble-updates", "noble-security", "noble-backports"}
                          or "main" not in fields.get("Components", "").split()
                          or not set(fields["Components"].split()) <= {"main", "universe", "restricted", "multiverse"}
                          or fields.get("Architectures", "amd64") != "amd64" or not fields.get("URIs", "").split()):
                      raise ValueError("Unexpected Ubuntu suite, signature or architecture")
                  values = []
                  for value in fields["URIs"].split():
                      if value == MIRROR:
                          if not mirrors:
                              raise ValueError("Known runner mirror file is unavailable")
                          value = mirrors[0]
                      values.append(official_uri(value))
                  fields["URIs"] = " ".join(values)
                  fields["Architectures"] = "amd64"
              return records

          def describe_path(path):
              row = dict(path=str(path), present=False, exists=False, type="missing", uid=None, mode=None, failedChecks=[])
              try:
                  link = path.lstat()
                  row.update(present=True, lstatUid=link.st_uid, lstatMode=oct(stat.S_IMODE(link.st_mode)),
                             type="symlink" if stat.S_ISLNK(link.st_mode) else "other")
                  value = path.stat()
                  row.update(exists=True, type="regular" if stat.S_ISREG(value.st_mode) else "other", uid=value.st_uid,
                             mode=oct(stat.S_IMODE(value.st_mode)), symlink=path.is_symlink())
                  row["failedChecks"] = (["not_regular"] if not stat.S_ISREG(value.st_mode) else []) + (["uid_not_root"] if value.st_uid != 0 else []) + (["group_or_other_writable"] if value.st_mode & 0o022 else [])
              except OSError as error:
                  row["failedChecks"] = ["missing" if isinstance(error, FileNotFoundError) and not row["present"] else "stat_error"]
                  row["errorType"] = type(error).__name__
              return row

          ARCHIVE_KEYS = {"790BC7277767219C42C86F933B4FE6ACC0B21F32", "F6ECB3762474EDA9D21B7022871920D1991BC93C"}
          PACKAGE_KEYS = ARCHIVE_KEYS | {"843938DF228D22F7B3742BC0D94AA3F0EFE21092"}
          KEY_REFERENCES = ("https://wiki.ubuntu.com/Security/FAQ#GPG_Keys_used_by_Ubuntu",
                            "https://documentation.ubuntu.com/security/software-integrity/image-verification/",
                            "https://manpages.ubuntu.com/manpages/noble/man1/dpkg.1.html")

          def key_fingerprints(listing, expected):
              fingerprints, pending = [], False
              for line in listing.decode("utf-8").splitlines():
                  fields = line.split(":")
                  if fields[0] == "pub":
                      if pending or len(fields) < 12 or fields[2:4] != ["4096", "1"] or fields[1] in {"r", "e", "d", "i"}:
                          raise ValueError("Unexpected Ubuntu public-key identity or status")
                      pending = True
                  elif fields[0] == "fpr":
                      if not pending or len(fields) < 10 or not re.fullmatch(r"[0-9A-F]{40}", fields[9]):
                          raise ValueError("Unexpected Ubuntu fingerprint record")
                      fingerprints.append(fields[9]); pending = False
                  elif fields[0] not in {"uid", "tru"}:
                      raise ValueError("Subkeys, secret keys or unknown key records are not admitted")
              if pending or len(fingerprints) != len(expected) or set(fingerprints) != expected:
                  raise ValueError("Ubuntu key set differs from the officially pinned fingerprints")
              return sorted(fingerprints)

          def recover_archive_keyring(private, receipt, original):
              import subprocess, tempfile, time
              result = dict(role="isolatedUbuntuKeyringRecovery", compiled=False, accepted=False, systemKeyringModified=False,
                            status="CHECKING", original=dict(original), officialReferences=KEY_REFERENCES,
                            pinnedArchiveFingerprints=sorted(ARCHIVE_KEYS), pinnedPackageFingerprints=sorted(PACKAGE_KEYS),
                            metadata=[], pathChecks=[], commands=[], phase="installed-package-metadata", recoveryBudgetSeconds=15)
              deadline = time.monotonic() + 15
              try:
                  if (original.get("path") != KEYRING or original.get("failedChecks") != ["group_or_other_writable"]
                          or original.get("uid") != 0 or original.get("type") != "regular" or original.get("symlink")
                          or original.get("mode") != "0o777"):
                      raise ValueError("Recovery only admits the observed root regular 0777 keyring case")
                  def trusted_blob(path, limit):
                      path = Path(path)
                      for parent in path.parents:
                          result["checkingPath"] = str(parent)
                          info = parent.lstat()
                          result["pathChecks"].append(dict(path=str(parent), uid=info.st_uid, mode=oct(stat.S_IMODE(info.st_mode)), directory=True))
                          if not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                              raise ValueError("Installed-package metadata/tool directory is not trusted")
                      result["checkingPath"] = str(path)
                      before = path.lstat()
                      result["pathChecks"].append(dict(path=str(path), uid=before.st_uid, mode=oct(stat.S_IMODE(before.st_mode)), directory=False))
                      if not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_mode & 0o022 or before.st_size > limit:
                          raise ValueError("Installed-package metadata/tool is not root-owned non-writable regular data")
                      data = path.read_bytes()
                      after = path.lstat()
                      if len(data) > limit or (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_uid, before.st_mode) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_uid, after.st_mode):
                          raise ValueError("Installed-package metadata/tool changed or exceeded its size bound")
                      result["metadata"].append(dict(path=str(path), uid=before.st_uid, mode=oct(stat.S_IMODE(before.st_mode)),
                          bytes=len(data), sha256=hashlib.sha256(data).hexdigest()))
                      return data
                  trusted_blob("/var/lib/dpkg/status", 32 * 1024 * 1024)
                  package_list = trusted_blob("/var/lib/dpkg/info/ubuntu-keyring.list", 65536).decode("utf-8").splitlines()
                  sums = trusted_blob("/var/lib/dpkg/info/ubuntu-keyring.md5sums", 65536).decode("ascii").splitlines()
                  if package_list.count(KEYRING) != 1:
                      raise ValueError("Installed ubuntu-keyring package does not uniquely list the original keyring")
                  expected_md5 = [line.split()[0] for line in sums if len(line.split()) == 2 and line.split()[1] == KEYRING.lstrip("/")]
                  if len(expected_md5) != 1 or not re.fullmatch(r"[0-9a-f]{32}", expected_md5[0]):
                      raise ValueError("Installed ubuntu-keyring content checksum is missing or ambiguous")
                  for tool in ("/usr/bin/dpkg-query", "/usr/bin/gpg", "/usr/bin/sudo", "/usr/bin/timeout", "/usr/bin/test"):
                      trusted_blob(tool, 16 * 1024 * 1024)
                      if not os.access(tool, os.X_OK):
                          raise ValueError("Existing package/query tool is not executable")
                  home = private / "keyring-home"; home.mkdir(mode=0o700)
                  environment = dict(PATH="/usr/bin:/bin", HOME=str(home), GNUPGHOME=str(home), LC_ALL="C", LANG="C")
                  def command(kind, arguments):
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise ValueError("Keyring recovery exceeded its existing-step time allowance")
                      row = dict(kind=kind, attempted=True)
                      result["commands"].append(row)
                      try:
                          run = subprocess.run(arguments, stdin=subprocess.DEVNULL, capture_output=True, env=environment,
                                               timeout=min(3, remaining), check=False)
                      except Exception as error:
                          row["errorType"] = type(error).__name__
                          raise
                      row.update(exitCode=run.returncode, stdoutBytes=len(run.stdout), stderrBytes=len(run.stderr))
                      if run.returncode or len(run.stdout) > 131072 or len(run.stderr) > 16384:
                          raise ValueError("Existing keyring recovery command failed or exceeded its output bound")
                      return run.stdout
                  identity = command("installed-package", ["/usr/bin/dpkg-query", "--admindir=/var/lib/dpkg", "-W",
                      "-f=${Package}\t${Version}\t${Architecture}\t${Status}\n", "ubuntu-keyring"]).decode("ascii").strip().split("\t")
                  if (len(identity) != 4 or identity[0] != "ubuntu-keyring" or identity[2:] != ["all", "install ok installed"]
                          or not re.fullmatch(r"[0-9][0-9A-Za-z.+:~_-]*", identity[1])):
                      raise ValueError("Installed ubuntu-keyring package identity is not admitted")
                  result["installedPackage"] = dict(package=identity[0], version=identity[1], architecture=identity[2], status=identity[3])
                  owner = command("package-file-owner", ["/usr/bin/dpkg-query", "--admindir=/var/lib/dpkg", "-S", KEYRING]).decode("ascii").strip()
                  if owner != "ubuntu-keyring: " + KEYRING:
                      raise ValueError("Original archive keyring has an unexpected installed-package owner")
                  result["phase"] = "package-content-snapshot"
                  fd = os.open(KEYRING, os.O_RDONLY | os.O_NOFOLLOW)
                  try:
                      before = os.fstat(fd)
                      if not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or stat.S_IMODE(before.st_mode) != 0o777:
                          raise ValueError("Original writable keyring identity changed before snapshot")
                      with os.fdopen(fd, "rb", closefd=False) as stream:
                          data = stream.read(65537)
                      after = os.fstat(fd)
                      if (len(data) > 65536 or (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_uid, before.st_mode) !=
                              (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_uid, after.st_mode)):
                          raise ValueError("Original keyring snapshot changed or exceeded its size bound")
                  finally:
                      os.close(fd)
                  if hashlib.md5(data).hexdigest() != expected_md5[0]:
                      raise ValueError("Original keyring bytes differ from trusted installed-package metadata")
                  result["snapshot"] = dict(bytes=len(data), sha256=hashlib.sha256(data).hexdigest(), installedPackageMd5Matched=True,
                                            md5IsNotSecurityProof=True)
                  def readonly_copy(path, content, public=False):
                      fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
                      try:
                          with os.fdopen(fd, "wb", closefd=False) as stream:
                              stream.write(content); stream.flush(); os.fsync(fd)
                      finally:
                          os.close(fd)
                      info = path.lstat()
                      traversal = [dict(path=str(parent), uid=parent.lstat().st_uid,
                          mode=oct(stat.S_IMODE(parent.lstat().st_mode))) for parent in path.parents]
                      result.setdefault("privateCopies", []).append(dict(path=str(path), uid=info.st_uid,
                          mode=oct(stat.S_IMODE(info.st_mode)), bytes=info.st_size, parents=traversal, role="aptPublic" if public else "actorPrivate"))
                      if (not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o444
                              or info.st_uid != os.getuid() or path.read_bytes() != content
                              or any(not stat.S_ISDIR(parent.lstat().st_mode) or parent.lstat().st_uid not in {0, os.getuid()}
                                     or (parent.lstat().st_mode & 0o022 and not (str(parent) == "/tmp" and parent.lstat().st_uid == 0
                                         and parent.lstat().st_mode & stat.S_ISVTX))
                                     or (public and not parent.lstat().st_mode & stat.S_IXOTH) for parent in path.parents)):
                          raise ValueError("Task keyring read-back, trusted parent or role-specific traversal differs")
                  snapshot = private / "original-keyring-snapshot.gpg"; readonly_copy(snapshot, data)
                  common = ["/usr/bin/gpg", "--no-options", "--batch", "--no-tty", "--no-autostart", "--homedir", str(home),
                            "--no-auto-key-retrieve", "--no-auto-check-trustdb"]
                  def inspect(path, expected):
                      return key_fingerprints(command("public-key-fingerprints", common + ["--with-colons", "--fingerprint", "--show-keys", str(path)]), expected)
                  result["phase"] = "official-fingerprint-check"
                  result["actualPackageFingerprints"] = inspect(snapshot, PACKAGE_KEYS)
                  exported = command("export-pinned-archive-keys", common + ["--no-default-keyring", "--keyring", str(snapshot),
                      "--export-options", "export-minimal", "--export", *sorted(ARCHIVE_KEYS)])
                  if not exported or len(exported) > 65536:
                      raise ValueError("Pinned archive key export is empty or oversized")
                  result["phase"] = "private-archive-keyring"
                  isolated = private / "verified-ubuntu-archive.gpg"; readonly_copy(isolated, exported)
                  result["exportedArchiveFingerprints"] = inspect(isolated, ARCHIVE_KEYS)
                  result["phase"] = "public-archive-keyring"
                  temporary_root = Path("/tmp").lstat()
                  if not stat.S_ISDIR(temporary_root.st_mode) or temporary_root.st_uid != 0 or stat.S_IMODE(temporary_root.st_mode) != 0o1777:
                      raise ValueError("Public archive keyring requires the exact root-owned sticky /tmp")
                  public_directory = Path(tempfile.mkdtemp(prefix="aerove-archive.", dir="/tmp"))
                  directory_info = public_directory.lstat()
                  if not stat.S_ISDIR(directory_info.st_mode) or directory_info.st_uid != os.getuid() or stat.S_IMODE(directory_info.st_mode) != 0o700:
                      raise ValueError("New public archive keyring directory identity differs")
                  ownership = dict(path=str(public_directory), uid=directory_info.st_uid, dev=directory_info.st_dev, ino=directory_info.st_ino)
                  try:
                      marker_fd = os.open(private / "public-keyring-owner.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                      with os.fdopen(marker_fd, "w") as marker:
                          marker.write(json.dumps(ownership) + "\n"); marker.flush(); os.fsync(marker.fileno())
                  except Exception:
                      public_directory.rmdir()
                      raise
                  result["publicDirectory"] = ownership
                  os.chmod(public_directory, 0o755)
                  published_info = public_directory.lstat()
                  if (published_info.st_dev, published_info.st_ino, published_info.st_uid, stat.S_IMODE(published_info.st_mode)) != (ownership["dev"], ownership["ino"], ownership["uid"], 0o755):
                      raise ValueError("Public archive keyring directory read-back is not the owned 0755 directory")
                  public_keyring = public_directory / "verified-ubuntu-archive.gpg"
                  readonly_copy(public_keyring, exported, public=True)
                  if deadline - time.monotonic() < 3:
                      raise ValueError("Insufficient existing-step budget for the actual APT sandbox readback")
                  command("apt-sandbox-readable", ["/usr/bin/sudo", "-n", "-u", "_apt", "--", "/usr/bin/timeout",
                      "--signal=TERM", "--kill-after=1s", "1s", "/usr/bin/test", "-r", str(public_keyring)])
                  result["aptSandbox"] = dict(user="_apt", readVerified=True)
                  result.update(status="RECOVERED", phase="complete", privateKeyring=dict(path=str(isolated), uid=isolated.stat().st_uid, mode="0o444", bytes=len(exported),
                      sha256=hashlib.sha256(exported).hexdigest()), sourcePermissionRiskPreserved=True)
                  result["publicKeyring"] = dict(path=str(public_keyring), uid=public_keyring.lstat().st_uid, mode="0o444", bytes=len(exported),
                      sha256=hashlib.sha256(exported).hexdigest(), role="aptSignedBy")
                  return str(public_keyring), exported
              except Exception as error:
                  result.update(status="FAILED", failure=dict(type=type(error).__name__,
                      message=str(error) if isinstance(error, ValueError) else "Keyring evidence unavailable; recovery denied"))
                  raise SystemExit("Writable Ubuntu keyring recovery failed; inspect keyring-recovery.json")
              finally:
                  (receipt / "keyring-recovery.json").write_text(json.dumps(result, indent=2) + "\n")

          private, receipt = map(Path, sys.argv[1:])
          paths = {value: describe_path(Path(value)) for value in ("/etc/apt/sources.list.d/ubuntu.sources", "/etc/apt/sources.list", KEYRING)}
          def require_path(path):
              paths[str(path)] = describe_path(path)
              (receipt / "source-paths.json").write_text(json.dumps(paths, indent=2) + "\n")
              if paths[str(path)]["failedChecks"]:
                  raise SystemExit("Ubuntu source/keyring trust failure; inspect source-paths.json failedChecks")
              data = path.read_bytes()
              if len(data) > 65536:
                  raise SystemExit("Ubuntu source/keyring size limit")
              return data

          (receipt / "source-paths.json").write_text(json.dumps(paths, indent=2) + "\n")
          release = dict(line.split("=", 1) for line in Path("/etc/os-release").read_text().splitlines() if "=" in line)
          if release.get("ID", "").strip('"') != "ubuntu" or release.get("VERSION_CODENAME", "").strip('"') != "noble":
              raise SystemExit("Only the declared Ubuntu24.04 runner is supported")
          source = Path("/etc/apt/sources.list.d/ubuntu.sources")
          if paths[str(source)]["failedChecks"] == ["missing"]:
              source = Path("/etc/apt/sources.list")
          text = require_path(source).decode("utf-8")
          effective_keyring = KEYRING
          if paths[KEYRING]["failedChecks"] == ["group_or_other_writable"] and paths[KEYRING]["mode"] == "0o777":
              effective_keyring, keyring_data = recover_archive_keyring(private, receipt, paths[KEYRING])
          else:
              keyring_data = require_path(Path(KEYRING))
          mirrors = []
          if MIRROR in text:
              for line in require_path(Path("/etc/apt/apt-mirrors.txt")).decode("utf-8").splitlines():
                  fields = line.split()
                  if not fields or fields[0].startswith("#"):
                      continue
                  if len(fields) > 2 or (len(fields) == 2 and not re.fullmatch(r"priority:[1-3]", fields[1])):
                      raise SystemExit("Unsupported fixed runner mirror record")
                  mirrors.append(official_uri(fields[0]))
              if not mirrors or len(mirrors) > 3 or len(mirrors) != len(set(mirrors)):
                  raise SystemExit("Invalid fixed runner mirror set")
          records = validate_sources(text, source.name == "sources.list", mirrors)
          for record in records:
              record["Signed-By"] = effective_keyring
          canonical = "\n\n".join("\n".join(key + ": " + record[key] for key in ("Types", "URIs", "Suites", "Components", "Signed-By", "Architectures")) for record in records) + "\n"
          (private / "ubuntu.sources").write_text(canonical)
          (receipt / "ubuntu-source.json").write_text(json.dumps(dict(path=str(source), sha256=hashlib.sha256(source.read_bytes()).hexdigest(),
              keyringSha256=hashlib.sha256(keyring_data).hexdigest(), originalKeyringPath=KEYRING, effectiveKeyringPath=effective_keyring, records=records, existingMirrorUris=mirrors,
              canonicalSourceSha256=hashlib.sha256(canonical.encode()).hexdigest()), indent=2) + "\n")
          PY
            cat > "$private/apt.conf" <<EOF
          Dir::Etc::parts "-";
          Dir::Etc::main "-";
          Dir::Etc::sourcelist "$private/ubuntu.sources";
          Dir::Etc::sourceparts "-";
          Dir::State::lists "$private/lists";
          Dir::Cache::archives "$private/archives";
          APT::Install-Recommends "false";
          APT::Keep-Downloaded-Packages "true";
          APT::Get::AllowUnauthenticated "false";
          Acquire::AllowInsecureRepositories "false";
          Acquire::AllowDowngradeToInsecureRepositories "false";
          Acquire::Retries "0";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
            apt_env=(/usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C DEBIAN_FRONTEND=noninteractive APT_CONFIG="$private/apt.conf")
            last_completed=source-validation-completed
            apt_executed=unknown
            set +e
            timeout --kill-after=2s 10s "${apt_env[@]}" /usr/bin/apt-get --version > "$receipt/apt-version.txt" 2>&1
            apt_version_rc=$?
            set -e
            if grep -Eq '^apt [0-9]+\.' "$receipt/apt-version.txt"; then apt_executed=true; fi
            (( apt_version_rc == 0 )) && [[ "$apt_executed" == true ]] || exit 2
            last_completed=apt-version-completed
            sudo -n /usr/bin/nice -n 19 /usr/bin/timeout --signal=TERM --kill-after=5s 90s "${apt_env[@]}" /usr/bin/apt-get -o APT::Update::Error-Mode=any update > "$receipt/apt-update.log" 2>&1
            last_completed=apt-update-completed
            timeout --kill-after=2s 10s "${apt_env[@]}" /usr/bin/apt-cache policy gdb > "$receipt/apt-policy.txt"
            candidate=$(awk '$1 == "Candidate:" {print $2}' "$receipt/apt-policy.txt")
            [[ "$candidate" =~ ^[0-9][0-9A-Za-z.+:~_-]*ubuntu[0-9A-Za-z.+:~_-]*$ ]] || exit 2
            install_args=(--no-install-recommends --no-upgrade --no-remove install "gdb=$candidate")
            timeout --kill-after=2s 20s "${apt_env[@]}" /usr/bin/apt-get -s "${install_args[@]}" > "$receipt/apt-simulation.txt" 2>&1
            if grep -Eq '^(Remv |Inst [^ ]+ \[)' "$receipt/apt-simulation.txt"; then echo 'Refusing an installed-package upgrade or removal' >&2; exit 2; fi
            new_count=$(grep -c '^Inst ' "$receipt/apt-simulation.txt" || true)
            (( new_count >= 1 && new_count <= 12 )) || exit 2
            timeout --kill-after=2s 10s "${apt_env[@]}" /usr/bin/apt-cache show "gdb=$candidate" > "$receipt/apt-gdb-metadata.txt"
            sudo -n /usr/bin/nice -n 19 /usr/bin/timeout --signal=TERM --kill-after=5s 120s "${apt_env[@]}" /usr/bin/apt-get -y "${install_args[@]}" > "$receipt/apt-install.log" 2>&1
            last_completed=apt-install-completed
            shopt -s nullglob
            debs=("$private"/archives/gdb_*.deb)
            (( ${#debs[@]} == 1 )) || exit 2
            expected=$(awk '$1 == "SHA256:" {print $2}' "$receipt/apt-gdb-metadata.txt" | sort -u)
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || exit 2
            [[ $(sha256sum "${debs[0]}" | cut -d' ' -f1) == "$expected" ]] || exit 2
            dpkg-deb -f "${debs[0]}" Package Version Architecture > "$receipt/gdb-deb-identity.txt"
            sha256sum "$private"/archives/*.deb > "$receipt/downloaded-deb-sha256.txt"
            for release in "$private"/lists/*InRelease; do
              grep -qx 'Origin: Ubuntu' "$release"
              grep -E '^(Origin|Label|Suite|Codename|Date|Valid-Until):' "$release" >> "$receipt/ubuntu-release.txt"
              sha256sum "$release" >> "$receipt/ubuntu-release-sha256.txt"
            done
          fi
          dpkg-query -W -f='${binary:Package}\t${Version}\t${Architecture}\t${db:Status-Abbrev}\t${source:Package}\n' gdb > "$receipt/installed-gdb.txt"
          dpkg-query -s gdb > "$receipt/installed-gdb-status.txt"
          grep -Eq '^gdb[[:space:]]+[^[:space:]]*ubuntu[^[:space:]]*[[:space:]]+amd64[[:space:]]+ii' "$receipt/installed-gdb.txt"
          dpkg-query -S /usr/bin/gdb > "$receipt/gdb-file-owner.txt"
          grep -qx 'gdb: /usr/bin/gdb' "$receipt/gdb-file-owner.txt"
          sha256sum /usr/bin/gdb > "$receipt/gdb-binary-sha256.txt"
          gdb_env=(/usr/bin/env -i PATH=/usr/bin:/bin HOME="$private/home" LC_ALL=C DEBUGINFOD_URLS= PYTHONNOUSERSITE=1)
          timeout --signal=TERM --kill-after=2s 10s "${gdb_env[@]}" /usr/bin/gdb -nx -nh --batch --version > "$receipt/gdb-version.txt" 2>&1
          timeout --signal=TERM --kill-after=2s 10s "${gdb_env[@]}" /usr/bin/gdb -nx -nh --batch -iex 'set auto-load off' -iex 'set auto-load safe-path /nonexistent' -iex 'set debuginfod enabled off' -ex 'python import sys; print("AEROVE_GDB_PYTHON_READY=" + sys.version.split()[0])' > "$receipt/gdb-python.txt" 2>&1
          grep -Eq '^AEROVE_GDB_PYTHON_READY=[0-9]+\.[0-9]+\.[0-9]+' "$receipt/gdb-python.txt"
          last_completed=gdb-readiness-completed
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        timeout-minutes: 5
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - name: Existing official API33 x86 image and KVM
        timeout-minutes: 10
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/standard-x86-qa-render"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/standard-x86-qa-avd"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$root/environment" "$ANDROID_AVD_HOME"
          timeout --kill-after=10s 300s sdkmanager --install 'build-tools;35.0.0' emulator 'system-images;android-33;google_apis;x86_64' --channel=0
          "$ANDROID_HOME/emulator/emulator" -no-window -version > "$root/environment/emulator-version.txt" 2>&1
          grep -E '37\.2\.12\.0.*16428233' "$root/environment/emulator-version.txt"
          image="$ANDROID_HOME/system-images/android-33/google_apis/x86_64"
          cp "$image/source.properties" "$root/environment/image-source.properties"
          cp "$image/build.prop" "$root/environment/image-build.prop"
          grep -E '^Pkg.Revision\s*=\s*17\s*$' "$image/source.properties"
          grep -E '^AndroidVersion.ApiLevel\s*=\s*33\s*$' "$image/source.properties"
          grep -E '^SystemImage.Abi\s*=\s*x86_64\s*$' "$image/source.properties"
          sha256sum "$image/system.img" > "$root/environment/image-system-sha256.txt"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          echo no | avdmanager create avd --force -n test --package 'system-images;android-33;google_apis;x86_64' --device pixel_6
          printf 'hw.cpu.ncore=2\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          cp "$ANDROID_AVD_HOME/test.avd/config.ini" "$root/environment/avd-config.ini"
      - name: Re-verify the earlier QA package without compiling
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          observer=()
          if [[ "$HOST_CRASH_OBSERVER" == true ]]; then observer=(--host-crash-observer); fi
          python3 tooling/standard_x86_qa.py reuse \
            "${observer[@]}" \
            --directory "$RUNNER_TEMP/standard-x86-qa-input" --evidence "$RUNNER_TEMP/standard-x86-qa-render/reuse" \
            --run-id "$FORMAL_RUN_ID" --qa-run-id "$QA_RUN_ID" --qa-artifact-id "$QA_ARTIFACT_ID" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - name: Own emulator and strict QA first-screen probe without building
        id: primary
        timeout-minutes: 18
        run: |
          observer=()
          if [[ "$HOST_CRASH_OBSERVER" == true ]]; then observer=(--host-crash-observer); fi
          python3 tooling/standard_x86_qa.py capture \
            "${observer[@]}" \
            --directory "$RUNNER_TEMP/standard-x86-qa-input" \
            --evidence "$RUNNER_TEMP/standard-x86-qa-render/runtime" \
            --package-receipt "$RUNNER_TEMP/standard-x86-qa-render/reuse/QA_PACKAGE_REUSE.json" \
            --harness "$GITHUB_WORKSPACE" --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - name: Non-production Skia fallback only after a primary emulator host exit
        if: failure() && steps.primary.outcome == 'failure' && !inputs.host_crash_observer
        timeout-minutes: 18
        run: |
          python3 tooling/standard_x86_qa.py capture \
            --directory "$RUNNER_TEMP/standard-x86-qa-input" \
            --evidence "$RUNNER_TEMP/standard-x86-qa-render/runtime-fallback" \
            --package-receipt "$RUNNER_TEMP/standard-x86-qa-render/reuse/QA_PACKAGE_REUSE.json" \
            --fallback-after "$RUNNER_TEMP/standard-x86-qa-render/runtime/EMULATOR-OWNER.json" \
            --harness "$GITHUB_WORKSPACE" --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 10
        with:
          name: Std-internal-x86-probe-first-screen-${{ github.run_id }}
          path: ${{ runner.temp }}/standard-x86-qa-render/
          if-no-files-found: warn

  matrix_evidence:
    name: Evidence only - fixed Lite147 original matrix Davey lines
    if: ${{ github.repository == 'IvanSolis1989/Aerove' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/aerove-standard-host-crash-31' && inputs.evidence_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      EVIDENCE_ONLY: ${{ inputs.evidence_only }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Evidence only - fixed Lite147 original matrix Davey lines
        timeout-minutes: 4
        run: |
          python3 - <<'PY'
          """Fixed original Lite147 evidence read; never application acceptance."""
          import binascii
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import selectors
          import shutil
          import signal
          import stat
          import subprocess
          import tempfile
          import time
          import zipfile

          REPO = "IvanSolis1989/Aerove"
          RUN = 40542295511
          SOURCE = "9e24281641c86d6315dfc70b67ed62ff01c26f6b"
          TREE = "13ffe0b535bed5f3cdd231778cb268e5c6f6b6ed"
          ARTIFACT = 12752950352
          SIZE = 33013619
          DIGEST = "1fc5e357cfa89bc9de08b9ba0e85d04881e7ab5d5049d0d042347b4a566e9727"
          NAME = "AEROVE-Lite-dashboard-matrix-attempt-1"
          TARGETS = ("123135942212", "152969274352")
          ENTRIES = {"SOURCE.json": (610, 335, "801f7ccc"), "logcat.txt": (5732345, 816202, "fd26c3b8")}


          def require(condition, message):
              if not condition:
                  raise ValueError(message)


          def controller():
              require(os.environ.get("GITHUB_REPOSITORY") == REPO
                      and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
                      and os.environ.get("GITHUB_REF") == "refs/heads/codex/aerove-standard-host-crash-31"
                      and os.environ.get("EVIDENCE_ONLY") == "true", "Evidence-only controller context mismatch")
              return {key: os.environ.get(key) for key in ("GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")}


          def gh(route, destination, limit, timeout, receipts):
              """Bound stdout/stderr and time; never persist headers, signed URLs or stderr text."""
              command = [shutil.which("gh") or "/usr/bin/gh", "api", route]
              env = dict(PATH="/usr/bin:/bin", HOME=os.environ["HOME"], GH_TOKEN=os.environ["GH_TOKEN"],
                         GH_PROMPT_DISABLED="1", NO_COLOR="1")
              proc = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE, stdin=subprocess.DEVNULL,
                                      env=env, start_new_session=True)
              counts = {"stdout": 0, "stderr": 0}
              stderr = bytearray()
              started = time.monotonic()
              error = None
              try:
                  with selectors.DefaultSelector() as selector, Path(destination).open("wb") as output:
                      selector.register(proc.stdout, selectors.EVENT_READ, "stdout")
                      selector.register(proc.stderr, selectors.EVENT_READ, "stderr")
                      while selector.get_map():
                          require(time.monotonic() - started < timeout, "gh time limit exceeded")
                          for key, _ in selector.select(0.2):
                              chunk = os.read(key.fileobj.fileno(), 65536)
                              if not chunk:
                                  selector.unregister(key.fileobj)
                                  continue
                              counts[key.data] += len(chunk)
                              require(counts["stdout"] <= limit and counts["stderr"] <= 8192, "gh output limit exceeded")
                              if key.data == "stdout":
                                  output.write(chunk)
                              else:
                                  stderr.extend(chunk)
                      require(proc.wait(timeout=2) == 0, "gh API/download failed")
              except Exception as caught:
                  error = caught
              finally:
                  if proc.poll() is None:
                      os.killpg(proc.pid, signal.SIGKILL)
                      proc.wait(timeout=5)
                  proc.stdout.close()
                  proc.stderr.close()
                  receipts.append(dict(route=route, stdoutBytes=counts["stdout"], stderrBytes=counts["stderr"],
                      stderrCategories=[word for word in ("eof", "timeout", "forbidden", "reset") if word.encode() in stderr.lower()],
                      exitCode=proc.returncode, seconds=round(time.monotonic() - started, 3),
                      stderrTextPersisted=False, credentialsOrSignedUrlsPersisted=False))
              if error:
                  raise error


          def validate_api(run, artifact):
              require(run.get("id") == RUN and run.get("head_sha") == SOURCE and run.get("run_attempt") == 1
                      and run.get("run_number") == 147 and run.get("path") == ".github/workflows/aerove-lite.yaml"
                      and run.get("status") == "completed" and run.get("conclusion") == "failure"
                      and all(run.get(key, {}).get("full_name") == REPO for key in ("repository", "head_repository")),
                      "Original Lite147 API run identity/terminal mismatch")
              require(artifact.get("id") == ARTIFACT and artifact.get("name") == NAME
                      and artifact.get("size_in_bytes") == SIZE and artifact.get("expired") is False
                      and artifact.get("digest") == "sha256:" + DIGEST
                      and artifact.get("workflow_run", {}).get("id") == RUN
                      and artifact.get("workflow_run", {}).get("head_sha") == SOURCE,
                      "Original artifact API identity/digest/size/expiry mismatch")


          def read_entries(archive):
              require(Path(archive).stat().st_size == SIZE, "ZIP size mismatch")
              hasher = hashlib.sha256()
              with Path(archive).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      hasher.update(chunk)
              digest = hasher.hexdigest()
              require(digest == DIGEST, "Full original ZIP digest mismatch")
              output, receipts = {}, {}
              with zipfile.ZipFile(archive) as package:
                  infos = package.infolist()
                  require(len(infos) <= 12000, "ZIP entry limit exceeded")
                  seen = set()
                  for entry in infos:
                      path = PurePosixPath(entry.filename)
                      mode = entry.external_attr >> 16
                      require(entry.filename and "\\" not in entry.filename and ":" not in entry.filename
                              and not entry.filename.startswith("/") and "\x00" not in entry.filename
                              and all(part not in ("", ".", "..") and not part.endswith((".", " ")) for part in path.parts)
                              and path.as_posix() == entry.filename.rstrip("/") and entry.filename.casefold() not in seen
                              and stat.S_IFMT(mode) in (0, stat.S_IFREG, stat.S_IFDIR)
                              and not entry.flag_bits & 1 and entry.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)
                              and 0 <= entry.header_offset < package.start_dir, "Unsafe, duplicate or unsupported ZIP entry")
                      seen.add(entry.filename.casefold())
                  for name, (size, compressed, crc) in ENTRIES.items():
                      entry = package.getinfo(name)
                      require((entry.file_size, entry.compress_size, f"{entry.CRC:08x}") == (size, compressed, crc)
                              and size <= 6 * 1024 * 1024 and size <= max(1, compressed) * 1000, "Fixed entry metadata mismatch")
                      data = package.read(entry)
                      require(len(data) == size and f"{binascii.crc32(data) & 0xffffffff:08x}" == crc, "Entry CRC/size mismatch")
                      output[name] = data
                      receipts[name] = dict(bytes=size, compressedBytes=compressed, crc32=crc, sha256=hashlib.sha256(data).hexdigest())
              source = json.loads(output["SOURCE.json"])
              require(all(str(source.get(key)) == str(value) for key, value in dict(sourceRevision=SOURCE, sourceTree=TREE,
                  workflowRun=RUN, appBuildRun=RUN, harnessRun=RUN, harnessRevision=SOURCE, runNumber=147, runAttempt=1, phase="matrix").items())
                  and source.get("testShard") is None and source.get("prebuiltApks") is True,
                  "Original SOURCE entry differs from fixed Lite147 identity")
              return output["logcat.txt"], source, receipts, digest


          def sensitive_text(text):
              token = os.environ.get("GH_TOKEN")
              return bool(re.search(r"https?://|\b(?:proxy-)?authorization[\"']?\s*[:=]\s*\S|\b(?:sig|signature)[\"']?\s*[:=]\s*\S",
                                    text, re.IGNORECASE) or (token and token in text))


          def davey_slices(data):
              lines = data.decode("utf-8", errors="strict").splitlines()
              fields = ("FrameTimelineVsyncId", "IssueDrawCommandsStart", "SwapBuffersCompleted", "FrameCompleted")
              matches, contexts = {}, {}
              for target in TARGETS:
                  selected = []
                  for index, line in enumerate(lines):
                      if (re.search(r"(?:^|[ /])(?:HWUI|OpenGLRenderer)(?:\(\s*\d+\))?\s*:\s*Davey!", line)
                              and re.search(r"\bIntendedVsync=" + target + r"(?=[,;\s]|$)", line)):
                          require(len(line.encode()) <= 16384, "Matched Davey line exceeds safe output limit")
                          require(not sensitive_text(line),
                                  "Matched line contains suspected credential/URL material and cannot be persisted whole")
                          values = {key: re.findall(r"\b" + key + r"=([0-9]+)(?=[,;\s]|$)", line) for key in fields}
                          selected.append(dict(lineNumber=index + 1, fullLine=line,
                              lineSha256=hashlib.sha256(line.encode()).hexdigest(), fields=values,
                              requiredFieldsPresent=all(len(value) == 1 for value in values.values())))
                          for adjacent in range(max(0, index - 2), min(len(lines), index + 3)):
                              nearby = lines[adjacent]
                              if adjacent == index or (re.search(r"HWUI|OpenGLRenderer|Choreographer|frame-commit|Frame", nearby)
                                      and len(nearby.encode()) <= 4096 and not sensitive_text(nearby)):
                                  contexts[adjacent + 1] = nearby
                  require(len(selected) <= 4, "Too many matching Davey lines for a fixed target")
                  matches[target] = selected
              complete = all(matches[target] and all(row["requiredFieldsPresent"] for row in matches[target]) for target in TARGETS)
              text = "\n".join(f"{number}: {line}" for number, line in sorted(contexts.items())) + "\n"
              require(len(text.encode()) <= 160 * 1024, "Davey context exceeds output cap")
              return matches, text, complete


          def main():
              out = Path(os.environ["RUNNER_TEMP"]) / "diagnostic-evidence/matrix/out"
              out.mkdir(parents=True, exist_ok=True)
              receipt = dict(role="evidenceOnly", compiled=False, emulatorStarted=False, accepted=False,
                  controller=controller(), originalSource=SOURCE, originalTree=TREE, originalRun=RUN, originalAttempt=1,
                  artifactId=ARTIFACT, artifactName=NAME, expectedZipBytes=SIZE, expectedZipSha256=DIGEST,
                  requests=[], wholeZipDigestVerified=False, completed=False)
              try:
                  with tempfile.TemporaryDirectory(prefix="lite147-original-matrix-") as private:
                      private = Path(private)
                      for name, route in (("run", f"repos/{REPO}/actions/runs/{RUN}"),
                                          ("artifact", f"repos/{REPO}/actions/artifacts/{ARTIFACT}")):
                          gh(route, private / (name + ".json"), 1024 * 1024, 20, receipt["requests"])
                      validate_api(json.loads((private / "run.json").read_text()), json.loads((private / "artifact.json").read_text()))
                      gh(f"repos/{REPO}/actions/artifacts/{ARTIFACT}/zip", private / "original.zip", SIZE, 160, receipt["requests"])
                      log, source, entries, digest = read_entries(private / "original.zip")
                      receipt.update(wholeZipDigestVerified=True, actualZipSha256=digest, sourceEntry=source, entries=entries)
                      matches, text, complete = davey_slices(log)
                      receipt.update(matches=matches, completed=complete)
                      (out / "DAVEY-SLICES.txt").write_text(text, encoding="utf-8")
                      require(complete, "Fixed Davey target or required field is missing; no frame association inferred")
              except Exception as error:
                  receipt["failure"] = dict(type=type(error).__name__, message=str(error) if isinstance(error, ValueError) else "Read failed; raw stderr and URLs withheld")
                  raise SystemExit(1)
              finally:
                  (out / "MATRIX-EVIDENCE.json").write_text(json.dumps(receipt, indent=2) + "\n")


          if __name__ == "__main__":
              main()
          PY
      - name: Preserve small evidence-only receipt even on failure
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Evidence-only-Lite147-Davey-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostic-evidence/matrix/out/
          if-no-files-found: error
          retention-days: 7

  host_tools_evidence:
    name: Evidence only - existing runner debugger inventory
    if: ${{ github.repository == 'IvanSolis1989/Aerove' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/aerove-standard-host-crash-31' && inputs.evidence_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      EVIDENCE_ONLY: ${{ inputs.evidence_only }}
    steps:
      - name: Evidence only - existing runner debugger inventory
        timeout-minutes: 4
        run: |
          python3 - <<'PY'
          """Bounded fresh-runner debugger inventory; never attach, install or start an emulator."""
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import shutil
          import signal
          import stat
          import subprocess
          import tempfile
          import time

          NAMES = ("gdb", "gdb-multiarch", "lldb")
          CONTROLLED_PATH = "/usr/bin:/bin"
          TRUSTED = ("/usr", "/opt", "/bin", "/sbin", "/snap", "/home/linuxbrew/.linuxbrew",
                     "/home/runner/.local/bin", "/home/runner/.cargo/bin", "/home/runner/.dotnet/tools")


          def trusted(path):
              value = str(path.resolve())
              return any(value == root or value.startswith(root + "/") for root in TRUSTED)


          def controlled_probe(command, home, seconds):
              env = dict(PATH=CONTROLLED_PATH, HOME=str(home), XDG_CONFIG_HOME=str(home), LC_ALL="C", LANG="C",
                  TERM="dumb", DEBUGINFOD_URLS="", PYTHONNOUSERSITE="1", PYTHONSAFEPATH="1", GDBHISTFILE="/dev/null")
              proc = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE, stdin=subprocess.DEVNULL,
                  env=env, start_new_session=True)
              output = {"stdout": bytearray(), "stderr": bytearray()}
              started = time.monotonic()
              stopped = None
              try:
                  with selectors.DefaultSelector() as selector:
                      selector.register(proc.stdout, selectors.EVENT_READ, "stdout")
                      selector.register(proc.stderr, selectors.EVENT_READ, "stderr")
                      while selector.get_map():
                          if time.monotonic() - started >= seconds:
                              raise TimeoutError("bounded debugger inventory probe timed out")
                          for key, _ in selector.select(0.1):
                              chunk = os.read(key.fileobj.fileno(), 4096)
                              if not chunk:
                                  selector.unregister(key.fileobj)
                              else:
                                  if sum(map(len, output.values())) + len(chunk) > 16384:
                                      raise ValueError("bounded debugger inventory output limit")
                                  output[key.data].extend(chunk)
                      proc.wait(timeout=1)
              except (TimeoutError, ValueError, subprocess.TimeoutExpired) as error:
                  stopped = type(error).__name__
              finally:
                  if proc.poll() is None:
                      os.killpg(proc.pid, signal.SIGKILL)
                      proc.wait(timeout=3)
                  proc.stdout.close()
                  proc.stderr.close()
              text = {key: re.sub(r"https?://\S+", "[URL]", value.decode("utf-8", errors="replace")) for key, value in output.items()}
              return dict(exitCode=proc.returncode, stopped=stopped, seconds=round(time.monotonic() - started, 3), **text)


          def inventory(original_path):
              requested = original_path.split(os.pathsep)
              scope_limits = []
              if len(requested) > 32:
                  scope_limits.append("original PATH capped at32 directories")
              requested = requested[:32] + ["/usr/bin", "/usr/local/bin", "/home/linuxbrew/.linuxbrew/bin", "/usr/local/swift/usr/bin"]
              llvm = sorted(Path("/usr/lib").glob("llvm-*/bin"))[:16]
              requested += [str(path) for path in llvm]
              sdk_roots = [Path("/usr/local/lib/android/sdk"), Path("/opt/android-sdk")]
              sdk_roots += [Path(os.environ[key]) for key in ("ANDROID_HOME", "ANDROID_SDK_ROOT") if os.environ.get(key)]
              for sdk in sorted(set(sdk_roots)):
                  if not sdk.is_absolute() or not trusted(sdk) or not sdk.is_dir():
                      continue
                  versions = sorted((sdk / "ndk").glob("*"))
                  if len(versions) > 16:
                      scope_limits.append("existing NDK versions capped at16 per SDK root")
                  for ndk in versions[:16] + ([sdk / "ndk-bundle"] if (sdk / "ndk-bundle").is_dir() else []):
                      if ndk.is_dir():
                          requested += [str(ndk / suffix) for suffix in ("toolchains/llvm/prebuilt/linux-x86_64/bin", "prebuilt/linux-x86_64/bin")]
              directories, tools = [], []
              seen = set()
              started = time.monotonic()
              for raw in requested:
                  if raw in seen:
                      continue
                  seen.add(raw)
                  if len(directories) >= 96 or time.monotonic() - started > 12:
                      scope_limits.append("directory count/time bound reached")
                      break
                  directory = Path(raw)
                  row = dict(requested=raw, searched=False)
                  directories.append(row)
                  try:
                      if not directory.is_absolute() or not trusted(directory) or not directory.is_dir():
                          row["reason"] = "absent or outside trusted image-directory scope"
                          continue
                      row.update(realPath=str(directory.resolve()), searched=True)
                      if directory.stat().st_mode & stat.S_IWOTH:
                          row.update(searched=False, reason="world-writable directory excluded")
                          continue
                      with os.scandir(directory) as entries:
                          for count, entry in enumerate(entries):
                              if count >= 8192 or len(tools) >= 128 or time.monotonic() - started > 12:
                                  scope_limits.append("shallow entry/tool/time bound reached")
                                  break
                              if not re.fullmatch(r"(?:gdb|gdb-multiarch|lldb)(?:-\d+)?", entry.name):
                                  continue
                              path = Path(entry.path)
                              real = path.resolve()
                              regular = path.is_file()
                              executable = regular and os.access(path, os.X_OK)
                              eligible = executable and trusted(real) and not real.stat().st_mode & stat.S_IWOTH
                              tools.append(dict(path=str(path), realPath=str(real), name=entry.name, regularFile=regular,
                                  executable=executable, trustedExecutable=eligible, isSymlink=path.is_symlink()))
                  except OSError as error:
                      row.update(searched=False, errorType=type(error).__name__)
              return directories, tools, sorted(set(scope_limits))


          def main():
              out = Path(os.environ["RUNNER_TEMP"]) / "diagnostic-evidence/host-tools/out"
              out.mkdir(parents=True, exist_ok=True)
              receipt = dict(role="evidenceOnly", compiled=False, emulatorStarted=False, accepted=False,
                  ptraceAttempted=False, toolsInstalled=False, controller={key: os.environ.get(key) for key in
                      ("GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")}, completed=False)
              try:
                  if (os.environ.get("GITHUB_REPOSITORY") != "IvanSolis1989/Aerove"
                          or os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
                          or os.environ.get("GITHUB_REF") != "refs/heads/codex/aerove-standard-host-crash-31"
                          or os.environ.get("EVIDENCE_ONLY") != "true"):
                      raise ValueError("Evidence-only controller context mismatch")
                  original_path = os.environ.get("PATH", "")
                  directories, tools, limits = inventory(original_path)
                  receipt.update(declaredImage="ubuntu-24.04", runnerImage={key: os.environ.get(key) for key in
                      ("ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH")}, originalPath=original_path,
                      controlledPath=CONTROLLED_PATH, originalPathLookup={name: shutil.which(name, path=original_path) for name in NAMES},
                      controlledPathLookup={name: shutil.which(name, path=CONTROLLED_PATH) for name in NAMES},
                      directories=directories, tools=tools, scopeLimits=limits, probes=[],
                      scope="Listed trusted directories only, shallow scan; absence here is not whole-filesystem absence")
                  probed = set()
                  with tempfile.TemporaryDirectory(prefix="empty-gdb-inventory-home-") as home:
                      for tool in tools:
                          if not tool["name"].startswith("gdb") or not tool["trustedExecutable"] or tool["realPath"] in probed:
                              continue
                          if len(probed) >= 4:
                              receipt["scopeLimits"].append("GDB controlled probes capped at4 unique real executables")
                              break
                          probed.add(tool["realPath"])
                          common = [tool["realPath"], "-nx", "-nh", "--batch"]
                          version = controlled_probe(common + ["--version"], home, 3)
                          readiness = controlled_probe(common + ["-iex", "set auto-load off", "-iex", "set auto-load safe-path /nonexistent",
                              "-iex", "set debuginfod enabled off", "-ex", 'python import sys; print("AEROVE_GDB_PYTHON_READY=" + sys.version.split()[0])'], home, 5)
                          ready = readiness["exitCode"] == 0 and readiness["stopped"] is None and bool(re.search(
                              r"(?m)^AEROVE_GDB_PYTHON_READY=\d+\.\d+\.\d+", readiness["stdout"]))
                          receipt["probes"].append(dict(realPath=tool["realPath"], version=version, pythonReadiness=readiness,
                              pythonReady=ready, autoLoadDisabled=True, debuginfodDisabled=True, emptyHome=True, attached=False))
                  receipt.update(completed=True, controlledGdbProbeCount=len(probed),
                      discoveredGdbExecutableCount=len({tool["realPath"] for tool in tools if tool["name"].startswith("gdb") and tool["trustedExecutable"]}),
                      gdbAbsenceClaim="No whole-filesystem absence claim; inspect inventory scope and actual controlled probes")
              except Exception as error:
                  receipt["failure"] = dict(type=type(error).__name__, message=str(error) if isinstance(error, ValueError) else "Bounded inventory failed")
                  raise SystemExit(1)
              finally:
                  (out / "HOST-TOOLS-EVIDENCE.json").write_text(json.dumps(receipt, indent=2) + "\n")


          if __name__ == "__main__":
              main()
          PY
      - name: Preserve small evidence-only receipt even on failure
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Evidence-only-runner-host-tools-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostic-evidence/host-tools/out/
          if-no-files-found: error
          retention-days: 7
