name: Lite ABI build
defaults:
  run:
    shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
'on':
  workflow_call:
    inputs:
      abi:
        required: true
        type: string
      target:
        required: true
        type: string
    secrets:
      AEROVE_LITE_KEYSTORE:
        required: true
      AEROVE_LITE_KEYSTORE_PASSWORD:
        required: true
permissions:
  contents: read
  actions: read
env:
  NDK_VERSION: 28.2.13676358
  FLUTTER_VERSION: '3.47.6'
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Install the pinned Android toolchain
      run: sdkmanager "ndk;$NDK_VERSION"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.98.1
        targets: ${{ inputs.target }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: apps/aerove-lite/meow-native -> target
        key: lite-${{ inputs.target }}-${{ env.NDK_VERSION }}-rust1.98.1
        cache-workspace-crates: true
        cache-directories: |-
          apps/aerove-lite/meow-native/.upstream
          apps/aerove-lite/meow-native/build
    - name: Build the pinned Rust Android bridge
      run: python3 apps/aerove-lite/tool/ci_artifacts.py native --abi "${{ inputs.abi }}" --target "${{ inputs.target }}" --ndk "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
    - name: Seal native build inputs
      run: |-
        mkdir -p "$RUNNER_TEMP/lite-core/jniLibs"
        cp -r apps/aerove-lite/app/src/main/jniLibs/${{ inputs.abi }} "$RUNNER_TEMP/lite-core/jniLibs/"
        cp apps/aerove-lite/meow-native/build/${{ inputs.abi }}-receipt.json "$RUNNER_TEMP/lite-core/provenance.json"
        python3 apps/aerove-lite/tool/ci_artifacts.py seal --directory "$RUNNER_TEMP/lite-core" --abi "${{ inputs.abi }}"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Lite-core-${{ inputs.abi }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-core/
        if-no-files-found: error
        compression-level: 0
    name: rust
  helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Install the pinned Android toolchain
      run: sdkmanager "ndk;$NDK_VERSION"
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.27.1
        cache-dependency-path: apps/aerove-lite/regexp2/go.sum
    - name: Build the isolated client helper for this ABI
      id: client_helper
      shell: nice -n 19 bash --noprofile --norc -eo pipefail {0}
      run: |
        python3 apps/aerove-lite/tool/ci_artifacts.py android-helper --go "$(go env GOROOT)/bin/go" \
          --ndk "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" --abi '${{ inputs.abi }}' \
          --directory "$RUNNER_TEMP/aerove-client-helper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.abi }}" \
          --destination apps/aerove-lite/app/src/main/jniLibs 2>&1 | tee "$RUNNER_TEMP/lite-client-helper-${{ inputs.abi }}.log"
    - name: Preserve the client helper build receipt
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AEROVE-Lite-client-helper-${{ inputs.abi }}-attempt-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/aerove-client-helper-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.abi }}/build-receipt.json
          ${{ runner.temp }}/lite-client-helper-${{ inputs.abi }}.log
        if-no-files-found: warn
    - name: Seal helper build inputs
      run: |-
        mkdir -p "$RUNNER_TEMP/lite-helper/jniLibs"
        cp -r apps/aerove-lite/app/src/main/jniLibs/${{ inputs.abi }} "$RUNNER_TEMP/lite-helper/jniLibs/"
        cp "$RUNNER_TEMP/aerove-client-helper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.abi }}/build-receipt.json" "$RUNNER_TEMP/lite-helper/"
        python3 apps/aerove-lite/tool/ci_artifacts.py seal --directory "$RUNNER_TEMP/lite-helper" --abi "${{ inputs.abi }}"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Lite-helper-${{ inputs.abi }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-helper/
        if-no-files-found: error
        compression-level: 0
    name: helper
  package:
    needs:
    - rust
    - helper
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      AEROVE_LITE_KEYSTORE_PASSWORD: ${{ secrets.AEROVE_LITE_KEYSTORE_PASSWORD }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: ./.github/actions/flutter
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '16111833'
    - name: Install the pinned Android toolchain
      run: |-
        sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0' "ndk;$NDK_VERSION"
        test -f "$ANDROID_SDK_ROOT/platforms/android-37.1/android.jar"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.98.1
        targets: ${{ inputs.target }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: apps/aerove/plugins/rust_api/rust -> target
        key: lite-flutter-assets-${{ inputs.target }}-rust1.98.1
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      with:
        gradle-version: 9.6.0
        cache-read-only: false
    - name: Resolve the canonical shared Flutter client graph
      working-directory: apps/aerove-lite
      run: flutter pub get --enforce-lockfile
    - name: Fetch exact same-run build inputs
      run: python3 apps/aerove-lite/tool/ci_artifacts.py fetch --name "Lite-core-${{ inputs.abi }}-attempt-${{ github.run_attempt }}" --destination "$RUNNER_TEMP/lite-core" --abi "${{ inputs.abi }}"
    - name: Fetch exact same-run build inputs
      run: python3 apps/aerove-lite/tool/ci_artifacts.py fetch --name "Lite-helper-${{ inputs.abi }}-attempt-${{ github.run_attempt }}" --destination "$RUNNER_TEMP/lite-helper" --abi "${{ inputs.abi }}"
    - name: Restore verified native inputs
      run: |-
        mkdir -p apps/aerove-lite/app/src/main/jniLibs apps/aerove-lite/meow-native/build "$RUNNER_TEMP/aerove-client-helper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.abi }}"
        cp -r "$RUNNER_TEMP/lite-core/jniLibs/"* apps/aerove-lite/app/src/main/jniLibs/
        cp -r "$RUNNER_TEMP/lite-helper/jniLibs/"* apps/aerove-lite/app/src/main/jniLibs/
        cp "$RUNNER_TEMP/lite-core/provenance.json" apps/aerove-lite/meow-native/build/${{ inputs.abi }}-receipt.json
        cp "$RUNNER_TEMP/lite-helper/build-receipt.json" "$RUNNER_TEMP/aerove-client-helper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.abi }}/"
    - name: Prepare the independent Lite release signing identity
      env:
        KEYSTORE_BASE64: ${{ secrets.AEROVE_LITE_KEYSTORE }}
      run: |
        python3 - <<'PY'
        import base64, os
        from pathlib import Path
        encoded = os.environ['KEYSTORE_BASE64']
        if not encoded or not os.environ['AEROVE_LITE_KEYSTORE_PASSWORD']:
            raise SystemExit('The independent Lite signing secrets are required')
        target = Path(os.environ['RUNNER_TEMP']) / 'aerove-lite.p12'
        target.write_bytes(base64.b64decode(encoded, validate=True))
        target.chmod(0o600)
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'AEROVE_LITE_KEYSTORE_PATH={target}\n')
        PY
    - name: Signed preview ARM64 APK
      if: inputs.abi == 'arm64-v8a'
      working-directory: apps/aerove-lite
      run: |
        gradle --no-daemon -p android :app:assembleRelease :platform-qa:assembleRelease --dry-run -Ptarget-platform=android-arm64 -PliteAbi=arm64-v8a -PsourceSha="$GITHUB_SHA" > "$RUNNER_TEMP/lite-platform-one-build-graph.txt"
        gradle --no-daemon -p android :app:assembleRelease :platform-qa:assembleRelease -Ptarget-platform=android-arm64 -PliteAbi=arm64-v8a -PsourceSha="$GITHUB_SHA" | tee "$RUNNER_TEMP/lite-platform-one-build.log"
    - name: Build the emulator production Flutter APK once
      id: emulator_app
      if: inputs.abi == 'x86_64'
      working-directory: apps/aerove-lite
      run: |
        gradle --no-daemon -p android :app:assembleRelease :platform-qa:assembleRelease --dry-run -Ptarget-platform=android-x64 -PliteAbi=x86_64 -PsourceSha="$GITHUB_SHA" > "$RUNNER_TEMP/lite-platform-one-build-graph.txt"
        gradle --no-daemon -p android :app:assembleRelease :platform-qa:assembleRelease -Ptarget-platform=android-x64 -PliteAbi=x86_64 -PsourceSha="$GITHUB_SHA" | tee "$RUNNER_TEMP/lite-platform-one-build.log"
    - name: Check the signed APK and record its exact provenance
      id: apk_inspection
      run: |
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs \
          apps/aerove-lite/build/app/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/lite-signature.txt"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" dump badging \
          apps/aerove-lite/build/app/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/lite-badging.txt"
        python3 apps/aerove-lite/tool/verify_apk.py \
          --apk apps/aerove-lite/build/app/outputs/apk/release/app-release.apk --channel preview \
          --abi '${{ inputs.abi }}' --source "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})" \
          --workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT" \
          --badging "$RUNNER_TEMP/lite-badging.txt" --signature "$RUNNER_TEMP/lite-signature.txt" \
          --helper-receipt "$RUNNER_TEMP/aerove-client-helper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.abi }}/build-receipt.json" \
          --native-receipt "$RUNNER_TEMP/lite-core/provenance.json" \
          --helper-source-root apps/aerove-lite/regexp2 --output "$RUNNER_TEMP/lite-artifact-${{ inputs.abi }}"
    - name: Build the independent Flutter runner without rebuilding the production APK
      id: emulator_runner
      working-directory: apps/aerove-lite
      env:
        LITE_BUILD_ABI: ${{ inputs.abi }}
      run: |
        production_apk=build/app/outputs/apk/release/app-release.apk
        sha256sum "$production_apk" > "$RUNNER_TEMP/lite-production-before-runner.sha256"
        gradle --no-daemon -p android-qa assembleRelease --dry-run \
          | tee "$RUNNER_TEMP/lite-flutter-runner-task-graph.txt"
        python3 - <<'PY'
        import os, re
        from pathlib import Path
        graph = (Path(os.environ['RUNNER_TEMP']) / 'lite-flutter-runner-task-graph.txt').read_text()
        graph = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', graph)
        tasks = []
        for line in graph.splitlines():
            match = re.fullmatch(r'(?:> Task\s+)?(:\S+)\s+SKIPPED', line.strip())
            if match:
                tasks.append(match.group(1))
        if not tasks or ':assembleRelease' not in tasks or ':prepareDriverSource' not in tasks:
            raise SystemExit('Independent runner task graph is missing its real source or packaging producer')
        if any(task.count(':') != 1 or re.search(r'flutter|meow|helper|r8|minify', task, re.I) for task in tasks):
            raise SystemExit('Independent runner task graph entered a production or minification task')
        PY
        gradle --no-daemon -p android-qa assembleRelease
        sha256sum --check "$RUNNER_TEMP/lite-production-before-runner.sha256"
        if [ "$LITE_BUILD_ABI" = arm64-v8a ]; then
          sha256sum "$production_apk" > "$RUNNER_TEMP/lite-production-after-runner.sha256"
        fi
        runner_apk=$(python3 - <<'PY'
        import json
        from pathlib import Path
        directory = Path('android-qa/build/outputs/apk/release')
        metadata = json.loads((directory / 'output-metadata.json').read_text())
        outputs = metadata['elements']
        if metadata['variantName'] != 'release' or len(outputs) != 1 or outputs[0]['filters']:
            raise SystemExit('Expected one unfiltered release driver APK from AGP metadata')
        name = outputs[0]['outputFile']
        if Path(name).name != name or not name.endswith('.apk') or any(c in name for c in '\r\n'):
            raise SystemExit('Driver APK metadata must name one file in its output directory')
        apk = directory / name
        if apk.is_symlink() or not apk.is_file():
            raise SystemExit('AGP driver APK output is missing or non-regular')
        print(apk.resolve())
        PY
        )
        export AEROVE_LITE_DRIVER_APK="$runner_apk"
        printf 'AEROVE_LITE_DRIVER_APK=%s\n' "$runner_apk" >> "$GITHUB_ENV"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$runner_apk" \
          | tee "$RUNNER_TEMP/lite-flutter-runner-signature.txt"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$runner_apk" \
          > "$RUNNER_TEMP/lite-flutter-runner-badging.txt"
        "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" dump xmltree "$runner_apk" AndroidManifest.xml \
          > "$RUNNER_TEMP/lite-flutter-runner-manifest.txt"
        python3 - <<'PY'
        import hashlib, json, os, re
        from pathlib import Path
        directory = Path(os.environ['RUNNER_TEMP'])
        info = json.loads((directory / ('lite-artifact-' + os.environ['LITE_BUILD_ABI']) / 'BUILD_INFO.json').read_text())
        app = Path('build/app/outputs/apk/release/app-release.apk')
        runner = Path(os.environ['AEROVE_LITE_DRIVER_APK'])
        digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
        if app.is_symlink() or digest(app) != info['apk_sha256']:
            raise SystemExit('Building the runner changed the sealed production APK')
        signature = (directory / 'lite-flutter-runner-signature.txt').read_text()
        signers = re.findall(r'^(?:Signer #\d+|V2 Signer):? certificate SHA-256 digest: ([0-9a-f]{64})$', signature, re.M)
        if signers != [info['signer_sha256']]:
            raise SystemExit('Runner does not have the sealed production signing identity')
        badging = (directory / 'lite-flutter-runner-badging.txt').read_text()
        package = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'", badging, re.M)
        if (package is None or package.groups() != ('dev.aerove.lite.test', str(info['version_code']), info['version'])
                or 'launchable-activity:' in badging):
            raise SystemExit('Unexpected runner package, version or launcher')
        manifest = (directory / 'lite-flutter-runner-manifest.txt').read_text()
        if (len(re.findall(r'E: instrumentation(?: |$)', manifest, re.M)) != 1
                or not re.search(r'android:name[^=]*="androidx.test.runner.AndroidJUnitRunner"', manifest)
                or not re.search(r'android:targetPackage[^=]*="dev.aerove.lite"', manifest)
                or not re.search(r'android:testOnly[^=]*=\(type 0x12\)0xffffffff', manifest)):
            raise SystemExit('Runner manifest is not the independent test-only Flutter driver')
        receipt = dict(schema=1, source=os.environ['GITHUB_SHA'], productionApkSha256=digest(app),
                       testApkSha256=digest(runner), signerSha256=info['signer_sha256'],
                       taskGraphSha256=digest(directory / 'lite-flutter-runner-task-graph.txt'),
                       productionApkUnchanged=True, androidExecuted=False)
        (directory / 'lite-flutter-runner-build.json').write_text(json.dumps(receipt, indent=2) + '\n')
        PY
    - name: Fetch actual same-run cancellation Green prerequisite
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: AEROVE-Lite-profile-cancel-green-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-profile-cancel-green
    - name: Seal the same-target platform runner without another App build
      if: ${{ !cancelled() && steps.emulator_runner.outcome == 'success' }}
      working-directory: apps/aerove-lite
      run: |
        python3 tool/seal_platform_runner.py \
          --info "$RUNNER_TEMP/lite-artifact-${{ inputs.abi }}/BUILD_INFO.json" \
          --app build/app/outputs/apk/release/app-release.apk \
          --test build/flutter-host/platform-qa/outputs/apk/release/platform-qa-release.apk \
          --mapping build/app/outputs/mapping/release/mapping.txt \
          --profile-cancel-implementation "$RUNNER_TEMP/lite-profile-cancel-green/implementation.json" \
          --profile-cancel-green "$RUNNER_TEMP/lite-profile-cancel-green/green.json" \
          --profile-cancel-evidence "$RUNNER_TEMP/lite-profile-cancel-green/evidence" \
          --abi-rules build/app/intermediates/androidTestAppKeepRules/release/rules.pro \
          --abi-report build/app/intermediates/androidTestAppKeepRules/release/inputs.json \
          --test-mapping build/flutter-host/platform-qa/outputs/mapping/release/mapping.txt \
          --test-configuration build/flutter-host/platform-qa/outputs/mapping/release/configuration.txt \
          --graph "$RUNNER_TEMP/lite-platform-one-build-graph.txt" \
          --driver app/src/androidTest/java/dev/aerove/lite/FlutterProductionUiTest.kt \
          --apksigner "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" \
          --apkanalyzer "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
          --output "$RUNNER_TEMP/lite-platform-seal"
    - name: Preserve the built target APK and runner evidence
      if: ${{ !cancelled() && steps.emulator_runner.outcome == 'success' }}
      working-directory: apps/aerove-lite
      env:
        APK_INSPECTION_OUTCOME: ${{ steps.apk_inspection.outcome }}
        LITE_BUILD_ABI: ${{ inputs.abi }}
      run: |
        diagnostic_root="$RUNNER_TEMP/lite-runtime-diagnostics"
        if [ "$LITE_BUILD_ABI" = arm64-v8a ]; then
          diagnostic_root="$RUNNER_TEMP/lite-arm-platform-diagnostics"
        fi
        mkdir -p "$diagnostic_root/apks" "$diagnostic_root/dependencies"
        cp build/app/outputs/apk/release/app-release.apk "$diagnostic_root/apks/"
        if [ -f "$RUNNER_TEMP/lite-artifact-${{ inputs.abi }}/BUILD_INFO.json" ]; then
          cp "$RUNNER_TEMP/lite-artifact-${{ inputs.abi }}/BUILD_INFO.json" "$diagnostic_root/"
        fi
        cp "$RUNNER_TEMP/aerove-client-helper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.abi }}/build-receipt.json" "$diagnostic_root/client-helper-build-receipt.json"
        cp "$RUNNER_TEMP/lite-signature.txt" "$RUNNER_TEMP/lite-badging.txt" "$diagnostic_root/"
        cp "$AEROVE_LITE_DRIVER_APK" "$diagnostic_root/apks/app-release-androidTest.apk"
        cp build/flutter-host/platform-qa/outputs/apk/release/platform-qa-release.apk "$diagnostic_root/apks/"
        cp -R "$RUNNER_TEMP/lite-platform-seal/." "$diagnostic_root/"
        cp "$RUNNER_TEMP/lite-platform-one-build-graph.txt" "$RUNNER_TEMP/lite-platform-one-build.log" "$diagnostic_root/"
        if [ "$LITE_BUILD_ABI" = arm64-v8a ]; then
          cp "$RUNNER_TEMP/lite-production-before-runner.sha256" "$RUNNER_TEMP/lite-production-after-runner.sha256" "$diagnostic_root/"
        fi
        if gradle --no-daemon -p android :platform-qa:dependencies --configuration releaseRuntimeClasspath \
          -PliteAbi=${{ inputs.abi }} -PsourceSha="$GITHUB_SHA" \
          > "$diagnostic_root/dependencies/platform-releaseRuntimeClasspath.stdout.txt" \
          2> "$diagnostic_root/dependencies/platform-releaseRuntimeClasspath.stderr.txt"; then
          platform_query_exit=0
        else
          platform_query_exit=$?
        fi
        printf '%s\n' "$platform_query_exit" > "$diagnostic_root/dependencies/platform-releaseRuntimeClasspath.exit.txt"
        test "$platform_query_exit" = 0
        cp "$RUNNER_TEMP/lite-flutter-runner-build.json" "$RUNNER_TEMP/lite-flutter-runner-task-graph.txt" \
          "$RUNNER_TEMP/lite-flutter-runner-signature.txt" "$RUNNER_TEMP/lite-flutter-runner-badging.txt" \
          "$RUNNER_TEMP/lite-flutter-runner-manifest.txt" "$diagnostic_root/"
        for variant in release; do
          for report in mapping.txt usage.txt seeds.txt configuration.txt; do
            original="build/app/outputs/mapping/$variant/$report"
            if [ -f "$original" ]; then
              mkdir -p "$diagnostic_root/mapping/$variant"
              cp "$original" "$diagnostic_root/mapping/$variant/"
            fi
          done
        done
        for configuration in releaseRuntimeClasspath; do
          if gradle --no-daemon -p android :app:dependencies --configuration "$configuration" \
              -PliteAbi=${{ inputs.abi }} -PsourceSha="$GITHUB_SHA" \
              > "$diagnostic_root/dependencies/$configuration.stdout.txt" \
              2> "$diagnostic_root/dependencies/$configuration.stderr.txt"; then
            query_exit=0
          else
            query_exit=$?
          fi
          printf '%s\n' "$query_exit" > "$diagnostic_root/dependencies/$configuration.exit.txt"
        done
        python3 - <<'PY'
        import hashlib, json, os, subprocess
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / ('lite-runtime-diagnostics' if os.environ['LITE_BUILD_ABI'] == 'x86_64' else 'lite-arm-platform-diagnostics')
        files = sorted(path for path in root.rglob('*') if path.is_file())
        manifest = [{'path': path.relative_to(root).as_posix(), 'bytes': path.stat().st_size,
                     'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in files]
        (root / 'SHA256SUMS').write_text(''.join(f"{item['sha256']}  {item['path']}\n" for item in manifest))
        source = {'sourceRevision': os.environ['GITHUB_SHA'],
                  'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                  'workflowRun': os.environ['GITHUB_RUN_ID'], 'runNumber': int(os.environ['GITHUB_RUN_NUMBER']),
                  'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'abi': os.environ['LITE_BUILD_ABI'], 'prebuiltApks': True,
                  'apkInspectorOutcome': os.environ['APK_INSPECTION_OUTCOME'], 'files': manifest}
        (root / 'source-manifest.json').write_text(json.dumps(source, indent=2) + '\n')
        PY
    - name: Upload the built x86 runtime contract
      if: ${{ !cancelled() && inputs.abi == 'x86_64' && steps.emulator_runner.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AEROVE-Lite-runtime-contract-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-runtime-diagnostics/
        if-no-files-found: error
    - name: Upload the original ARM64 APK and same-target runner evidence
      if: ${{ !cancelled() && inputs.abi == 'arm64-v8a' && steps.emulator_runner.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AEROVE-Lite-arm64-platform-runner-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-arm-platform-diagnostics/
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: inputs.abi == 'arm64-v8a'
      with:
        name: AEROVE-Lite-preview-arm64-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-artifact-arm64-v8a/
        if-no-files-found: error
    - name: Preserve package diagnostics
      if: ${{ always() }}
      run: |-
        mkdir -p "$RUNNER_TEMP/lite-package-diagnostics"
        git status --short > "$RUNNER_TEMP/lite-package-diagnostics/git-status.txt"
        git diff --binary > "$RUNNER_TEMP/lite-package-diagnostics/generated.patch"
        if [[ '${{ job.status }}' != success ]]; then
          if [[ -d "$RUNNER_TEMP/lite-artifact-${{ inputs.abi }}" ]]; then
            cp -R "$RUNNER_TEMP/lite-artifact-${{ inputs.abi }}" "$RUNNER_TEMP/lite-package-diagnostics/staged-app"
          elif [[ -f apps/aerove-lite/build/app/outputs/apk/release/app-release.apk ]]; then
            cp apps/aerove-lite/build/app/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lite-package-diagnostics/unverified-app-release.apk"
          fi
          if [[ -d apps/aerove-lite/android-qa/build/outputs/apk/release ]]; then
            cp -R apps/aerove-lite/android-qa/build/outputs/apk/release "$RUNNER_TEMP/lite-package-diagnostics/flutter-driver-release"
          fi
          if [[ -d apps/aerove-lite/build/flutter-host/platform-qa/outputs/apk/release ]]; then
            cp -R apps/aerove-lite/build/flutter-host/platform-qa/outputs/apk/release "$RUNNER_TEMP/lite-package-diagnostics/platform-release"
          fi
        fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: AEROVE-Lite-package-diagnostics-${{ inputs.abi }}-attempt-${{ github.run_attempt }}
        path: |-
          apps/aerove-lite/build/app/reports/
          apps/aerove-lite/build/app/intermediates/androidTestAppKeepRules/
          apps/aerove-lite/build/app/outputs/androidTest-results/
          apps/aerove-lite/build/app/outputs/mapping/release/
          apps/aerove-lite/build/flutter-host/platform-qa/outputs/mapping/release/
          apps/aerove-lite/android-qa/build/reports/
          ${{ runner.temp }}/lite-badging.txt
          ${{ runner.temp }}/lite-signature.txt
          ${{ runner.temp }}/lite-core/provenance.json
          ${{ runner.temp }}/lite-flutter-runner-*
          ${{ runner.temp }}/lite-platform-*
          ${{ runner.temp }}/lite-production-before-runner.sha256
          ${{ runner.temp }}/lite-package-diagnostics/
        if-no-files-found: warn
    name: package
