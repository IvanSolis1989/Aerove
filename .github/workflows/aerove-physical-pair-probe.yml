name: AEROVE ARM64 isolated physical pair build probe
'on':
  push:
    branches:
      - dot/aerove-physical-pair-probe-20261126
    paths:
      - '.github/workflows/aerove-physical-pair-probe.yml'
      - 'apps/aerove-lite/tool/physical_socket_fixture/**'
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.repository == 'IvanSolis1989/Aerove' && github.ref == 'refs/heads/dot/aerove-physical-pair-probe-20261126' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FLUTTER_VERSION: '3.47.6'
      BASE: d1b2db996af6142fbb299059c4de1b50df7dac38
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 6
          persist-credentials: false
      - name: Check exact parent and diagnostic-only source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6cf64ae87ea9b3e975e9f444efde20e36a677fa7
          test "$(git rev-parse HEAD^^)" = 8e9b4b02a958763659a9f8e88c4942ea21575a9a
          test "$(git rev-parse HEAD~3)" = 9ed581978bd2afdbc0ec58cf1320e3310db659e8
          test "$(git rev-parse HEAD~4)" = 8a5f5cef5207c97b93891fd1cd53fa0afd76cc17
          test "$(git rev-parse HEAD~5)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = 04dd07698f78b6b3fcf21bf5325f2f68a1483be5
          git diff --name-only -z "$BASE" HEAD | python3 -c '
          import re, sys
          rows=sys.stdin.buffer.read().split(b"\0")[:-1]
          assert rows and all(re.fullmatch(
              rb"\.github/workflows/aerove-physical-pair-probe\.yml|apps/aerove-lite/tool/physical_socket_fixture/(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+", row
          ) for row in rows), "Unexpected change outside diagnostic scope"
          '
          df -h "$GITHUB_WORKSPACE"
          free -m
      - uses: ./.github/actions/flutter
        with:
          flutter-version: '3.47.6'
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - name: Set up pinned ARM64 Android and Rust
        shell: bash
        run: |
          set -eu
          sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0' "ndk;$NDK_VERSION"
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
          (cd apps/aerove/plugins/rust_api/rust && rustup override set 1.99.0)
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: 9.6.0
          cache-disabled: true
      - name: Fetch only exact historical build inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/373-zips" "$RUNNER_TEMP/373-inputs"
          for id in 14793710109 14793311404 14792767188 14794000243; do
            gh api "repos/IvanSolis1989/Aerove/actions/artifacts/$id/zip" > "$RUNNER_TEMP/373-zips/$id.zip"
          done
          python3 apps/aerove-lite/tool/physical_socket_fixture/stage_original373.py "$RUNNER_TEMP/373-zips" "$RUNNER_TEMP/373-inputs"
      - name: Stage overlay and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          fixture=apps/aerove-lite/tool/physical_socket_fixture
          python3 "$fixture/prepare_physical_overlay.py" --source . --out "$RUNNER_TEMP/physical-overlay"
          cp -a "$RUNNER_TEMP/physical-overlay/." .
          app=apps/aerove-lite
          mkdir -p "$app/app/src/main/jniLibs" "$app/meow-native/build"
          cp -a "$RUNNER_TEMP/373-inputs/core/jniLibs/." "$app/app/src/main/jniLibs/"
          cp -a "$RUNNER_TEMP/373-inputs/helper/jniLibs/." "$app/app/src/main/jniLibs/"
          cp "$RUNNER_TEMP/373-inputs/core/provenance.json" "$app/meow-native/build/arm64-v8a-receipt.json"
          python3 "$fixture/kotlin_mirror_prefetch.py" "$GRADLE_USER_HOME"
          (cd "$app" && flutter pub get --enforce-lockfile)
          python3 tooling/sqlite_hook_prefetch.py "$app" --target android-arm64
          resource=$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --print-resource-dir)
          test -f "$resource/include/stdbool.h"
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          target_config="$GITHUB_WORKSPACE/apps/aerove/plugins/rust_api/rust/.cargo"
          mkdir -p "$target_config"
          test ! -e "$target_config/config.toml" && test ! -e "$target_config/config"
          printf '[env]\nBINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = { value = "--sysroot=%s -resource-dir=%s -isystem %s/include", force = true }\n' "$sysroot" "$resource" "$resource" > "$target_config/config.toml"
      - name: Isolate the Flutter ARM64 build task (no signing or packaging)
        shell: bash
        working-directory: apps/aerove-lite
        run: |
          set -euo pipefail
          umask 077
          temp=$(mktemp -d "$RUNNER_TEMP/flutter-only.XXXXXX")
          trap 'rm -rf -- "$temp"' EXIT
          unset AEROVE_LITE_KEYSTORE_PATH AEROVE_LITE_KEYSTORE_PASSWORD
          fixture="$PWD/tool/physical_socket_fixture"
          kotlin_init="$GRADLE_USER_HOME/init.d/aerove-pinned-kotlin.gradle"
          test -f "$kotlin_init" && test ! -L "$kotlin_init"
          fresh="$temp/gradle-home"
          install -d -m 700 "$fresh" "$GRADLE_USER_HOME/caches"
          ln -s "$GRADLE_USER_HOME/caches" "$fresh/caches"
          test -d "$GRADLE_USER_HOME/aerove-pinned-maven" && test ! -L "$GRADLE_USER_HOME/aerove-pinned-maven"
          ln -s "$GRADLE_USER_HOME/aerove-pinned-maven" "$fresh/aerove-pinned-maven"
          export AEROVE_FLUTTER_PHASES="$temp/phases"
          : > "$AEROVE_FLUTTER_PHASES"
          started=$SECONDS
          rc=0
          GRADLE_USER_HOME="$fresh" timeout --signal=TERM --kill-after=15s 12m gradle --no-daemon --console=plain \
            --max-workers=2 --stacktrace --info --init-script "$kotlin_init" --init-script "$fixture/flutter_only.init.gradle" \
            -p android -Ptarget-platform=android-arm64 -PliteAbi=arm64-v8a "-PsourceSha=$BASE" \
            "-PnativeMigration.fixtureDir=$RUNNER_TEMP/373-inputs/migration/retained-export" :app:compileFlutterBuildRelease \
            > "$temp/flutter.log" 2>&1 || rc=$?
          receipt_rc=0
          python3 "$fixture/flutter_only_report.py" "$temp/flutter.log" "$AEROVE_FLUTTER_PHASES" "$PWD" \
            "$rc" "$((SECONDS-started))" | tee -a "$GITHUB_STEP_SUMMARY" || receipt_rc=$?
          if (( rc != 0 )); then exit "$rc"; fi
          exit "$receipt_rc"
