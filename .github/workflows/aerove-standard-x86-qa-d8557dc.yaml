name: AEROVE Standard internal x86 QA (diagnostic only)

on:
  workflow_dispatch:
  push:
    branches: [codex/aerove-lite-meow-app]
    paths:
      - .github/workflows/aerove-standard-x86-qa-d8557dc.yaml
      - tooling/standard_x86_qa.py

permissions:
  contents: read
  actions: read

concurrency:
  group: standard-internal-x86-qa-d8557dc
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build_internal_qa:
    if: github.repository == 'IvanSolis1989/Aerove' && github.ref == 'refs/heads/codex/aerove-lite-meow-app' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true
      QA_VERSION_CODE: '2026102243'
      FORMAL_PLAN_RUN_ID: '40143599605'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - name: Read actual prior QA build state before compiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 harness/tooling/standard_x86_qa.py guard --directory "$RUNNER_TEMP/standard-x86-qa"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d8557dc664d0614339b7a8a676697367568f698e
          path: app
          submodules: recursive
          persist-credentials: false
      - name: Require the exact original verified source tree
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = d8557dc664d0614339b7a8a676697367568f698e
          test "$(git -C app rev-parse 'HEAD^{tree}')" = 70d19dcdaba20519bda88b545bbcbf113ba9d019
          test "$(git -C app rev-parse HEAD:apps/aerove)" = 5807e5924efb38f3db00da80f3ae078973a14094
          test -z "$(git -C app status --porcelain)"
          ! git -C app submodule status --recursive | grep -E '^[-+U]'
      - uses: IvanSolis1989/Aerove/.github/actions/flutter@d8557dc664d0614339b7a8a676697367568f698e
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
          cache-read-only: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
          targets: x86_64-linux-android
      - name: Restore the same persistent test signer without creating a key
        env:
          KEYSTORE_BASE64: ${{ secrets.XCLASH_ANDROID_DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Prepare pinned toolchain and dependencies before compilation
        working-directory: app/apps/aerove
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GRADLE_USER_HOME: ${{ runner.temp }}/standard-x86-qa-gradle
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/standard-x86-qa"
          mkdir -p "$root/toolchain"
          test "$QA_VERSION_CODE" = 2026102243
          jq -n --arg source d8557dc664d0614339b7a8a676697367568f698e --arg run "$GITHUB_RUN_ID" \
            --arg qa_number "$GITHUB_RUN_NUMBER" --arg code "$QA_VERSION_CODE" --arg formal_plan "$FORMAL_PLAN_RUN_ID" \
            '{diagnosticOnly:true,accepted:false,mainPromotionAllowed:false,source:$source,buildRun:$run,buildRunNumber:$qa_number,versionCode:$code,formalPlanCodeRun:$formal_plan,targetPlatform:"android-x64",actualReadback:false}' \
            > "$root/QA_BUILD_PENDING.json"
          flutter --version --machine > "$root/toolchain/flutter.json"
          test "$(jq -r .frameworkVersion "$root/toolchain/flutter.json")" = 3.47.6
          go version | tee "$root/toolchain/go.txt"
          grep -F 'go1.27.1 linux/amd64' "$root/toolchain/go.txt"
          rustc +1.99.0 --version > "$root/toolchain/rust.txt"
          grep -E '^rustc 1\.99\.0 ' "$root/toolchain/rust.txt"
          java -version > "$root/toolchain/java.txt" 2>&1
          grep -E 'version "17\.' "$root/toolchain/java.txt"
          cp "$ANDROID_NDK_HOME/source.properties" "$root/toolchain/ndk.properties"
          grep -E '^Pkg.Revision\s*=\s*28\.2\.13676358\s*$' "$root/toolchain/ndk.properties"
          flutter pub get 2>&1 | tee "$root/pub-get.log"
          git -C ../.. diff --exit-code HEAD
      - name: Build only the new x86 ABI once
        id: compile
        working-directory: app/apps/aerove
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GRADLE_USER_HOME: ${{ runner.temp }}/standard-x86-qa-gradle
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/standard-x86-qa"
          flutter build apk --no-pub --release --target-platform android-x64 \
            --build-name 0.11.0-beta.4 --build-number "$QA_VERSION_CODE" \
            --dart-define=APP_ENV=pre 2>&1 | tee "$root/build.log"
          cp build/app/outputs/flutter-apk/app-release.apk "$root/Aerove-standard-internal-qa-d8557dc-x86_64.apk"
      - name: Strict new-ABI APK readback and separate QA identity
        run: |
          set -euo pipefail
          sdkmanager --install 'build-tools;35.0.0' --channel=0
          python3 harness/tooling/standard_x86_qa.py verify --create \
            --directory "$RUNNER_TEMP/standard-x86-qa" --source-root "$GITHUB_WORKSPACE/app" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: Aerove-standard-internal-x86-qa-d8557dc
          path: |
            ${{ runner.temp }}/standard-x86-qa/Aerove-standard-internal-qa-d8557dc-x86_64.apk
            ${{ runner.temp }}/standard-x86-qa/QA_BUILD_INFO.json
            ${{ runner.temp }}/standard-x86-qa/QA_SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Std-internal-x86-d8557dc-build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/standard-x86-qa/toolchain/
            ${{ runner.temp }}/standard-x86-qa/apk-readback/
            ${{ runner.temp }}/standard-x86-qa/*.log
            ${{ runner.temp }}/standard-x86-qa/QA_BUILD_PENDING.json
            ${{ runner.temp }}/standard-x86-qa/once-guard/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && steps.compile.outcome != 'skipped' && steps.compile.outcome != ''
        with:
          name: Std-internal-x86-d8557dc-UNVERIFIED-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/standard-x86-qa/Aerove-standard-internal-qa-d8557dc-x86_64.apk
            ${{ runner.temp }}/standard-x86-qa/QA_BUILD_PENDING.json
          if-no-files-found: warn

  first_screen:
    needs: build_internal_qa
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QA_ARTIFACT_ID: ${{ needs.build_internal_qa.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build_internal_qa.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/standard-x86-qa-input
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '16111833'
      - name: Existing official API33 x86 image and KVM
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/standard-x86-qa-render"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/standard-x86-qa-avd"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$root/environment" "$ANDROID_AVD_HOME"
          timeout --kill-after=10s 300s sdkmanager --install 'build-tools;35.0.0' emulator 'system-images;android-33;google_apis;x86_64' --channel=0
          "$ANDROID_HOME/emulator/emulator" -no-window -version > "$root/environment/emulator-version.txt" 2>&1
          grep -E '37\.2\.12\.0.*16428233' "$root/environment/emulator-version.txt"
          image="$ANDROID_HOME/system-images/android-33/google_apis/x86_64"
          cp "$image/source.properties" "$root/environment/image-source.properties"
          cp "$image/build.prop" "$root/environment/image-build.prop"
          grep -E '^Pkg.Revision\s*=\s*17\s*$' "$image/source.properties"
          grep -E '^AndroidVersion.ApiLevel\s*=\s*33\s*$' "$image/source.properties"
          grep -E '^SystemImage.Abi\s*=\s*x86_64\s*$' "$image/source.properties"
          sha256sum "$image/system.img" > "$root/environment/image-system-sha256.txt"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          echo no | avdmanager create avd --force -n test --package 'system-images;android-33;google_apis;x86_64' --device pixel_6
          printf 'hw.cpu.ncore=2\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          cp "$ANDROID_AVD_HOME/test.avd/config.ini" "$root/environment/avd-config.ini"
      - name: Own emulator and strict QA first-screen probe without building
        run: |
          python3 harness/tooling/standard_x86_qa.py capture \
            --directory "$RUNNER_TEMP/standard-x86-qa-input" \
            --evidence "$RUNNER_TEMP/standard-x86-qa-render/runtime" \
            --harness "$GITHUB_WORKSPACE/harness" --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Std-internal-x86-d8557dc-first-screen-${{ github.run_id }}
          path: ${{ runner.temp }}/standard-x86-qa-render/
          if-no-files-found: warn
