[package]
name = "aerove-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[lib]
name = "aerove_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
clash-lib = { path = ".upstream/clash-rs/clash-lib", default-features = false, features = ["aerove-mobile", "tun", "ring", "shadowsocks", "tuic", "zero_copy", "ssh", "wireguard", "shadowquic", "tailscale"] }
jni = "=0.22.4"
libc = "0.2"
rquickjs = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
tokio-util = "0.7"

[dev-dependencies]
clash-lib = { path = ".upstream/clash-rs/clash-lib", default-features = false, features = ["aerove-mobile-tests"] }
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
shadowquic = { path = ".upstream/shadowquic" }
tailscale = { path = ".upstream/dependency-protect/tailscale-0.6.1" }
ts_control = { path = ".upstream/dependency-protect/ts_control-0.6.1" }
ts_derp = { path = ".upstream/dependency-protect/ts_derp-0.6.1" }
ts_netcheck = { path = ".upstream/dependency-protect/ts_netcheck-0.6.1" }
ts_netmon = { path = ".upstream/dependency-protect/ts_netmon-0.6.1" }
ts_runtime = { path = ".upstream/dependency-protect/ts_runtime-0.6.1" }
rustls = { git = "https://github.com/Watfaq/rustls.git", rev = "63d10d50f2308478f366f14f9f81e378f5911e3c" }
tokio-rustls = { git = "https://github.com/Watfaq/tokio-rustls.git", rev = "b26e3e2b7a0161d505fd12d6e545b16463f1a45f" }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "unwind"
