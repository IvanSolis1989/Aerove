name: aerove_lite
description: AEROVE Lite shared Flutter client with the independent Meow Android host.
publish_to: 'none'
# Synced from version.properties by android/sync_product.py.
version: 0.1.0-beta.25+25
environment:
  sdk: '>=3.10.0 <4.0.0'

hooks:
  user_defines:
    rust_api:
      build_assets: true

dependencies:
  flutter:
    sdk: flutter
  fl_clash:
    path: ../../packages/aerove_client

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - app/src/main/assets/scripts/smart-config-kit-meow.js
    - app/src/main/assets/scripts/smart-config-kit-meow.source.json
    - app/src/main/res/drawable-nodpi/aerove_lite_icon.png
