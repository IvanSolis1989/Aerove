[package]
name = "aerove-meow-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[lib]
name = "aerove_meow_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["ss", "trojan", "vless", "vless-vision", "vless-encryption", "ech-tls-tunnel", "vmess", "snell", "hysteria2", "mux", "kcptun", "anytls", "trusttunnel", "trusttunnel-h3"]
ss = ["meow-config/ss"]
trojan = ["meow-config/trojan"]
vless = ["meow-config/vless"]
vless-vision = ["vless", "meow-config/vless-vision"]
vless-encryption = ["vless", "meow-config/vless-encryption"]
ech-tls-tunnel = ["ss", "meow-config/ech-tls-tunnel"]
vmess = ["meow-config/vmess"]
snell = ["meow-config/snell"]
hysteria2 = ["meow-config/hysteria2"]
mux = ["ss", "meow-config/mux"]
kcptun = ["ss", "mux", "meow-config/kcptun"]
anytls = ["meow-config/anytls"]
trusttunnel = ["meow-config/trusttunnel"]
trusttunnel-h3 = ["trusttunnel", "meow-config/trusttunnel-h3"]

[dependencies]
meow-common = { path = ".upstream/meow-rs/crates/meow-common", features = ["aerove-android-runtime"] }
meow-dns = { path = ".upstream/meow-rs/crates/meow-dns", default-features = false, features = ["aerove-android-runtime"] }
meow-config = { path = ".upstream/meow-rs/crates/meow-config", default-features = false }
meow-tunnel = { path = ".upstream/meow-rs/crates/meow-tunnel" }
meow-listener = { path = ".upstream/meow-rs/crates/meow-listener", default-features = false, features = ["listener-mixed", "aerove-android-runtime"] }
meow-api = { path = ".upstream/meow-rs/crates/meow-api", default-features = false }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
jni = "=0.22.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Event-level rule YAML bound before serde_yaml loads a document: the same locked parser serde_yaml 0.9.34 drives.
unsafe-libyaml = "=0.2.11"
subtle = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
rquickjs = { version = "=0.12.2", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
ipnet = "2"
uuid = "1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Host-side zstd geodata streaming; the same locked 0.13.3 the fixed Core already links.
zstd = "=0.13.3"

[target.'cfg(unix)'.dependencies]
lwip = { package = "meow-lwip", path = ".upstream/meow-rs/crates/meow-lwip" }
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "=0.12.2", default-features = false, features = ["bindgen"] }

[dev-dependencies]
hickory-proto = "0.26"
boring = "5.2"
tokio-boring = "5.2"
meow-transport = { path = ".upstream/meow-rs/crates/meow-transport", default-features = false, features = ["tls"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
meow-anytls = { path = ".upstream/meow-rs/crates/meow-anytls", version = "0.26.1" }
