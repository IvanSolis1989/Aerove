[package]
name = "aerove-meow-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[lib]
name = "aerove_meow_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
meow-common = { path = ".upstream/meow-rs/crates/meow-common" }
meow-config = { path = ".upstream/meow-rs/crates/meow-config", default-features = false }
meow-tunnel = { path = ".upstream/meow-rs/crates/meow-tunnel" }
meow-listener = { path = ".upstream/meow-rs/crates/meow-listener", default-features = false, features = ["listener-mixed"] }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
jni = "=0.22.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
