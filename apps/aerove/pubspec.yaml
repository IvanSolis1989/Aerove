name: aerove_standard
description: A multi-platform proxy client based on ClashMeta, simple and easy to use, open-source and ad-free.
publish_to: 'none'
version: 0.11.0+2026102201
environment:
  sdk: '>=3.10.0 <4.0.0'

hooks:
  user_defines:
    setup:
      build_assets: true
    rust_api:
      build_assets: true

dependencies:
  flutter:
    sdk: flutter
  fl_clash:
    path: ../../packages/aerove_client
  setup:
    path: plugins/setup
dev_dependencies:
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.16.1
  args: ^2.7.0
  freezed: ^4.0.1
  riverpod_generator: ^4.0.9

  drift_dev: ^2.35.1
  intl_utils: ^2.8.16
  test: ^1.31.1
  sqlite3: ^3.7.0
  cross_file: ^0.3.5+5
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/icon.png
    - assets/images/icon.ico
    - core/Clash.Meta/component/ca/ca-certificates.crt
